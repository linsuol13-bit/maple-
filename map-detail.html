<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>맵 상세 · 로나월드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* =========================================================
   로나월드 — 디자인 토큰 (메이플 나무액자 퀘스트창 스타일)
   ========================================================= */
:root{
  --bg: #F5F3EF;
  --paper: #FFFFFF;
  --paper-soft: #F8F6F2;
  --wood: #D9D2C4;
  --wood-dark: #E4DFD3;
  --wood-light: #EFEAE0;
  --ink: #332C22;
  --ink-soft: #8C8172;
  --line: #EAE4D8;

  --leaf: #4C9A2A;
  --leaf-soft: #E7F3DC;
  --leaf-ink: #2C6614;

  --berry: #E2405F;
  --berry-soft: #FCE7EB;
  --berry-ink: #A01D3C;

  --sun: #F0A93A;
  --sun-soft: #FBEFD6;
  --sun-ink: #8A5A06;

  --sky: #3E9BD6;
  --sky-soft: #E5F2FA;
  --sky-ink: #1E5C86;

  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 9px;
  --pop: 0 10px 24px rgba(51,44,34,.09);
  --pop-sm: 0 4px 12px rgba(51,44,34,.07);
  --pop-md: 0 14px 34px rgba(51,44,34,.14);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height:1.55;
}
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
button{ font:inherit; }

.font-display{
  font-family: "Jua", "Pretendard", sans-serif;
  letter-spacing: -.01em;
}

.wrap{ max-width:1180px; margin:0 auto; padding:20px 18px 64px; }

/* ---------- 헤더 ---------- */
.site-header{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:16px; margin-bottom:18px; flex-wrap:wrap;
}
.site-title{
  display:flex; align-items:center; gap:10px;
}
.site-title .mark{
  width:44px; height:44px; flex:none;
  filter: drop-shadow(0 3px 6px rgba(51,44,34,.18));
}
.site-title h1{
  font-size:28px; margin:0; font-weight:400;
  color:var(--ink);
}
.site-title p{
  margin:3px 0 0; font-size:13px; color:var(--ink-soft); font-weight:600;
}
.reset-btn{
  border:1.5px solid var(--line); background:var(--paper);
  color:var(--ink); padding:9px 14px; border-radius:999px;
  cursor:pointer; font-size:13px; font-weight:700;
  box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.reset-btn:hover{ background: var(--sun-soft); }
.reset-btn:active{ transform: scale(.97); }

/* ---------- 탭 ---------- */
.tabs{
  display:flex; flex-wrap:wrap; gap:8px; padding:4px 4px 10px; margin-bottom:14px;
}
.tab{
  position:relative;
  flex:none;
  display:flex; align-items:center; gap:6px;
  border:1.5px solid var(--line); background:var(--paper);
  color: var(--ink);
  padding:9px 16px; border-radius:999px; cursor:pointer;
  font-size:14px; font-weight:700; white-space:nowrap;
  box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.tab:hover{ background: var(--paper-soft); }
.tab .n{
  font-size:11px; font-weight:800; padding:1px 7px; border-radius:999px;
  background: var(--bg); color: var(--ink); border:1.5px solid var(--line);
}
.tab.on{
  background: var(--sun); border-color: var(--sun); color:var(--ink);
}
.tab.on .n{ background: var(--paper); }
.tab-dropdown{
  display:none; position:absolute; top:100%; left:0; z-index:30;
  padding-top:8px; cursor:default;
}
.tab-dropdown-panel{
  background:#fff; border:1.5px solid var(--line); border-radius: var(--radius-md);
  box-shadow: var(--pop-md); padding:8px; min-width:180px;
  display:flex; flex-direction:column; gap:2px;
}
.tab:hover .tab-dropdown, .tab:focus-within .tab-dropdown{ display:block; }
.tab-dropdown-item{
  padding:8px 10px; border-radius:8px; font-size:13px; font-weight:700;
  color:var(--ink); white-space:nowrap; text-align:left; cursor:pointer;
}
.tab-dropdown-item:hover{ background: var(--paper-soft); }
.tab-dropdown-item.on{ background: var(--sun-soft); color:var(--sun-ink); }

/* ---------- 필터 보드 ---------- */
.board{
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:16px;
  margin-bottom:20px;
  box-shadow: var(--pop);
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
  gap:14px;
  position:relative;
}
.field label{
  display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:700;
}
.field input[type="text"],
.field input[type="number"],
.field select{
  width:100%; border:2px solid var(--line); background:#fff;
  border-radius: var(--radius-sm); padding:9px 11px; font-size:14px; color:var(--ink);
  font-weight:600;
}
.field input:focus, .field select:focus{
  outline:none; border-color: var(--sun);
}
.field-toggle{ display:flex; align-items:center; gap:8px; }
.field-toggle label{ margin-bottom:0; cursor:pointer; }
.field-toggle input[type="checkbox"]{ width:20px; height:20px; accent-color: var(--sun); cursor:pointer; }
.level-range-row{ display:flex; align-items:center; gap:6px; }
.lv-input{ min-width:0; flex:1 1 0; text-align:center; }
.lv-sep{ color:var(--ink-soft); flex:none; font-size:13px; font-weight:700; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; grid-column: 1 / -1; }
.filter-block{ grid-column: 1 / -1; display:flex; flex-direction:column; gap:12px; }
.filter-row{ display:flex; flex-direction:column; gap:6px; }
.filter-row-label{ font-size:12px; font-weight:800; color:var(--ink-soft); }
.tabs-row{ border-bottom:2px solid var(--line); padding-bottom:8px; }
.chip{
  border:1.5px solid var(--line); background:#fff; color:var(--ink);
  padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.chip:hover{ background: var(--paper-soft); }
.chip.on{
  background: var(--leaf); border-color:var(--leaf); color:#fff;
}
.hint{ grid-column: 1/-1; font-size:12px; color:var(--ink-soft); font-weight:600; }

/* ---------- 목록 그리드 ---------- */
.grid{
  display:grid; gap:16px;
  grid-template-columns: repeat(1, minmax(0,1fr));
}
@media (min-width:640px){ .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (min-width:980px){ .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
.hidden{ display:none !important; }

/* ---------- 카드 ---------- */
.qcard{
  position:relative;
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:16px 15px 13px;
  box-shadow: var(--pop-sm);
  display:block;
  transition: transform .15s ease, box-shadow .15s ease;
}
.qcard:hover{ transform: translateY(-3px); box-shadow: var(--pop); }
.qcard.owned{ background: var(--sun-soft); border-color: var(--sun); }
.fav-star{
  position:absolute; top:8px; right:8px; z-index:5;
  width:26px; height:26px;
  background: #fff; border:1.5px solid var(--line); border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; line-height:1; cursor:pointer;
  color: var(--ink-soft);
  box-shadow: var(--pop-sm);
  transition: transform .12s ease;
}
.qcard.owned .fav-star{ background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
.fav-star:hover{ transform: scale(1.1); }
.own-star-inline{
  background:none; border:none; font-size:22px; line-height:1; cursor:pointer;
  color:var(--sun-ink); vertical-align:middle; padding:0 0 0 4px;
}
.own-star-inline:hover{ transform:scale(1.15); display:inline-block; }
.fav-star-inline{
  background:none; border:none; font-size:22px; line-height:1; cursor:pointer;
  color:var(--sun-ink); vertical-align:middle; padding:0 0 0 4px;
}
.fav-star-inline:hover{ transform:scale(1.15); display:inline-block; }
.qcard .ribbon{
  position:absolute; top:-12px; left:16px; right:16px;
  display:flex; flex-wrap:wrap; gap:6px;
}
.ribbon-pill{
  font-size:11px; font-weight:800; padding:4px 10px 3px;
  border:1.5px solid var(--line);
  border-radius:999px; display:flex; align-items:center; gap:4px;
  box-shadow: var(--pop-sm);
}
.qcard .top{ display:flex; gap:10px; margin-top:10px; }
.qcard .thumb{
  width:54px; height:54px; object-fit:contain; background:#fff;
  border:1.5px solid var(--line); border-radius:11px; padding:5px; flex:none;
}
.qcard .meta-title{ min-width:0; }
.qcard .code{ font-size:11.5px; color:var(--ink-soft); font-weight:800; }
.qcard .title{ font-size:15.5px; font-weight:800; margin-top:1px; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.qcard .meta{ font-size:12px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
.qcard .exp-row{ margin-top:10px; }
.qcard .bar{ height:8px; border-radius:999px; background:#fff; overflow:hidden; border:1.5px solid var(--line); }
.qcard .bar > div{ height:100%; background: linear-gradient(90deg, var(--leaf), var(--sun)); }
.qcard .exp-text{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; text-align:right; font-weight:700; }
.qcard .card-body{ display:block; color:inherit; text-decoration:none; }

.qcard .job-row{ font-size:11px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
.qcard .reward-names{ font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.4; font-weight:600; }
.qcard .fame-chip{
  display:inline-flex; align-items:center; gap:3px; margin-top:6px;
  font-size:11px; font-weight:800; color:var(--sun-ink); background:var(--sun-soft);
  border:1.5px solid var(--sun);
  padding:2px 8px; border-radius:999px;
}

.qcard .complete-zone{ margin-top:11px; padding-top:11px; border-top:2px dashed var(--line); }
.complete-btn{
  width:100%; border:1.5px solid var(--line); background:var(--leaf-soft); color:var(--leaf-ink);
  font-weight:800; font-size:12.5px; padding:9px 10px; border-radius:var(--radius-sm);
  cursor:pointer; box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.complete-btn:hover{ background: var(--leaf); color:#fff; }
.complete-btn:active{ transform: scale(.98); }
.next-quest-btn{
  display:inline-block; background: var(--sun); color:var(--ink); font-weight:800; font-size:14px;
  padding:12px 22px; border-radius:999px; box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease;
}
.next-quest-btn:hover{ transform: translateY(-2px); box-shadow: var(--pop); }
.chain-nav-btn{
  display:inline-block; font-size:12px; font-weight:800; padding:6px 12px;
  border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  white-space:nowrap;
}
.chain-nav-btn:hover{ background: var(--paper-soft); }
.chain-nav-btn.disabled{ color: var(--ink-soft); opacity:.5; cursor:default; }
.done-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.done-badge{
  font-size:12px; font-weight:800; color:#fff; background:var(--leaf);
  border:1.5px solid var(--line);
  padding:6px 10px; border-radius:999px; flex:1; text-align:center;
}
.undo-btn{
  border:none; background:none; color:var(--ink-soft); font-size:11px; font-weight:700; cursor:pointer;
  text-decoration:underline; flex:none;
}
.choice-box{ display:flex; flex-direction:column; gap:6px; }
.choice-box .choice-label{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
.choice-item{
  display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; padding:6px 8px;
  border:2px solid var(--line); border-radius: var(--radius-sm); cursor:pointer; background:#fff;
}
.choice-item input{ accent-color: var(--leaf); }
.choice-confirm-btn{
  border:1.5px solid var(--line); background: var(--leaf); color:#fff; font-weight:800; font-size:12.5px;
  padding:8px 10px; border-radius: var(--radius-sm); cursor:pointer; margin-top:2px;
  box-shadow: var(--pop-sm);
}
.choice-confirm-btn:active{ transform: scale(.98); }

/* type color variants */
.t-talk.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-hunt.ribbon-pill{ background:var(--berry-soft); color:var(--berry-ink); }
.t-collect.ribbon-pill{ background:var(--sun-soft); color:var(--sun-ink); }
.t-deliver.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-use.ribbon-pill{ background:var(--sun-soft); color:var(--sun-ink); }
.t-move.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-investigate.ribbon-pill{ background:var(--leaf-soft); color:var(--leaf-ink); }
.t-etc.ribbon-pill{ background:#EEE4D2; color:var(--ink-soft); }

/* ---------- 빈 상태 ---------- */
.empty{
  grid-column: 1/-1;
  text-align:center; padding:56px 20px; color:var(--ink-soft);
  background: var(--paper-soft); border:3px dashed var(--wood-light);
  border-radius: var(--radius-lg);
}
.empty .big{ font-family:"Jua",sans-serif; font-size:19px; color:var(--ink); margin-bottom:6px; }

/* ---------- 상세 페이지 공통 ---------- */
.back-link{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800;
  color: var(--ink); margin-bottom:16px;
}
.back-link:hover{ color: var(--berry-ink); }

.detail-header{
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:20px 22px;
  margin-bottom:18px;
  box-shadow: var(--pop);
  position:relative;
}
.detail-header .type-tag{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800;
  border:1.5px solid var(--line);
  padding:4px 11px; border-radius:999px; margin-bottom:10px;
}
.detail-header h1{
  font-family:"Jua",sans-serif; font-weight:400; font-size:25px; margin:0 0 6px;
  text-shadow: 2px 2px 0 rgba(78,45,16,.15);
}
.detail-header .sub{ font-size:13px; color:var(--ink-soft); font-weight:700; }
.npc-place-list{ display:flex; flex-wrap:wrap; gap:9px; }
.npc-place-card{
  display:inline-flex; align-items:center; gap:8px;
  padding:5px 14px 5px 5px; flex:none;
  border:2px solid var(--line); border-radius:999px; background:#fff;
  text-decoration:none; color:inherit;
  transition:background .15s, border-color .15s;
  position:relative;
}
.npc-place-card:hover{ background:var(--paper-soft); border-color:var(--wood-light); }
.npc-place-card .icon{
  width:34px; height:34px; object-fit:contain; flex:none;
  border-radius:8px; border:2px solid var(--line); background:#fff; padding:3px;
}
.npc-place-card .txt .lbl{ font-size:10px; color:var(--ink-soft); font-weight:700; line-height:1.25; }
.npc-place-card .txt .val{ font-size:13px; font-weight:800; line-height:1.25; white-space:nowrap; }
.map-preview{
  position:absolute; left:0; top:calc(100% + 8px);
  transform:translateY(-4px) scale(.97); transform-origin: top left;
  width:260px; max-width:min(70vw,320px); background:#fff; padding:5px;
  border-radius:12px; border:1.5px solid var(--line); box-shadow:0 12px 26px rgba(51,44,34,.22);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .15s ease, transform .15s ease; z-index:60;
}
.map-preview img{ width:100%; height:auto; display:block; border-radius:8px; }
.npc-place-card:hover .map-preview{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }

/* ---------- NPC 판매 상품 호버 정보 ---------- */
.item-tooltip{
  position:absolute; left:0; top:calc(100% + 8px);
  transform:translateY(-4px) scale(.97); transform-origin: top left;
  width:220px; background:#fff; padding:10px 12px; text-align:left; color:var(--ink);
  border-radius:12px; border:1.5px solid var(--line); box-shadow:0 12px 26px rgba(51,44,34,.22);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .15s ease, transform .15s ease; z-index:70;
}
.item-tooltip-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.item-tooltip-head img{ width:32px; height:32px; object-fit:contain; border-radius:8px; border:1.5px solid var(--line); background:#fff; flex:none; }
.item-tooltip-head .name{ font-size:13px; font-weight:800; line-height:1.3; }
.item-tooltip-row{ font-size:11.5px; color:var(--ink-soft); padding:1.5px 0; }
.item-tooltip-row b{ color:var(--ink); font-weight:800; white-space:nowrap; }
.item-tooltip-desc{ font-size:11px; color:var(--ink-soft); margin-top:6px; padding-top:6px; border-top:1px solid var(--line); line-height:1.4; }

.item-chip-list{ display:flex; flex-wrap:wrap; gap:9px; }
.item-chip{
  display:inline-flex; align-items:center; gap:9px;
  padding:6px 16px 6px 6px; flex:none; position:relative;
  border:2px solid var(--line); border-radius:999px; background:#fff;
  text-decoration:none; color:inherit;
  transition:background .15s, border-color .15s;
}
.item-chip:hover{ background:var(--paper-soft); border-color:var(--wood-light); }
.item-chip:hover .item-tooltip{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
.item-hover-box{ position:relative; }
.item-hover-box:hover .item-tooltip{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }

/* ---------- 아이템 타일(3열 컴팩트) ---------- */
.item-tile-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap:8px; }
.item-tile{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px;
  padding:9px 4px; border:2px solid var(--line); border-radius:12px; background:#fff;
  text-decoration:none; color:inherit; position:relative;
  transition:background .15s, border-color .15s;
}
.item-tile:hover{ background:var(--paper-soft); border-color:var(--wood-light); }
.item-tile .thumb{ width:40px; height:40px; object-fit:contain; border-radius:8px; border:2px solid var(--line); background:#fff; padding:3px; }
.item-tile .val{ font-size:11.5px; font-weight:800; line-height:1.25; word-break:keep-all; }
.item-tile .lbl{ font-size:9.5px; color:var(--ink-soft); font-weight:700; }
.item-tile .item-tooltip{ left:0; right:auto; transform:translateY(-4px) scale(.97); transform-origin:top left; }
.item-tile.tooltip-flip .item-tooltip{ left:auto; right:0; transform-origin:top right; }
.item-tile:hover .item-tooltip{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
.item-tile .map-preview{ left:0; right:auto; transform:translateY(-4px) scale(.97); transform-origin:top left; }
.item-tile.tooltip-flip .map-preview{ left:auto; right:0; transform-origin:top right; }
.item-tile:hover .map-preview{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
.item-chip .icon{
  width:46px; height:46px; object-fit:contain; flex:none;
  border-radius:10px; border:2px solid var(--line); background:#fff; padding:3px;
}
.item-chip .txt .lbl{ font-size:10.5px; color:var(--ink-soft); font-weight:700; line-height:1.25; }
.item-chip .txt .val{ font-size:13.5px; font-weight:800; line-height:1.3; white-space:nowrap; }

.craft-card{
  border:2px solid var(--line); border-radius:12px; background:#fff; padding:2px 12px; margin-bottom:8px;
}
.craft-card[open]{ padding-bottom:10px; }
.craft-card-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  padding:8px 0; cursor:pointer; list-style:none;
}
.craft-card-head::-webkit-details-marker{ display:none; }
.craft-card-head::after{ content:'▾'; font-size:11px; color:var(--ink-soft); margin-left:auto; transition:transform .15s; }
.craft-card[open] .craft-card-head::after{ transform:rotate(180deg); }
.craft-card-head .item-chip, .craft-mats .item-chip{
  padding:4px 8px 4px 0; gap:6px; border:none; background:transparent; border-radius:0;
}
.craft-card-head .item-chip:hover, .craft-mats .item-chip:hover{ background:transparent; }
.craft-card-head .item-chip .icon, .craft-mats .item-chip .icon{
  border:none; background:transparent; border-radius:0; padding:0; object-fit:contain;
}
.craft-card-head .item-chip .icon{ width:30px; height:30px; }

<body>
<div class="wrap" style="max-width:1400px;">
  <a class="back-link" href="index.html?tab=maps">← 목록으로</a>
  <nav class="tabs" style="margin-bottom:16px;">
    <a class="tab" href="index.html?tab=quests">📜 퀘스트</a>
    <a class="tab" href="index.html?tab=monsters">🐾 몬스터</a>
    <a class="tab" href="index.html?tab=items">🎒 아이템</a>
    <a class="tab" href="index.html?tab=npc">💬 NPC</a>
    <a class="tab on" href="index.html?tab=maps">🗺️ 맵</a>
  </nav>

  <div id="detail"></div>
</div>

<script src="data-map-detail.js"></script>
<script>
(function(){
  'use strict';
  var QUEST_DETAILS = window.QUEST_DETAILS || {};
  var NPCS = window.NPCS || [];
  var MAPS = window.MAPS || [];
  var MONSTERS = window.MONSTERS || [];

  var params = new URLSearchParams(location.search);
  var code = params.get('code');
  var requestedName = params.get('name');

  var map = code
    ? MAPS.find(function(m){ return String(m.code)===String(code); })
    : MAPS.find(function(m){ return requestedName && String(m.name)===String(requestedName); });
  if (map && !code) code = map.code;

  function safeImg(src, alt, cls){
    var d = 'https://placehold.co/300x180/FFF9F0/9A8574?text=%20';
    return '<img src="'+(src||d)+'" alt="'+(alt||'')+'" class="'+(cls||'thumb')+'" onerror="this.onerror=null;this.src=\''+d+'\';">';
  }

  var $detail = document.getElementById('detail');

  // 맵 데이터가 아직 없어도, 이 코드로 등장하는 NPC/퀘스트는 보여준다 (이름은 코드로 대체 표시)
  var mapName = map ? map.name : null;

  var relatedNPCs = NPCS.filter(function(n){
    if (n.place && String(n.place.code)===String(code)) return true;
    if (Array.isArray(n.places) && n.places.some(function(pl){ return String(pl.code)===String(code); })) return true;
    return false;
  });
  function npcPlaceAt(n, mapCode){
    if (n.place && String(n.place.code)===String(mapCode)) return n.place;
    if (Array.isArray(n.places)){
      var found = n.places.find(function(pl){ return String(pl.code)===String(mapCode); });
      if (found) return found;
    }
    return null;
  }
  function monsterPlaceAt(mo, mapCode){
    if (mo.place && String(mo.place.code)===String(mapCode)) return mo.place;
    if (Array.isArray(mo.places)){
      var found = mo.places.find(function(pl){ return String(pl.code)===String(mapCode); });
      if (found) return found;
    }
    return null;
  }
  var relatedMonsters = MONSTERS.filter(function(m){
    if (m.place && String(m.place.code)===String(code)) return true;
    if (Array.isArray(m.places) && m.places.some(function(pl){ return String(pl.code)===String(code); })) return true;
    return false;
  });
  // (이름 추정용으로만 계산 — 화면에는 "이 위치의 퀘스트"를 따로 보여주지 않음)
  Object.keys(QUEST_DETAILS).forEach(function(qid){
    var d = QUEST_DETAILS[qid];
    var isStart = d.start && d.start.place && String(d.start.place.code)===String(code);
    var isFinish = d.finish && d.finish.place && String(d.finish.place.code)===String(code);
    if (!mapName){
      if (isStart) mapName = d.start.place.name;
      else if (isFinish) mapName = d.finish.place.name;
    }
  });

  if (!map && !relatedNPCs.length && !relatedMonsters.length){
    $detail.innerHTML = '<div class="notready"><div class="big font-display" style="font-family:Jua,sans-serif;font-size:18px;margin-bottom:6px;">맵을 찾을 수 없어요</div><div>주소의 코드 값을 다시 확인해 주세요.</div></div>';
    return;
  }

  var html = '';
  html += '<div class="detail-header">';
  if (map && map.img){
    var mapImgStyleExtra = map.imgWidth ? ('width:'+map.imgWidth+'px;max-width:none;') : 'width:100%;max-width:100%;';
    var hasCoordPortals = (map.portals && map.portals.some(function(p){ return p.x!=null && p.y!=null; }));
    if (hasCoordPortals){
      var zoomId = 'mz'+Math.random().toString(36).slice(2,9);
      var fitScale = 1;
      var zElStyle = 'position:relative;display:inline-block;';
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">';
      html += '<button type="button" data-zoom-out="'+zoomId+'" style="border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:800;font-size:13px;cursor:pointer;">－</button>';
      html += '<span id="'+zoomId+'-label" style="font-size:13px;font-weight:800;color:var(--ink-soft);min-width:44px;text-align:center;">'+Math.round(fitScale*100)+'%</span>';
      html += '<button type="button" data-zoom-in="'+zoomId+'" style="border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:800;font-size:13px;cursor:pointer;">＋</button>';
      html += '<button type="button" data-zoom-reset="'+zoomId+'" style="border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:800;font-size:13px;cursor:pointer;">초기화</button>';
      html += '</div>';
      html += '<div style="overflow:auto;max-height:75vh;border-radius:12px;border:1.5px solid var(--line);margin-bottom:14px;">';
      html += '<div id="'+zoomId+'" data-scale="'+fitScale+'" data-native-width="'+(map.imgWidth||'')+'" style="'+zElStyle+'">';
      html += '<img class="map-bg-img" src="'+map.img+'" alt="'+(mapName||'')+'" style="display:block;'+mapImgStyleExtra+'height:auto;" onerror="this.onerror=null;this.style.display=\'none\';">';
      var __normalGroups = {};
      var __normalOrder = [];
      map.portals.forEach(function(p){
        if (p.x==null || p.y==null) return;
        var isSameMapWarp = p.toCode && String(p.toCode)===String(map.code) && p.destX!=null && p.destY!=null;
        var ppxUnit = (p.unit === 'px' && map.imgWidth && map.imgHeight);
        var pLeftPct = ppxUnit ? (p.x / map.imgWidth * 100) : p.x;
        var pTopPct = ppxUnit ? (p.y / map.imgHeight * 100) : p.y;
        if (p.hideMarker){
          var hiddenHref = (p.toCode && !isSameMapWarp)
            ? ('map-detail.html?code='+p.toCode)
            : (p.toName ? ('map-detail.html?name='+encodeURIComponent(p.toName)) : '#');
          html += '<a href="'+hiddenHref+'" aria-label="'+(p.toName||'이동')+'" title="'+(p.note||'이동')+' → '+(p.toName||'')+'" style="position:absolute;left:'+pLeftPct+'%;top:'+pTopPct+'%;transform:translate(-50%,-50%);display:block;width:64px;height:64px;background:transparent;border:none;padding:0;cursor:pointer;"></a>';
          return;
        }
        if (isSameMapWarp){
          html += '<button type="button" data-warp-dest-x="'+(p.destX/map.imgWidth*100)+'" data-warp-dest-y="'+(p.destY/map.imgHeight*100)+'" title="'+(p.note||'이동')+' → '+(p.toName||'')+'" style="position:absolute;left:'+pLeftPct+'%;top:'+pTopPct+'%;transform:translate(-50%,-100%);display:block;background:none;border:none;padding:0;cursor:pointer;">';
          var pSizeW = (p.size || 80) * (map.iconScale || 2.0);
          html += '<img src="'+(p.icon||'https://drive.google.com/thumbnail?id=1rHD7zAqEeFaKPNE2nt8dNHbfwkokQ24o&sz=w200')+'" alt="포탈" style="display:block;height:'+pSizeW+'px;width:auto;" onerror="this.onerror=null;this.style.display=\'none\';this.parentElement.textContent=\'↑\';this.parentElement.style.cssText+=\'width:30px;height:30px;border-radius:50%;background:var(--sun);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:900;font-size:15px;\';">';
          html += '</button>';
          return;
        }
        var __key = pLeftPct+'_'+pTopPct;
        if (!__normalGroups[__key]){ __normalGroups[__key]=[]; __normalOrder.push(__key); }
        __normalGroups[__key].push({ p:p, l:pLeftPct, t:pTopPct });
      });
      __normalOrder.forEach(function(__key, __gi){
        var __grp = __normalGroups[__key];
        var __first = __grp[0];
        var pLeftPct = __first.l, pTopPct = __first.t;
        var __pSize = (__first.p.size || 80) * (map.iconScale || 2.0);
        var __iconUrl = __first.p.icon || 'https://drive.google.com/thumbnail?id=1rHD7zAqEeFaKPNE2nt8dNHbfwkokQ24o&sz=w200';
        if (__grp.length === 1){
          var p = __first.p;
          var href = p.toCode ? ('map-detail.html?code='+p.toCode) : (p.toName ? ('map-detail.html?name='+encodeURIComponent(p.toName)) : '#');
          html += '<a href="'+href+'" title="'+(p.note||'이동')+' → '+(p.toName||'')+'" style="position:absolute;left:'+pLeftPct+'%;top:'+pTopPct+'%;transform:translate(-50%,-100%);display:block;background:none;border:none;padding:0;cursor:pointer;">';
          html += '<img src="'+__iconUrl+'" alt="포탈" style="display:block;height:'+__pSize+'px;width:auto;" onerror="this.onerror=null;this.style.display=\'none\';this.parentElement.textContent=\'↑\';this.parentElement.style.cssText+=\'width:30px;height:30px;border-radius:50%;background:var(--sun);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:900;font-size:15px;\';">';
          html += '</a>';
        } else {
          var __menuId = zoomId+'-pm'+__gi;
          html += '<div style="position:absolute;left:'+pLeftPct+'%;top:'+pTopPct+'%;transform:translate(-50%,-100%);">';
          html += '<button type="button" data-portal-toggle="'+__menuId+'" title="목적지 선택" style="position:relative;display:block;background:none;border:none;padding:0;cursor:pointer;">';
          html += '<img src="'+__iconUrl+'" alt="포탈" style="display:block;height:'+__pSize+'px;width:auto;" onerror="this.onerror=null;this.style.display=\'none\';this.parentElement.textContent=\'↑\';this.parentElement.style.cssText+=\'width:30px;height:30px;border-radius:50%;background:var(--sun);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:900;font-size:15px;\';">';
          html += '<span style="position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 3px;border-radius:999px;background:var(--berry);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.3);">'+__grp.length+'</span>';
          html += '</button>';
          html += '<div id="'+__menuId+'" data-portal-menu style="display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;background:#fff;border:1.5px solid var(--line);border-radius:10px;box-shadow:var(--pop-md);padding:6px;white-space:nowrap;z-index:60;">';
          __grp.forEach(function(__item){
            var __gp = __item.p;
            var __ghref = __gp.toCode ? ('map-detail.html?code='+__gp.toCode) : (__gp.toName ? ('map-detail.html?name='+encodeURIComponent(__gp.toName)) : '#');
            html += '<a href="'+__ghref+'" style="display:block;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap;">'+(__gp.note||'이동')+' → '+(__gp.toName||'')+'</a>';
          });
          html += '</div>';
          html += '</div>';
        }
      });
      html += '</div>';
      html += '</div>';
    } else {
      html += '<div style="overflow-x:auto;border-radius:12px;border:1.5px solid var(--line);margin-bottom:14px;text-align:center;">';
      html += '<img src="'+map.img+'" alt="'+(mapName||'')+'" style="display:inline-block;'+mapImgStyleExtra+'height:auto;" onerror="this.onerror=null;this.style.display=\'none\';">';
      html += '</div>';
    }
  }
  html += '<h1 style="margin-bottom:2px;">' + (mapName || '이름 미등록 (코드 '+code+')') + '</h1>';
  html += '<div class="sub">' + (map && map.region ? map.region : '지역 정보 없음') + '</div>';
  html += '<a href="index.html?worldmap='+code+'" style="display:inline-block;margin-top:8px;margin-right:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:12.5px;text-decoration:none;">🗺️ 월드맵에서 위치 보기</a>';
  html += '<a href="index.html?routeTo=map:'+encodeURIComponent(code)+'" style="display:inline-block;margin-top:8px;border:1.5px solid #cfe2f7;background:#f4f9ff;color:#2a5fc4;border-radius:999px;padding:6px 14px;font-weight:800;font-size:12.5px;text-decoration:none;">🧭 여기 가는 법</a>';
  html += '</div>';

  if (relatedNPCs.length){
    html += '<div class="section"><h2>이 위치의 NPC</h2><div class="ibox-grid">' + relatedNPCs.map(function(n){
      var herePlace = npcPlaceAt(n, code);
      var roleHere = (herePlace && herePlace.role) || n.role;
      return '<a class="ibox" href="npc-detail.html?id='+n.id+'">'+safeImg(n.img, n.name, 'thumb')+'<div><div class="lbl">'+(roleHere||'NPC')+'</div><div class="val">'+n.name+'</div></div></a>';
    }).join('') + '</div></div>';
  }

  if (relatedMonsters.length){
    html += '<div class="section"><h2>이 위치의 몬스터</h2><div class="ibox-grid">' + relatedMonsters.map(function(m){
      return '<a class="ibox" href="monster-detail.html?id='+m.id+'">'+safeImg(m.img, m.name, 'thumb')+'<div><div class="lbl">몬스터'+(m.minLevel?' · Lv.'+m.minLevel:'')+'</div><div class="val">'+m.name+(m.isBoss?' <span class="boss-badge">BOSS</span>':'')+(m.nextStage?' <span class="transform-badge">변신</span>':'')+(m.splitInto?' <span class="split-badge">분리</span>':'')+((monsterPlaceAt(m, code)&&monsterPlaceAt(m, code).count)?' <span class="count-badge">'+monsterPlaceAt(m, code).count+'마리</span>':'')+'</div></div></a>';
    }).join('') + '</div></div>';
  }

  if (map && map.portals && map.portals.length){
    html += '<div class="section"><h2>포털</h2><div class="ibox-grid">' + map.portals.map(function(p){
      var inner = (p.spotImg ? safeImg(p.spotImg, p.toName, 'thumb') : '') + '<div><div class="lbl">'+(p.note||'이동')+'</div><div class="val">'+(p.toName||('코드 '+p.toCode))+'</div></div>';
      var isSelfWarp = p.toCode && map && String(p.toCode)===String(map.code) && p.destX!=null && p.destY!=null;
      if (isSelfWarp){
        var sLeftPct = (p.unit==='px' && map.imgWidth) ? (p.destX/map.imgWidth*100) : p.destX;
        var sTopPct = (p.unit==='px' && map.imgHeight) ? (p.destY/map.imgHeight*100) : p.destY;
        return '<div class="ibox" data-warp-dest-x="'+sLeftPct+'" data-warp-dest-y="'+sTopPct+'" style="cursor:pointer;">'+inner+'</div>';
      }
      var portalHref = p.toCode
        ? 'map-detail.html?code='+p.toCode
        : (p.toName ? 'map-detail.html?name='+encodeURIComponent(p.toName) : '');
      return portalHref ? '<a class="ibox" href="'+portalHref+'">'+inner+'</a>' : '<div class="ibox">'+inner+'</div>';
    }).join('') + '</div></div>';
  }

  if (!relatedNPCs.length && !relatedMonsters.length && !(map && map.portals && map.portals.length)){
    html += '<div class="notready">이 위치와 관련된 NPC·몬스터·포털 정보가 아직 없어요.</div>';
  }

  $detail.innerHTML = html;

  Array.prototype.forEach.call($detail.querySelectorAll('[data-native-width]'), function(zEl){
    var nativeW = parseFloat(zEl.getAttribute('data-native-width'));
    if (!nativeW) return;
    var wrap = zEl.parentElement;
    var avail = wrap ? wrap.clientWidth : 0;
    if (!avail) return;
    var fit = Math.min(1, avail / nativeW);
    fit = Math.max(0.1, fit);
    zEl.setAttribute('data-scale', fit);
    zEl.setAttribute('data-fit-scale', fit);
    zEl.style.zoom = fit;
    var lbl = document.getElementById(zEl.id + '-label');
    if (lbl) lbl.textContent = Math.round(fit * 100) + '%';
  });

  $detail.addEventListener('click', function(e){
    var portalToggleBtn = e.target.closest('[data-portal-toggle]');
    if (portalToggleBtn){
      var openMenuId = portalToggleBtn.getAttribute('data-portal-toggle');
      Array.prototype.forEach.call($detail.querySelectorAll('[data-portal-menu]'), function(menuEl){
        menuEl.style.display = (menuEl.id === openMenuId && menuEl.style.display !== 'block') ? 'block' : 'none';
      });
      e.preventDefault();
      return;
    }
    if (!e.target.closest('[data-portal-menu]')){
      Array.prototype.forEach.call($detail.querySelectorAll('[data-portal-menu]'), function(menuEl){ menuEl.style.display = 'none'; });
    }
    var warpBtn = e.target.closest('[data-warp-dest-x]');
    if (warpBtn){
      var wZEl = warpBtn.closest('[data-scale]') || $detail.querySelector('[data-scale]');
      if (wZEl){
        var destXPct = parseFloat(warpBtn.getAttribute('data-warp-dest-x'));
        var destYPct = parseFloat(warpBtn.getAttribute('data-warp-dest-y'));
        var mark = document.createElement('div');
        mark.style.cssText = 'position:absolute;left:'+destXPct+'%;top:'+destYPct+'%;transform:translate(-50%,-50%);width:160px;height:160px;border-radius:50%;border:6px solid #ff2d2d;box-shadow:0 0 0 10px rgba(255,45,45,.4), 0 0 40px 10px rgba(255,45,45,.5);pointer-events:none;animation:warpPulse 1s ease-out 3;z-index:80;';
        var markLabel = document.createElement('div');
        markLabel.textContent = '여기로 이동!';
        markLabel.style.cssText = 'position:absolute;left:'+destXPct+'%;top:'+destYPct+'%;transform:translate(-50%,calc(-50% - 100px));white-space:nowrap;background:#ff2d2d;color:#fff;font-weight:900;font-size:16px;padding:6px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:none;z-index:81;';
        wZEl.appendChild(mark);
        wZEl.appendChild(markLabel);
        mark.scrollIntoView({ behavior:'smooth', block:'center', inline:'center' });
        setTimeout(function(){ mark.remove(); markLabel.remove(); }, 3600);
      }
      return;
    }
    var zBtn = e.target.closest('[data-zoom-in],[data-zoom-out],[data-zoom-reset]');
    if (!zBtn) return;
    var zid = zBtn.getAttribute('data-zoom-in') || zBtn.getAttribute('data-zoom-out') || zBtn.getAttribute('data-zoom-reset');
    var el = document.getElementById(zid);
    var label = document.getElementById(zid+'-label');
    if (!el) return;
    var cur = parseFloat(el.getAttribute('data-scale') || '1');
    if (zBtn.hasAttribute('data-zoom-in')) cur = Math.min(3, cur + 0.25);
    else if (zBtn.hasAttribute('data-zoom-out')) cur = Math.max(0.25, cur - 0.25);
    else cur = parseFloat(el.getAttribute('data-fit-scale') || '1');
    el.setAttribute('data-scale', cur);
    el.style.zoom = cur;
    if (label) label.textContent = Math.round(cur*100)+'%';
  });
})();

</script>
</body>
</html>
