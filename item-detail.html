<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>아이템 상세 · 로나월드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* =========================================================
   로나월드 — 디자인 토큰 (메이플 나무액자 퀘스트창 스타일)
   ========================================================= */
:root{
  --bg: #F5F3EF;
  --paper: #FFFFFF;
  --paper-soft: #F8F6F2;
  --wood: #D9D2C4;
  --wood-dark: #E4DFD3;
  --wood-light: #EFEAE0;
  --ink: #332C22;
  --ink-soft: #8C8172;
  --line: #EAE4D8;

  --leaf: #4C9A2A;
  --leaf-soft: #E7F3DC;
  --leaf-ink: #2C6614;

  --berry: #E2405F;
  --berry-soft: #FCE7EB;
  --berry-ink: #A01D3C;

  --sun: #F0A93A;
  --sun-soft: #FBEFD6;
  --sun-ink: #8A5A06;

  --sky: #3E9BD6;
  --sky-soft: #E5F2FA;
  --sky-ink: #1E5C86;

  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 9px;
  --pop: 0 10px 24px rgba(51,44,34,.09);
  --pop-sm: 0 4px 12px rgba(51,44,34,.07);
  --pop-md: 0 14px 34px rgba(51,44,34,.14);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height:1.55;
}
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
button{ font:inherit; }

.font-display{
  font-family: "Jua", "Pretendard", sans-serif;
  letter-spacing: -.01em;
}

.wrap{ max-width:1180px; margin:0 auto; padding:20px 18px 64px; }

/* ---------- 헤더 ---------- */
.site-header{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:16px; margin-bottom:18px; flex-wrap:wrap;
}
.site-title{
  display:flex; align-items:center; gap:10px;
}
.site-title .mark{
  width:44px; height:44px; flex:none;
  filter: drop-shadow(0 3px 6px rgba(51,44,34,.18));
}
.site-title h1{
  font-size:28px; margin:0; font-weight:400;
  color:var(--ink);
}
.site-title p{
  margin:3px 0 0; font-size:13px; color:var(--ink-soft); font-weight:600;
}
.reset-btn{
  border:1.5px solid var(--line); background:var(--paper);
  color:var(--ink); padding:9px 14px; border-radius:999px;
  cursor:pointer; font-size:13px; font-weight:700;
  box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.reset-btn:hover{ background: var(--sun-soft); }
.reset-btn:active{ transform: scale(.97); }

/* ---------- 탭 ---------- */
.tabs{
  display:flex; flex-wrap:wrap; gap:8px; padding:4px 4px 10px; margin-bottom:14px;
}
.tab{
  position:relative;
  flex:none;
  display:flex; align-items:center; gap:6px;
  border:1.5px solid var(--line); background:var(--paper);
  color: var(--ink);
  padding:9px 16px; border-radius:999px; cursor:pointer;
  font-size:14px; font-weight:700; white-space:nowrap;
  box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.tab:hover{ background: var(--paper-soft); }
.tab .n{
  font-size:11px; font-weight:800; padding:1px 7px; border-radius:999px;
  background: var(--bg); color: var(--ink); border:1.5px solid var(--line);
}
.tab.on{
  background: var(--sun); border-color: var(--sun); color:var(--ink);
}
.tab.on .n{ background: var(--paper); }
.tab-dropdown{
  display:none; position:absolute; top:100%; left:0; z-index:30;
  padding-top:8px; cursor:default;
}
.tab-dropdown-panel{
  background:#fff; border:1.5px solid var(--line); border-radius: var(--radius-md);
  box-shadow: var(--pop-md); padding:8px; min-width:180px;
  display:flex; flex-direction:column; gap:2px;
}
.tab:hover .tab-dropdown, .tab:focus-within .tab-dropdown{ display:block; }
.tab-dropdown-item{
  padding:8px 10px; border-radius:8px; font-size:13px; font-weight:700;
  color:var(--ink); white-space:nowrap; text-align:left; cursor:pointer;
}
.tab-dropdown-item:hover{ background: var(--paper-soft); }
.tab-dropdown-item.on{ background: var(--sun-soft); color:var(--sun-ink); }

/* ---------- 필터 보드 ---------- */
.board{
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:16px;
  margin-bottom:20px;
  box-shadow: var(--pop);
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
  gap:14px;
  position:relative;
}
.field label{
  display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:700;
}
.field input[type="text"],
.field input[type="number"],
.field select{
  width:100%; border:2px solid var(--line); background:#fff;
  border-radius: var(--radius-sm); padding:9px 11px; font-size:14px; color:var(--ink);
  font-weight:600;
}
.field input:focus, .field select:focus{
  outline:none; border-color: var(--sun);
}
.field-toggle{ display:flex; align-items:center; gap:8px; }
.field-toggle label{ margin-bottom:0; cursor:pointer; }
.field-toggle input[type="checkbox"]{ width:20px; height:20px; accent-color: var(--sun); cursor:pointer; }
.level-range-row{ display:flex; align-items:center; gap:6px; }
.lv-input{ min-width:0; flex:1 1 0; text-align:center; }
.lv-sep{ color:var(--ink-soft); flex:none; font-size:13px; font-weight:700; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; grid-column: 1 / -1; }
.filter-block{ grid-column: 1 / -1; display:flex; flex-direction:column; gap:12px; }
.filter-row{ display:flex; flex-direction:column; gap:6px; }
.filter-row-label{ font-size:12px; font-weight:800; color:var(--ink-soft); }
.tabs-row{ border-bottom:2px solid var(--line); padding-bottom:8px; }
.chip{
  border:1.5px solid var(--line); background:#fff; color:var(--ink);
  padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.chip:hover{ background: var(--paper-soft); }
.chip.on{
  background: var(--leaf); border-color:var(--leaf); color:#fff;
}
.hint{ grid-column: 1/-1; font-size:12px; color:var(--ink-soft); font-weight:600; }

/* ---------- 목록 그리드 ---------- */
.grid{
  display:grid; gap:16px;
  grid-template-columns: repeat(1, minmax(0,1fr));
}
@media (min-width:640px){ .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (min-width:980px){ .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
.hidden{ display:none !important; }

/* ---------- 카드 ---------- */
.qcard{
  position:relative;
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:16px 15px 13px;
  box-shadow: var(--pop-sm);
  display:block;
  transition: transform .15s ease, box-shadow .15s ease;
}
.qcard:hover{ transform: translateY(-3px); box-shadow: var(--pop); }
.qcard.owned{ background: var(--sun-soft); border-color: var(--sun); }
.fav-star{
  position:absolute; top:8px; right:8px; z-index:5;
  width:26px; height:26px;
  background: #fff; border:1.5px solid var(--line); border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; line-height:1; cursor:pointer;
  color: var(--ink-soft);
  box-shadow: var(--pop-sm);
  transition: transform .12s ease;
}
.qcard.owned .fav-star{ background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
.fav-star:hover{ transform: scale(1.1); }
.own-star-inline{
  background:none; border:none; font-size:22px; line-height:1; cursor:pointer;
  color:var(--sun-ink); vertical-align:middle; padding:0 0 0 4px;
}
.own-star-inline:hover{ transform:scale(1.15); display:inline-block; }
.fav-star-inline{
  background:none; border:none; font-size:22px; line-height:1; cursor:pointer;
  color:var(--sun-ink); vertical-align:middle; padding:0 0 0 4px;
}
.fav-star-inline:hover{ transform:scale(1.15); display:inline-block; }
.qcard .ribbon{
  position:absolute; top:-12px; left:16px; right:16px;
  display:flex; flex-wrap:wrap; gap:6px;
}
.ribbon-pill{
  font-size:11px; font-weight:800; padding:4px 10px 3px;
  border:1.5px solid var(--line);
  border-radius:999px; display:flex; align-items:center; gap:4px;
  box-shadow: var(--pop-sm);
}
.qcard .top{ display:flex; gap:10px; margin-top:10px; }
.qcard .thumb{
  width:54px; height:54px; object-fit:contain; background:#fff;
  border:1.5px solid var(--line); border-radius:11px; padding:5px; flex:none;
}
.qcard .meta-title{ min-width:0; }
.qcard .code{ font-size:11.5px; color:var(--ink-soft); font-weight:800; }
.qcard .title{ font-size:15.5px; font-weight:800; margin-top:1px; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.qcard .meta{ font-size:12px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
.qcard .exp-row{ margin-top:10px; }
.qcard .bar{ height:8px; border-radius:999px; background:#fff; overflow:hidden; border:1.5px solid var(--line); }
.qcard .bar > div{ height:100%; background: linear-gradient(90deg, var(--leaf), var(--sun)); }
.qcard .exp-text{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; text-align:right; font-weight:700; }
.qcard .card-body{ display:block; color:inherit; text-decoration:none; }

.qcard .job-row{ font-size:11px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
.qcard .reward-names{ font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.4; font-weight:600; }
.qcard .fame-chip{
  display:inline-flex; align-items:center; gap:3px; margin-top:6px;
  font-size:11px; font-weight:800; color:var(--sun-ink); background:var(--sun-soft);
  border:1.5px solid var(--sun);
  padding:2px 8px; border-radius:999px;
}

.qcard .complete-zone{ margin-top:11px; padding-top:11px; border-top:2px dashed var(--line); }
.complete-btn{
  width:100%; border:1.5px solid var(--line); background:var(--leaf-soft); color:var(--leaf-ink);
  font-weight:800; font-size:12.5px; padding:9px 10px; border-radius:var(--radius-sm);
  cursor:pointer; box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.complete-btn:hover{ background: var(--leaf); color:#fff; }
.complete-btn:active{ transform: scale(.98); }
.next-quest-btn{
  display:inline-block; background: var(--sun); color:var(--ink); font-weight:800; font-size:14px;
  padding:12px 22px; border-radius:999px; box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease;
}
.next-quest-btn:hover{ transform: translateY(-2px); box-shadow: var(--pop); }
.chain-nav-btn{
  display:inline-block; font-size:12px; font-weight:800; padding:6px 12px;
  border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  white-space:nowrap;
}
.chain-nav-btn:hover{ background: var(--paper-soft); }
.chain-nav-btn.disabled{ color: var(--ink-soft); opacity:.5; cursor:default; }
.done-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.done-badge{
  font-size:12px; font-weight:800; color:#fff; background:var(--leaf);
  border:1.5px solid var(--line);
  padding:6px 10px; border-radius:999px; flex:1; text-align:center;
}
.undo-btn{
  border:none; background:none; color:var(--ink-soft); font-size:11px; font-weight:700; cursor:pointer;
  text-decoration:underline; flex:none;
}
.choice-box{ display:flex; flex-direction:column; gap:6px; }
.choice-box .choice-label{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
.choice-item{
  display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; padding:6px 8px;
  border:2px solid var(--line); border-radius: var(--radius-sm); cursor:pointer; background:#fff;
}
.choice-item input{ accent-color: var(--leaf); }
.choice-confirm-btn{
  border:1.5px solid var(--line); background: var(--leaf); color:#fff; font-weight:800; font-size:12.5px;
  padding:8px 10px; border-radius: var(--radius-sm); cursor:pointer; margin-top:2px;
  box-shadow: var(--pop-sm);
}
.choice-confirm-btn:active{ transform: scale(.98); }

/* type color variants */
.t-talk.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-hunt.ribbon-pill{ background:var(--berry-soft); color:var(--berry-ink); }
.t-collect.ribbon-pill{ background:var(--sun-soft); color:var(--sun-ink); }
.t-deliver.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-use.ribbon-pill{ background:var(--sun-soft); color:var(--sun-ink); }
.t-move.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-investigate.ribbon-pill{ background:var(--leaf-soft); color:var(--leaf-ink); }
.t-etc.ribbon-pill{ background:#EEE4D2; color:var(--ink-soft); }

/* ---------- 빈 상태 ---------- */
.empty{
  grid-column: 1/-1;
  text-align:center; padding:56px 20px; color:var(--ink-soft);
  background: var(--paper-soft); border:3px dashed var(--wood-light);
  border-radius: var(--radius-lg);
}
.empty .big{ font-family:"Jua",sans-serif; font-size:19px; color:var(--ink); margin-bottom:6px; }

/* ---------- 상세 페이지 공통 ---------- */
.back-link{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800;
  color: var(--ink); margin-bottom:16px;
}
.back-link:hover{ color: var(--berry-ink); }

.detail-header{
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:20px 22px;
  margin-bottom:18px;
  box-shadow: var(--pop);
  position:relative;
}
.detail-header .type-tag{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800;
  border:1.5px solid var(--line);
  padding:4px 11px; border-radius:999px; margin-bottom:10px;
}
.detail-header h1{
  font-family:"Jua",sans-serif; font-weight:400; font-size:25px; margin:0 0 6px;
  text-shadow: 2px 2px 0 rgba(78,45,16,.15);
}
.detail-header .sub{ font-size:13px; color:var(--ink-soft); font-weight:700; }

.card{
  background: var(--paper); border:1.5px solid var(--line); border-radius: var(--radius-md);
  padding:16px;
}
.section{ margin-bottom:22px; }
.changelog-entry{ margin-bottom:18px; padding-bottom:16px; border-bottom:1.5px dashed var(--line); }
.changelog-entry:last-child{ border-bottom:none; }
.changelog-date{ font-size:13px; font-weight:800; color:var(--sun-ink); margin-bottom:6px; }
.changelog-list{ margin:0; padding-left:20px; }
.changelog-list li{ font-size:13.5px; color:var(--ink); margin-bottom:4px; line-height:1.5; }
.section > h2{
  font-size:13px; font-weight:800; color:var(--ink-soft); margin:0 0 10px;
  text-transform:none;
}
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:640px){ .two-col{ grid-template-columns:1fr; } }

.ibox{
  display:flex; align-items:center; gap:10px; padding:9px 10px;
  border:2px solid var(--line); border-radius: var(--radius-sm); background:#fff;
  transition: background .15s;
}
.ibox:hover{ background: var(--paper-soft); border-color: var(--wood-light); }
.ibox .thumb{ width:44px; height:44px; object-fit:contain; background:#fff; border:2px solid var(--line); border-radius:10px; padding:4px; flex:none; }
.ibox .lbl{ font-size:11px; color:var(--ink-soft); font-weight:700; }
.ibox .val{ font-size:13.5px; font-weight:800; }
.ibox-grid{ display:grid; gap:9px; grid-template-columns: 1fr 1fr; }
@media (max-width:520px){ .ibox-grid{ grid-template-columns:1fr; } }

.req-check{
  width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line);
  flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:transparent; font-size:13px; font-weight:900;
}
.req-check.done{ background: var(--leaf); border-color:var(--leaf); color:#fff; }

.bubble-list{ display:flex; flex-direction:column; gap:10px; }
.brow{ display:flex; align-items:flex-start; gap:8px; }
.brow.right{ justify-content:flex-end; }
.avatar{ width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); object-fit:cover; background:#fff; flex:none; }
.bubble{
  position:relative; max-width:78%; padding:10px 13px; border-radius:15px; line-height:1.5; font-size:13.5px;
  border:1.5px solid var(--line);
}
.bubble .name{ font-weight:800; font-size:12px; margin-bottom:2px; }
.bubble.left{ background:#fff; color:var(--ink); border-bottom-left-radius:4px; }
.bubble.right{ background: var(--berry); color:#fff; border-bottom-right-radius:4px; border-color: var(--berry); }
.bubble.right .name{ color: rgba(255,255,255,.9); }

.chain-link{ display:flex; align-items:center; gap:10px; }
.chain-link .arrow{ color: var(--ink-soft); font-size:18px; flex:none; }

.desc-box{ font-size:14px; line-height:1.7; color: var(--ink); font-weight:500; }
.desc-box p{ margin:0; }

.count-badge{
  display:inline-flex; align-items:center; font-size:13px; font-weight:800; color:#fff;
  background:var(--berry); border:1.5px solid var(--line);
  padding:2px 10px; border-radius:999px; margin-left:6px; vertical-align:2px;
}

/* ---------- 서브 패널 (퀘스트/아이템/몬스터 상세를 페이지 이동 없이 보여줌) ---------- */
.panel-overlay{
  position:fixed; inset:0; background:rgba(70,40,13,.45);
  display:flex; justify-content:flex-end; z-index:100;
}
.panel-overlay.hidden{ display:none; }
.panel-box{
  position:relative; width:min(640px, 100%); height:100%;
  background: var(--bg); box-shadow: -6px 0 24px rgba(0,0,0,.25);
  overflow-y:auto; padding:20px 20px 40px;
  animation: panelSlideIn .18s ease-out;
}
.panel-box.wide{ width:min(1100px, 100%); }
@keyframes panelSlideIn{ from{ transform:translateX(24px); opacity:0; } to{ transform:translateX(0); opacity:1; } }
@media (max-width:640px){ .panel-box{ width:100%; } }
.panel-close{
  position:sticky; top:0; float:right; margin-left:12px;
  width:36px; height:36px; border-radius:50%; border:1.5px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:16px; font-weight:800; cursor:pointer;
  box-shadow: var(--pop-sm); z-index:2;
}
.panel-back{
  position:sticky; top:0; float:left;
  border-radius:999px; border:1.5px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:13px; font-weight:800; cursor:pointer;
  padding:8px 14px; box-shadow: var(--pop-sm); z-index:2;
}
.panel-back.hidden{ display:none; }
.panel-share{
  position:sticky; top:0; float:right; margin-right:8px;
  border-radius:999px; border:1.5px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:12.5px; font-weight:800; cursor:pointer;
  padding:8px 12px; box-shadow: var(--pop-sm); z-index:2; white-space:nowrap;
}
.panel-share.copied{ background:var(--sun-soft); color:var(--sun-ink); }
.panel-content{ clear:both; }
.panel-content .back-link{ display:none; }
.panel-content nav.tabs{ display:none; }
.panel-content .ibox-grid{ grid-template-columns: 1fr; }
.chain-chip{
  flex:none; padding:6px 12px; border-radius:14px; border:1.5px solid var(--line);
  white-space:nowrap; background:#fff; color:var(--ink-soft);
  display:flex; flex-direction:column; align-items:center; gap:1px;
  max-width:120px;
}
.chain-chip .chain-code{ font-size:12px; font-weight:800; }
.chain-chip .chain-title{
  font-size:10px; font-weight:600; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.chain-chip.current{ background:var(--sun); color:var(--ink); }
.chip-sep{ align-self:center; color:var(--ink-soft); font-weight:800; margin:0 2px; }

/* ---------- 장비 정보 카드 ---------- */
.equip-card{
  background: linear-gradient(180deg, #2b3350, #1c2238);
  border:1.5px solid var(--line); border-radius: var(--radius-lg);
  overflow:hidden; box-shadow: var(--pop-sm); color:#fff;
  max-width:420px; margin:0 auto;
}
.equip-navy{ padding:18px 20px 16px; text-align:center; }
.equip-req{ display:grid; grid-template-columns:1fr 1fr; gap:5px 20px; font-size:13px; font-weight:700; color:#e8ebf5; text-align:center; margin-bottom:14px; }
.equip-req > div{ white-space:nowrap; }
.equip-jobs{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
.job-pill{
  font-size:12.5px; font-weight:800; padding:2px 2px; border-radius:0;
  border:none; background:none; color:#e08a8a;
}
.job-pill.on{ color:#fff; text-decoration:underline; text-underline-offset:3px; }
.equip-divider{ border-top:1px solid rgba(255,255,255,.25); margin:0 20px; }
.equip-stats{
  display:flex; flex-direction:column; gap:6px;
  font-size:13.5px; font-weight:700; color:#f0f1f6;
  padding:14px 20px; text-align:center;
}
.equip-price{
  display:flex; align-items:center; gap:6px; justify-content:center;
  padding:10px 12px; font-weight:800; color:var(--sun); font-size:12px;
  flex-wrap:nowrap; white-space:nowrap; overflow-x:auto;
}
.equip-price img.meso-icon{ width:14px; height:14px; object-fit:contain; vertical-align:-2px; margin-right:2px; flex:none; }
.equip-price .price-note{ font-size:10px; font-weight:600; color:#c7cadd; }

/* ---------- 통합 검색 ---------- */
.global-search-wrap{ position:relative; margin-bottom:14px; }
.global-search-input{
  width:100%; box-sizing:border-box; font-family:inherit; font-size:15px; font-weight:700;
  padding:14px 18px; border-radius:999px; border:1.5px solid var(--line);
  background:#fff; color:var(--ink); box-shadow: var(--pop-sm);
}
.global-search-input::placeholder{ color:var(--ink-soft); font-weight:600; }
.global-search-results{
  position:absolute; left:0; right:0; top:calc(100% + 8px); z-index:40;
  background:#fff; border:1.5px solid var(--line); border-radius: var(--radius-lg);
  box-shadow: var(--pop-md); max-height:420px; overflow-y:auto; padding:8px;
}
.global-search-results.hidden{ display:none; }
.gs-group-label{ font-size:11px; font-weight:800; color:var(--ink-soft); padding:8px 10px 4px; }
.gs-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer;
  text-decoration:none; color:var(--ink);
}
.gs-item:hover, .gs-item.sel{ background:var(--paper-soft); }
.gs-item img{ width:32px; height:32px; object-fit:contain; border-radius:8px; border:1.5px solid var(--wood-light); background:#fff; flex:none; }
.gs-item .gs-name{ font-weight:800; font-size:13.5px; }
.gs-item .gs-meta{ font-size:11px; color:var(--ink-soft); }
.gs-empty{ padding:16px; text-align:center; color:var(--ink-soft); font-size:13px; }

/* ---------- 최근 본 항목 ---------- */
.recent-strip{ margin-bottom:14px; }
.recent-strip.hidden{ display:none; }
.recent-strip-label{ font-size:11px; font-weight:800; color:var(--ink-soft); margin-bottom:6px; }
.recent-strip-list{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
.recent-chip{
  flex:none; display:flex; align-items:center; gap:6px; padding:6px 10px 6px 6px;
  border-radius:999px; border:1.5px solid var(--line); background:#fff; cursor:pointer;
  max-width:160px;
}
.recent-chip img{ width:24px; height:24px; object-fit:contain; border-radius:50%; flex:none; }
.recent-chip span{ font-size:12px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- 즐겨찾기 탭 ---------- */
.fav-group{ margin-bottom:26px; }
.fav-group-label{ font-size:15px; font-weight:900; font-family:'Jua',sans-serif; color:var(--ink); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.fav-group-label .n{ font-size:12px; font-weight:800; color:var(--ink-soft); background:var(--paper-soft); border-radius:999px; padding:2px 9px; }

.notready{
  padding:40px 20px; text-align:center; color:var(--ink-soft);
  background: var(--paper-soft); border:2px dashed var(--line); border-radius: var(--radius-lg);
}
.pager{
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin:18px 0 6px;
}
.pager .page-btn{
  border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  border-radius:999px; padding:8px 16px; font-weight:800; font-size:13px; cursor:pointer;
  box-shadow: var(--pop-sm);
}
.pager .page-btn:disabled{ opacity:.4; cursor:default; box-shadow:none; }
.pager .page-info{ font-size:13px; font-weight:700; color:var(--ink-soft); }
.chip-sep{ align-self:center; color:var(--ink-soft); font-weight:800; margin:0 2px; }

<script>
(function(){
  'use strict';
  var QUEST_DETAILS = window.QUEST_DETAILS || {};
  var ITEMS = window.ITEMS || [];
  var NPCS = window.NPCS || [];
  var MONSTERS = window.MONSTERS || [];

  var params = new URLSearchParams(location.search);
  var id = params.get('id');

  var item = ITEMS.find(function(i){ return String(i.id)===String(id); });

  function safeImg(src, alt, cls){
    var d = 'https://placehold.co/160x160/FFF9F0/9A8574?text=%20';
    return '<img src="'+(src||d)+'" alt="'+(alt||'')+'" class="'+(cls||'thumb')+'" onerror="this.onerror=null;this.src=\''+d+'\';">';
  }

  var JOB_LIST = ['초보자','전사','마법사','궁수','도적','해적'];
  function buildEquipCardHtml(item, itemImg, itemName){
    var d = 'https://placehold.co/160x160/FFF9F0/9A8574?text=%20';
    var jobStr = String(item.job||'');
    var isCommon = jobStr.indexOf('공용')>-1;
    var jobList = jobStr.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var html = '<div class="equip-card">';
    html += '<div class="equip-navy">';
    html += '<div class="equip-req">';
    html += '<div>REQ LEV : '+(item.reqLevel||0)+'</div>';
    html += '<div>REQ STR : '+(item.reqStr||0)+'</div>';
    html += '<div>REQ DEX : '+(item.reqDex||0)+'</div>';
    html += '<div>REQ INT : '+(item.reqInt||0)+'</div>';
    html += '<div>REQ LUK : '+(item.reqLuk||0)+'</div>';
    html += '<div>REQ POP : '+(item.reqPop||0)+'</div>';
    html += '</div>';
    html += '<div class="equip-jobs">' + JOB_LIST.map(function(j){
      var on = isCommon || jobList.indexOf(j)>-1;
      return '<span class="job-pill'+(on?' on':'')+'">'+j+'</span>';
    }).join('') + '</div>';
    html += '</div>';
    html += '<div class="equip-divider"></div>';
    html += '<div class="equip-stats">';
    var cat = item.path && item.path.length ? item.path[item.path.length-1] : '';
    if (cat) html += '<div>장비분류 : '+cat+'</div>';
    if (item.pdd!=null) html += '<div>물리방어력 : +'+item.pdd+'</div>';
    if (item.mdd!=null) html += '<div>마법방어력 : +'+item.mdd+'</div>';
    if (item.attack!=null) html += '<div>공격력 : +'+item.attack+'</div>';
    if (item.matt!=null) html += '<div>마력 : +'+item.matt+'</div>';
    if (item.acc!=null) html += '<div>명중률 : +'+item.acc+'</div>';
    if (item.speed) html += '<div>공격 속도 : '+item.speed+'</div>';
    if (item.str!=null) html += '<div>STR : +'+item.str+'</div>';
    if (item.dex!=null) html += '<div>DEX : +'+item.dex+'</div>';
    if (item.int!=null) html += '<div>INT : +'+item.int+'</div>';
    if (item.luk!=null) html += '<div>LUK : +'+item.luk+'</div>';
    if (item.hp!=null) html += '<div>HP : +'+item.hp+'</div>';
    if (item.mp!=null) html += '<div>MP : +'+item.mp+'</div>';
    if (item.eva!=null) html += '<div>회피율 : +'+item.eva+'</div>';
    if (item.moveSpeed!=null) html += '<div>이동속도 : +'+item.moveSpeed+'</div>';
    if (item.jump!=null) html += '<div>점프력 : +'+item.jump+'</div>';
    html += '</div>';
    if (item.buyPrice!=null || item.sellPrice!=null){
      html += '<div class="equip-divider"></div>';
      var parts = [];
      var mesoImg = 'https://drive.google.com/thumbnail?id=1DaKmV5jEHVr7yW2AzdZfYPzi89jgEBpI&sz=w200';
      if (item.buyPrice!=null) parts.push('<img class="meso-icon" src="'+mesoImg+'" alt="메소">'+item.buyPrice.toLocaleString()+' 메소 <span class="price-note">(상점 구매가)</span>');
      if (item.sellPrice!=null) parts.push('<img class="meso-icon" src="'+mesoImg+'" alt="메소">'+item.sellPrice.toLocaleString()+' 메소 <span class="price-note">(상점 판매가)</span>');
      html += '<div class="equip-price">' + parts.join(' &nbsp;/&nbsp; ') + '</div>';
    }
    html += '</div>';
    return html;
  }

  var $detail = document.getElementById('detail');

  // 아이템 등록이 안 돼있어도, 퀘스트 데이터에서 이름/이미지가 등장하면 보여준다
  var itemName = item ? item.name : null;
  var itemImg = item ? item.img : null;
  var isEquip = item && item.path && item.path[0] === '장비';

  var givesFrom = [];   // 이 아이템을 보상으로 주는 퀘스트
  var needsFor = [];    // 이 아이템이 필요한 퀘스트
  var droppedBy = [];   // 이 아이템을 드롭하는 몬스터
  var soldBy = [];      // 이 아이템을 판매하는 NPC

  NPCS.forEach(function(n){
    if (n.sells && n.sells.some(function(sid){ return String(sid)===String(id); })){
      soldBy.push({ id: n.id, name: n.name, img: n.img });
    }
  });

  MONSTERS.forEach(function(m){
    (m.drops||[]).forEach(function(d){
      if (d.itemId && String(d.itemId)===String(id)){
        droppedBy.push({ id: m.id, name: m.name, img: m.img });
        if (!itemName){ itemName = d.name || m.name; }
      }
    });
  });

  Object.keys(QUEST_DETAILS).forEach(function(qid){
    var d = QUEST_DETAILS[qid];
    (d.rewards||[]).forEach(function(r){
      if (r.itemId && String(r.itemId)===String(id)){
        givesFrom.push({ id: d.id, code: d.code, title: d.title, qty: r.qty });
        if (!itemName){ itemName = r.name; itemImg = r.img; }
      }
    });
    (d.reqs||[]).forEach(function(r){
      if ((r.kind==='item' || r.kind==='use') && r.id && String(r.id)===String(id)){
        needsFor.push({ id: d.id, code: d.code, title: d.title, qty: r.qty });
        if (!itemName){ itemName = r.name; itemImg = r.img; }
      }
    });
  });

  if (!item && !givesFrom.length && !needsFor.length && !droppedBy.length && !soldBy.length){
    $detail.innerHTML = '<div class="notready"><div class="big font-display" style="font-family:Jua,sans-serif;font-size:18px;margin-bottom:6px;">아이템을 찾을 수 없어요</div><div>주소의 id 값을 다시 확인해 주세요.</div></div>';
    return;
  }

  var html = '';
  html += '<div class="detail-header">';
  html += '<div style="display:flex;align-items:center;gap:14px;">';
  html += safeImg(itemImg, itemName, 'thumb').replace('class="thumb"', 'class="thumb" style="width:64px;height:64px;"');
  html += '<div>';
  html += '<h1 style="margin-bottom:2px;">' + (itemName || '이름 미등록 (id '+id+')') + '</h1>';
  var itemPath = item ? (item.path || [item.category, item.tag, item.subtag].filter(Boolean)) : [];
  html += '<div class="sub">' + (itemPath.length ? itemPath.join(' · ') : '분류 없음') + (item && item.extraTags && item.extraTags.length ? ' · +'+item.extraTags.join(', ') : '') + (item && item.job ? ' · 사용 가능 직업: '+item.job : '') + '</div>';
  html += '</div>';
  html += '</div>';
  html += '</div>';

  if (isEquip){
    html += '<div class="section"><h2>장비 정보</h2>' + buildEquipCardHtml(item, itemImg, itemName) + '</div>';
  }

  if (item && item.desc){
    html += '<div class="section"><h2>설명</h2><div class="card desc-box">' + item.desc.replace(/\n/g,'<br>') + '</div></div>';
  }

  if (!isEquip && item){
    var consumeStats = [];
    if (item.reqLevel!=null) consumeStats.push(['요구 레벨', item.reqLevel]);
    if (item.attack!=null) consumeStats.push(['공격력', '+'+item.attack]);
    if (item.matt!=null) consumeStats.push(['마력', '+'+item.matt]);
    if (item.pdd!=null) consumeStats.push(['물리방어력', '+'+item.pdd]);
    if (item.mdd!=null) consumeStats.push(['마법방어력', '+'+item.mdd]);
    if (item.acc!=null) consumeStats.push(['명중률', '+'+item.acc]);
    if (item.eva!=null) consumeStats.push(['회피율', '+'+item.eva]);
    if (item.hp!=null) consumeStats.push(['HP', '+'+item.hp]);
    if (item.mp!=null) consumeStats.push(['MP', '+'+item.mp]);
    if (consumeStats.length){
      html += '<div class="section"><h2>능력치</h2><div class="ibox-grid">' + consumeStats.map(function(s){
        return '<div class="ibox"><div><div class="lbl">'+s[0]+'</div><div class="val">'+s[1]+'</div></div></div>';
      }).join('') + '</div></div>';
    }
  }

  if (item && (item.buyPrice!=null || item.sellPrice!=null) && !isEquip){
    var mesoImg = 'https://drive.google.com/thumbnail?id=1DaKmV5jEHVr7yW2AzdZfYPzi89jgEBpI&sz=w200';
    html += '<div class="section"><h2>상점 가격</h2><div class="ibox-grid">';
    if (item.buyPrice!=null){
      html += '<div class="ibox">'+safeImg(mesoImg,'메소','thumb')+'<div><div class="lbl">구매가</div><div class="val">'+item.buyPrice.toLocaleString()+' 메소</div></div></div>';
    }
    if (item.sellPrice!=null){
      html += '<div class="ibox">'+safeImg(mesoImg,'메소','thumb')+'<div><div class="lbl">판매가</div><div class="val">'+item.sellPrice.toLocaleString()+' 메소</div></div></div>';
    }
    html += '</div></div>';
  }

  if (item && item.materials && item.materials.length){
    html += '<div class="section"><h2>제련 재료</h2><div class="ibox-grid">' + item.materials.map(function(m){
      var mIt = ITEMS.find(function(it){ return it.name===m.name; });
      var mImg = mIt ? mIt.img : null;
      return '<div class="ibox">'+safeImg(mImg, m.name, 'thumb')+'<div><div class="lbl">'+m.name+'</div><div class="val">x'+m.qty+'</div></div></div>';
    }).join('') + '</div></div>';
  }

  if (item && item.refineCost && item.refineCost.length){
    html += '<div class="section"><h2>제련 비용</h2><div class="ibox-grid">' + item.refineCost.map(function(c){
      var npc = NPCS.find(function(n){ return n.name===c.npc; });
      if (npc){
        return '<a class="ibox" href="npc-detail.html?id='+npc.id+'">'+safeImg(npc.img, npc.name, 'thumb')+'<div><div class="lbl">'+npc.name+'</div><div class="val">'+c.meso.toLocaleString()+' 메소</div></div></a>';
      }
      return '<div class="ibox"><div><div class="lbl">'+c.npc+'</div><div class="val">'+c.meso.toLocaleString()+' 메소</div></div></div>';
    }).join('') + '</div></div>';
  }

  if (soldBy.length){
    var priceTxt = item && item.buyPrice!=null ? item.buyPrice.toLocaleString()+'메소' : '가격 미정';
    html += '<div class="section"><h2>판매하는 NPC</h2><div class="ibox-grid">' + soldBy.map(function(n){
      return '<a class="ibox" href="npc-detail.html?id='+n.id+'">'+safeImg(n.img, n.name, 'thumb')+'<div><div class="lbl">'+priceTxt+'</div><div class="val">'+n.name+'</div></div></a>';
    }).join('') + '</div></div>';
  }

  if (droppedBy.length){
    html += '<div class="section"><h2>드롭하는 몬스터</h2><div class="ibox-grid">' + droppedBy.map(function(m){
      return '<a class="ibox" href="monster-detail.html?id='+m.id+'">'+safeImg(m.img, m.name, 'thumb')+'<div><div class="lbl">몬스터</div><div class="val">'+m.name+'</div></div></a>';
    }).join('') + '</div></div>';
  }

  if (givesFrom.length){
    html += '<div class="section"><h2>이 아이템을 주는 퀘스트</h2><div class="ibox-grid">' + givesFrom.map(function(g){
      return '<a class="ibox" href="quest-detail.html?id='+g.id+'"><div><div class="lbl">보상</div><div class="val">'+(g.code?g.code+' · ':'')+g.title+(g.qty?' (×'+g.qty+')':'')+'</div></div></a>';
    }).join('') + '</div></div>';
  }

  if (needsFor.length){
    html += '<div class="section"><h2>이 아이템이 필요한 퀘스트</h2><div class="ibox-grid">' + needsFor.map(function(n){
      return '<a class="ibox" href="quest-detail.html?id='+n.id+'"><div><div class="lbl">요구 아이템</div><div class="val">'+(n.code?n.code+' · ':'')+n.title+(n.qty?' (×'+n.qty+')':'')+'</div></div></a>';
    }).join('') + '</div></div>';
  }

  if (!givesFrom.length && !needsFor.length && !droppedBy.length && !soldBy.length){
    html += '<div class="notready">이 아이템과 관련된 정보가 아직 없어요.</div>';
  }

  $detail.innerHTML = html;
})();
