<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>퀘스트 상세 · 로나월드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<style>
/* =========================================================
   로나월드 — 디자인 토큰 (메이플 나무액자 퀘스트창 스타일)
   ========================================================= */
:root{
  --bg: #F5F3EF;
  --paper: #FFFFFF;
  --paper-soft: #F8F6F2;
  --wood: #D9D2C4;
  --wood-dark: #E4DFD3;
  --wood-light: #EFEAE0;
  --ink: #332C22;
  --ink-soft: #8C8172;
  --line: #EAE4D8;

  --leaf: #4C9A2A;
  --leaf-soft: #E7F3DC;
  --leaf-ink: #2C6614;

  --berry: #E2405F;
  --berry-soft: #FCE7EB;
  --berry-ink: #A01D3C;

  --sun: #F0A93A;
  --sun-soft: #FBEFD6;
  --sun-ink: #8A5A06;

  --sky: #3E9BD6;
  --sky-soft: #E5F2FA;
  --sky-ink: #1E5C86;

  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 9px;
  --pop: 0 10px 24px rgba(51,44,34,.09);
  --pop-sm: 0 4px 12px rgba(51,44,34,.07);
  --pop-md: 0 14px 34px rgba(51,44,34,.14);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: "NanumSquare", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height:1.55;
}
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
button{ font:inherit; }

.font-display{
  font-family: "NanumSquare", sans-serif;
  letter-spacing: -.01em;
}

.wrap{ max-width:1180px; margin:0 auto; padding:20px 18px 64px; }

/* ---------- 헤더 ---------- */
.site-header{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:16px; margin-bottom:18px; flex-wrap:wrap;
}
.site-title{
  display:flex; align-items:center; gap:10px;
}
.site-title .mark{
  width:44px; height:44px; flex:none;
  filter: drop-shadow(0 3px 6px rgba(51,44,34,.18));
}
.site-title h1{
  font-size:28px; margin:0; font-weight:400;
  color:var(--ink);
}
.site-title p{
  margin:3px 0 0; font-size:13px; color:var(--ink-soft); font-weight:600;
}
.reset-btn{
  border:1.5px solid var(--line); background:var(--paper);
  color:var(--ink); padding:9px 14px; border-radius:999px;
  cursor:pointer; font-size:13px; font-weight:700;
  box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.reset-btn:hover{ background: var(--sun-soft); }
.reset-btn:active{ transform: scale(.97); }

/* ---------- 탭 ---------- */
.tabs{
  display:flex; flex-wrap:wrap; gap:8px; padding:4px 4px 10px; margin-bottom:14px;
}
.tab{
  position:relative;
  flex:none;
  display:flex; align-items:center; gap:6px;
  border:1.5px solid var(--line); background:var(--paper);
  color: var(--ink);
  padding:9px 16px; border-radius:999px; cursor:pointer;
  font-size:14px; font-weight:700; white-space:nowrap;
  box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.tab:hover{ background: var(--paper-soft); }
.tab .n{
  font-size:11px; font-weight:800; padding:1px 7px; border-radius:999px;
  background: var(--bg); color: var(--ink); border:1.5px solid var(--line);
}
.tab.on{
  background: var(--sun); border-color: var(--sun); color:var(--ink);
}
.tab.on .n{ background: var(--paper); }
.tab-dropdown{
  display:none; position:absolute; top:100%; left:0; z-index:30;
  padding-top:8px; cursor:default;
}
.tab-dropdown-panel{
  background:#fff; border:1.5px solid var(--line); border-radius: var(--radius-md);
  box-shadow: var(--pop-md); padding:8px; min-width:180px;
  display:flex; flex-direction:column; gap:2px;
}
.tab:hover .tab-dropdown, .tab:focus-within .tab-dropdown{ display:block; }
.tab-dropdown-item{
  padding:8px 10px; border-radius:8px; font-size:13px; font-weight:700;
  color:var(--ink); white-space:nowrap; text-align:left; cursor:pointer;
}
.tab-dropdown-item:hover{ background: var(--paper-soft); }
.tab-dropdown-item.on{ background: var(--sun-soft); color:var(--sun-ink); }

/* ---------- 필터 보드 ---------- */
.board{
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:16px;
  margin-bottom:20px;
  box-shadow: var(--pop);
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
  gap:14px;
  position:relative;
}
.field label{
  display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:700;
}
.field input[type="text"],
.field input[type="number"],
.field select{
  width:100%; border:2px solid var(--line); background:#fff;
  border-radius: var(--radius-sm); padding:9px 11px; font-size:14px; color:var(--ink);
  font-weight:600;
}
.field input:focus, .field select:focus{
  outline:none; border-color: var(--sun);
}
.field-toggle{ display:flex; align-items:center; gap:8px; }
.field-toggle label{ margin-bottom:0; cursor:pointer; }
.field-toggle input[type="checkbox"]{ width:20px; height:20px; accent-color: var(--sun); cursor:pointer; }
.level-range-row{ display:flex; align-items:center; gap:6px; }
.lv-input{ min-width:0; flex:1 1 0; text-align:center; }
.lv-sep{ color:var(--ink-soft); flex:none; font-size:13px; font-weight:700; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; grid-column: 1 / -1; }
.filter-block{ grid-column: 1 / -1; display:flex; flex-direction:column; gap:12px; }
.filter-row{ display:flex; flex-direction:column; gap:6px; }
.filter-row-label{ font-size:12px; font-weight:800; color:var(--ink-soft); }
.tabs-row{ border-bottom:2px solid var(--line); padding-bottom:8px; }
.chip{
  border:1.5px solid var(--line); background:#fff; color:var(--ink);
  padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.chip:hover{ background: var(--paper-soft); }
.chip.on{
  background: var(--leaf); border-color:var(--leaf); color:#fff;
}
.hint{ grid-column: 1/-1; font-size:12px; color:var(--ink-soft); font-weight:600; }

/* ---------- 목록 그리드 ---------- */
.grid{
  display:grid; gap:16px;
  grid-template-columns: repeat(1, minmax(0,1fr));
}
@media (min-width:640px){ .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (min-width:980px){ .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
.hidden{ display:none !important; }

/* ---------- 카드 ---------- */
.qcard{
  position:relative;
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:16px 15px 13px;
  box-shadow: var(--pop-sm);
  display:block;
  transition: transform .15s ease, box-shadow .15s ease;
}
.qcard:hover{ transform: translateY(-3px); box-shadow: var(--pop); }
.qcard.owned{ background: var(--sun-soft); border-color: var(--sun); }
.fav-star{
  position:absolute; top:8px; right:8px; z-index:5;
  width:26px; height:26px;
  background: #fff; border:1.5px solid var(--line); border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; line-height:1; cursor:pointer;
  color: var(--ink-soft);
  box-shadow: var(--pop-sm);
  transition: transform .12s ease;
}
.qcard.owned .fav-star{ background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
.fav-star:hover{ transform: scale(1.1); }
.own-star-inline{
  background:none; border:none; font-size:22px; line-height:1; cursor:pointer;
  color:var(--sun-ink); vertical-align:middle; padding:0 0 0 4px;
}
.own-star-inline:hover{ transform:scale(1.15); display:inline-block; }
.fav-star-inline{
  background:none; border:none; font-size:22px; line-height:1; cursor:pointer;
  color:var(--sun-ink); vertical-align:middle; padding:0 0 0 4px;
}
.fav-star-inline:hover{ transform:scale(1.15); display:inline-block; }
.qcard .ribbon{
  position:absolute; top:-12px; left:16px; right:16px;
  display:flex; flex-wrap:wrap; gap:6px;
}
.ribbon-pill{
  font-size:11px; font-weight:800; padding:4px 10px 3px;
  border:1.5px solid var(--line);
  border-radius:999px; display:flex; align-items:center; gap:4px;
  box-shadow: var(--pop-sm);
}
.qcard .top{ display:flex; gap:10px; margin-top:10px; }
.qcard .thumb{
  width:54px; height:54px; object-fit:contain; background:#fff;
  border:1.5px solid var(--line); border-radius:11px; padding:5px; flex:none;
}
.qcard .meta-title{ min-width:0; }
.qcard .code{ font-size:11.5px; color:var(--ink-soft); font-weight:800; }
.qcard .title{ font-size:15.5px; font-weight:800; margin-top:1px; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.qcard .meta{ font-size:12px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
.qcard .exp-row{ margin-top:10px; }
.qcard .bar{ height:8px; border-radius:999px; background:#fff; overflow:hidden; border:1.5px solid var(--line); }
.qcard .bar > div{ height:100%; background: linear-gradient(90deg, var(--leaf), var(--sun)); }
.qcard .exp-text{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; text-align:right; font-weight:700; }
.qcard .card-body{ display:block; color:inherit; text-decoration:none; }

.qcard .job-row{ font-size:11px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
.qcard .reward-names{ font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.4; font-weight:600; }
.qcard .fame-chip{
  display:inline-flex; align-items:center; gap:3px; margin-top:6px;
  font-size:11px; font-weight:800; color:var(--sun-ink); background:var(--sun-soft);
  border:1.5px solid var(--sun);
  padding:2px 8px; border-radius:999px;
}

.qcard .complete-zone{ margin-top:11px; padding-top:11px; border-top:2px dashed var(--line); }
.complete-btn{
  width:100%; border:1.5px solid var(--line); background:var(--leaf-soft); color:var(--leaf-ink);
  font-weight:800; font-size:12.5px; padding:9px 10px; border-radius:var(--radius-sm);
  cursor:pointer; box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.complete-btn:hover{ background: var(--leaf); color:#fff; }
.complete-btn:active{ transform: scale(.98); }
.next-quest-btn{
  display:inline-block; background: var(--sun); color:var(--ink); font-weight:800; font-size:14px;
  padding:12px 22px; border-radius:999px; box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease;
}
.next-quest-btn:hover{ transform: translateY(-2px); box-shadow: var(--pop); }
.chain-nav-btn{
  display:inline-block; font-size:12px; font-weight:800; padding:6px 12px;
  border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  white-space:nowrap;
}
.chain-nav-btn:hover{ background: var(--paper-soft); }
.chain-nav-btn.disabled{ color: var(--ink-soft); opacity:.5; cursor:default; }
.done-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.done-badge{
  font-size:12px; font-weight:800; color:#fff; background:var(--leaf);
  border:1.5px solid var(--line);
  padding:6px 10px; border-radius:999px; flex:1; text-align:center;
}
.undo-btn{
  border:none; background:none; color:var(--ink-soft); font-size:11px; font-weight:700; cursor:pointer;
  text-decoration:underline; flex:none;
}
.choice-box{ display:flex; flex-direction:column; gap:6px; }
.choice-box .choice-label{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
.choice-item{
  display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; padding:6px 8px;
  border:2px solid var(--line); border-radius: var(--radius-sm); cursor:pointer; background:#fff;
}
.choice-item input{ accent-color: var(--leaf); }
.choice-confirm-btn{
  border:1.5px solid var(--line); background: var(--leaf); color:#fff; font-weight:800; font-size:12.5px;
  padding:8px 10px; border-radius: var(--radius-sm); cursor:pointer; margin-top:2px;
  box-shadow: var(--pop-sm);
}
.choice-confirm-btn:active{ transform: scale(.98); }

/* type color variants */
.t-talk.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-hunt.ribbon-pill{ background:var(--berry-soft); color:var(--berry-ink); }
.t-collect.ribbon-pill{ background:var(--sun-soft); color:var(--sun-ink); }
.t-deliver.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-use.ribbon-pill{ background:var(--sun-soft); color:var(--sun-ink); }
.t-move.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-investigate.ribbon-pill{ background:var(--leaf-soft); color:var(--leaf-ink); }
.t-job.ribbon-pill{ background:#E9DFF7; color:#5a3d99; }
.t-etc.ribbon-pill{ background:#EEE4D2; color:var(--ink-soft); }

/* ---------- 빈 상태 ---------- */
.empty{
  grid-column: 1/-1;
  text-align:center; padding:56px 20px; color:var(--ink-soft);
  background: var(--paper-soft); border:3px dashed var(--wood-light);
  border-radius: var(--radius-lg);
}
.empty .big{ font-family:"NanumSquare",sans-serif; font-size:19px; color:var(--ink); margin-bottom:6px; }

/* ---------- 상세 페이지 공통 ---------- */
.back-link{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800;
  color: var(--ink); margin-bottom:16px;
}
.back-link:hover{ color: var(--berry-ink); }

.detail-header{
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:20px 22px;
  margin-bottom:18px;
  box-shadow: var(--pop);
  position:relative;
}
.detail-header .type-tag{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800;
  border:1.5px solid var(--line);
  padding:4px 11px; border-radius:999px; margin-bottom:10px;
}
.detail-header h1{
  font-family:"NanumSquare",sans-serif; font-weight:400; font-size:25px; margin:0 0 6px;
  text-shadow: 2px 2px 0 rgba(78,45,16,.15);
}
.detail-header .sub{ font-size:13px; color:var(--ink-soft); font-weight:700; }

.card{
  background: var(--paper); border:1.5px solid var(--line); border-radius: var(--radius-md);
  padding:16px;
}
.section{ margin-bottom:22px; }
.changelog-entry{ margin-bottom:18px; padding-bottom:16px; border-bottom:1.5px dashed var(--line); }
.changelog-entry:last-child{ border-bottom:none; }
.changelog-date{ font-size:13px; font-weight:800; color:var(--sun-ink); margin-bottom:6px; }
.changelog-list{ margin:0; padding-left:20px; }
.changelog-list li{ font-size:13.5px; color:var(--ink); margin-bottom:4px; line-height:1.5; }
.section > h2{
  font-size:13px; font-weight:800; color:var(--ink-soft); margin:0 0 10px;
  text-transform:none;
}
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:640px){ .two-col{ grid-template-columns:1fr; } }

.ibox{
  display:flex; align-items:center; gap:10px; padding:9px 10px;
  border:2px solid var(--line); border-radius: var(--radius-sm); background:#fff;
  transition: background .15s;
}
.ibox:hover{ background: var(--paper-soft); border-color: var(--wood-light); }
.ibox .thumb{ width:44px; height:44px; object-fit:contain; background:#fff; border:2px solid var(--line); border-radius:10px; padding:4px; flex:none; }
.ibox .lbl{ font-size:11px; color:var(--ink-soft); font-weight:700; }
.ibox .val{ font-size:13.5px; font-weight:800; }
.ibox-grid{ display:grid; gap:9px; grid-template-columns: 1fr 1fr; }
@media (max-width:520px){ .ibox-grid{ grid-template-columns:1fr; } }

.req-check{
  width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line);
  flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:transparent; font-size:13px; font-weight:900;
}
.req-check.done{ background: var(--leaf); border-color:var(--leaf); color:#fff; }

.bubble-list{ display:flex; flex-direction:column; gap:10px; }
.brow{ display:flex; align-items:flex-start; gap:8px; }
.brow.right{ justify-content:flex-end; }
.avatar{ width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); object-fit:cover; background:#fff; flex:none; }
.bubble{
  position:relative; max-width:78%; padding:10px 13px; border-radius:15px; line-height:1.5; font-size:13.5px;
  border:1.5px solid var(--line);
}
.bubble .name{ font-weight:800; font-size:12px; margin-bottom:2px; }
.bubble.left{ background:#fff; color:var(--ink); border-bottom-left-radius:4px; }
.bubble.right{ background: var(--berry); color:#fff; border-bottom-right-radius:4px; border-color: var(--berry); }
.bubble.right .name{ color: rgba(255,255,255,.9); }

/* 대사: 게임 대화창 (제자리에서 한 장씩) */
.gdlg{ background:#fdfbf4; border:2px solid #3a4a6b; border-radius:12px; box-shadow:0 0 0 1.5px #c9d3ea inset; overflow:hidden; }
.gdlg .gd-line{ display:none; gap:8px; padding:10px 12px 8px; align-items:flex-start; }
.gdlg .gd-line.on{ display:flex; }
.gdlg .gd-line.player{ flex-direction:row-reverse; background:#eef4ff; }
.gdlg .gd-face{ flex:none; display:flex; }
.gdlg .gd-face img, .gdlg .gd-ph{ width:38px; height:38px; object-fit:cover; background:#fff; border:1.5px solid #d6dbe8; border-radius:50%; }
.gdlg .gd-ph{ display:flex; align-items:center; justify-content:center; font-size:18px; color:#9aa6c2; background:#f4f6fb; }
.gdlg .gd-body{ flex:1; min-width:0; }
.gdlg .gd-line.player .gd-body{ text-align:right; }
.gdlg .gd-name{ display:inline-block; background:#3a4a6b; color:#fff; font-size:11.5px; font-weight:800; padding:0 8px; border-radius:999px; margin-bottom:2px; }
.gdlg .gd-line.player .gd-name{ background:#2f6fd0; }
.gdlg .gd-text{ font-size:13.5px; line-height:1.5; color:#1d2433; white-space:pre-line; word-break:keep-all; overflow-wrap:anywhere; text-align:left; }
.gdlg .gd-bot{ display:flex; align-items:center; gap:6px; padding:4px 10px 6px; border-top:1px dashed #d6dbe8; background:#fbf8ee; }
.gdlg .gd-cnt{ font-size:11.5px; font-weight:700; color:#6b7590; margin-right:auto; }
.gdlg .gd-btn{ border:1.5px solid #3a4a6b; background:#fff; color:#3a4a6b; font-weight:800; font-size:11.5px; padding:1px 9px; border-radius:7px; cursor:pointer; }
.gdlg .gd-btn.main{ background:linear-gradient(#ffcf5a,#f3a712); border-color:#b97900; color:#3a2500; }
.gdlg .gd-btn:disabled{ opacity:.35; cursor:default; }

.gdlg .gd-line{ height:104px; box-sizing:border-box; }
.gdlg .gd-body{ height:100%; display:flex; flex-direction:column; }
.gdlg .gd-name{ align-self:flex-start; flex:none; }
.gdlg .gd-line.player .gd-name{ align-self:flex-end; }
.gdlg .gd-text{ flex:1; min-height:0; overflow-y:auto; padding-right:4px; scrollbar-width:thin; }

.chain-link{ display:flex; align-items:center; gap:10px; }
.chain-link .arrow{ color: var(--ink-soft); font-size:18px; flex:none; }

.desc-box{ font-size:14px; line-height:1.7; color: var(--ink); font-weight:500; }
.desc-box p{ margin:0; }

.count-badge{
  display:inline-flex; align-items:center; font-size:13px; font-weight:800; color:#fff;
  background:var(--berry); border:1.5px solid var(--line);
  padding:2px 10px; border-radius:999px; margin-left:6px; vertical-align:2px;
}

/* ---------- 서브 패널 (퀘스트/아이템/몬스터 상세를 페이지 이동 없이 보여줌) ---------- */
.panel-overlay{
  position:fixed; inset:0; background:rgba(70,40,13,.45);
  display:flex; justify-content:flex-end; z-index:100;
}
.panel-overlay.hidden{ display:none; }
.panel-box{
  position:relative; width:min(640px, 100%); height:100%;
  background: var(--bg); box-shadow: -6px 0 24px rgba(0,0,0,.25);
  overflow-y:auto; padding:20px 20px 40px;

<script src="data-quests.js?v=202611200109"></script>
<script>
(function(){
  'use strict';
  var QUESTS = window.QUESTS || [];
  var QUEST_DETAILS = window.QUEST_DETAILS || {};

  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  if (!id){
    // quest-1008.html 형태의 파일명에서도 id를 뽑아본다
    var m = location.pathname.match(/quest-(\d+)/);
    if (m) id = m[1];
  }

  var listItem = QUESTS.find(function(q){ return String(q.id)===String(id); });
  var detail = QUEST_DETAILS[String(id)];

  var TYPE_MAP = {
    '대화':{cls:'t-talk'}, '몬스터 사냥':{cls:'t-hunt'}, '아이템 수집':{cls:'t-collect'},
    '아이템 전달':{cls:'t-deliver'}, '아이템 사용':{cls:'t-use'}, '이동':{cls:'t-move'},
    '조사':{cls:'t-investigate'}, '퀘스트 완료':{cls:'t-etc'}, '전직':{cls:'t-job'}
  };
  function primaryType(t){ return String(t||'').split(/[,·]/)[0].trim() || '기타'; }
  function typeCls(t){ return (TYPE_MAP[primaryType(t)]||{cls:'t-etc'}).cls; }

  // 목록/카드용 이미지는 작은 크기로 요청해서 로딩을 줄임 (큰 원본은 상세 화면에서만 사용)
  function __smallImg(u){ return (typeof u==='string') ? u.replace(/([?&]sz=w)(\d+)/, function(m,a,b){ return a+Math.min(+b,400); }) : u; }
  function safeImg(src, alt, cls){
    var d = 'https://placehold.co/120x120/FFF9F0/9A8574?text=%20';
    return '<img src="'+__smallImg(src||d)+'" loading="lazy" decoding="async" alt="'+(alt||'')+'" class="'+(cls||'thumb')+'" onerror="this.onerror=null;this.src=\''+d+'\';">';
  }
  function fmt(n){ return Number(n||0).toLocaleString(); }

  var $detail = document.getElementById('detail');

  if (!listItem && !detail){
    $detail.innerHTML = '<div class="notready"><div class="big font-display" style="font-family:NanumSquare,sans-serif;font-size:18px;margin-bottom:6px;">퀘스트를 찾을 수 없어요</div><div>주소의 id 값을 다시 확인해 주세요.</div></div>';
    return;
  }

  var base = detail || listItem;
  var tcls = typeCls(base.type);

  function isPlayer(who){ return /^(나|플레이어|주인공|Player|영웅)$/i.test(String(who||'').trim()); }
  function avatarFor(who){
    if (!detail) return '';
    if (detail.start && detail.start.npc && who===detail.start.npc.name) return detail.start.npc.img;
    if (detail.finish && detail.finish.npc && who===detail.finish.npc.name) return detail.finish.npc.img;
    return '';
  }
    // 대사를 게임 대화창 형태로 (제자리에서 한 장씩 넘겨 보기)
    function gameDialogHtml(list){
      var n = list.length;
      var lines = list.map(function(d, k){
        var p = isPlayer(d.who); var av = p ? '' : avatarFor(d.who);
        var pimg = ''; if (p) { try { pimg = localStorage.getItem('lonaPlayerImg') || ''; } catch(e){} }
        if (pimg) av = pimg;
        var face = av ? '<img src="'+av+'" alt="'+(p?'플레이어':(d.who||''))+'">' : '<div class="gd-ph">'+(p?'🧑':'💬')+'</div>';
        return '<div class="gd-line'+(p?' player':'')+(k===0?' on':'')+'"><div class="gd-face">'+face+'</div><div class="gd-body"><div class="gd-name">'+(p?'플레이어':(d.who||''))+'</div><div class="gd-text">'+(d.text||'')+'</div></div></div>';
      }).join('');
      return '<div class="gdlg" data-i="0">' + lines +
        '<div class="gd-bot"><span class="gd-cnt">1 / '+n+'</span>' +
        (list.some(function(d){ return isPlayer(d.who); }) ? '<button type="button" class="gd-btn gd-pset" title="내 캐릭터 이미지를 넣으면 플레이어 대사에 그 이미지가 나와요">🧑 내 이미지</button><button type="button" class="gd-btn gd-pclr" title="플레이어 이미지 지우기" style="'+(function(){ try { return localStorage.getItem('lonaPlayerImg') ? '' : 'display:none;'; } catch(e){ return 'display:none;'; } })()+'">✕</button>' : '') +
        '<button type="button" class="gd-btn gd-prev" disabled>◀ 이전</button>' +
        '<button type="button" class="gd-btn main gd-next"'+(n<2?' disabled':'')+'>다음 ▶</button></div></div>';
    }
  function dialogueRow(d){
    var left = !isPlayer(d.who);
    var av = left ? avatarFor(d.who) : '';
    var displayWho = left ? (d.who||'') : '플레이어';
    return (
      '<div class="brow '+(left?'':'right')+'">'+
        (left && av ? '<img class="avatar" src="'+av+'" alt="'+(d.who||'')+'">' : '')+
        '<div class="bubble '+(left?'left':'right')+'">'+
          '<div class="name">'+displayWho+'</div>'+
          '<div style="white-space:pre-line;">'+(d.text||'')+'</div>'+
        '</div>'+
      '</div>'
    );
  }

  function reqBox(r){
    if (r.kind==='quest'){ return '<a class="ibox" href="quest-detail.html?id='+r.id+'"><div><div class="lbl">완료해야 할 퀘스트</div><div class="val">'+(r.name||'')+'</div></div></a>'; }
    if (r.kind==='meso'){ return '<div class="ibox">'+safeImg(r.img,'메소','thumb')+'<div><div class="lbl">필요 메소</div><div class="val">'+fmt(r.meso)+' 메소</div></div></div>'; }
    var isItem = r.kind==='item';
    var isUse = r.kind==='use';
    var title = (r.name||'')+(r.qty!=null?' ×'+r.qty:'');
    var href = r.id ? ((isItem||isUse) ? ('item-detail.html?id='+r.id) : ('monster-detail.html?id='+r.id)) : '';
    var label = isUse ? '사용 아이템' : (isItem ? '필요 아이템' : '처치 대상');
    var inner = safeImg(r.img, r.name, 'thumb')+'<div><div class="lbl">'+label+'</div><div class="val">'+title+'</div></div>';
    return href ? '<a class="ibox" href="'+href+'">'+inner+'</a>' : '<div class="ibox">'+inner+'</div>';
  }
    // 개수별 보상: tier가 있으면 개수마다 따로 묶어서 표시
    function rewardsHtml(list){
      list=list||[];
      if(!list.some(function(r){return r&&r.tier;})) return '<div class="ibox-grid">'+list.map(rewardBox).join('')+'</div>';
      var order=[],groups={};
      list.forEach(function(r){var k=r.tier||'';if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(Object.assign({},r,{tier:null}));});
      return order.map(function(k){return '<div style="margin:10px 0 6px;font-weight:700;color:#db2777;">'+(k?(k+' 가져가면'):'공통')+'</div><div class="ibox-grid">'+groups[k].map(rewardBox).join('')+'</div>';}).join('');
    }
    var FAME_ICON = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIwIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjZmZlMDY2Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjZmZiODAwIi8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHBhdGggZD0iTTMyIDRsOC40IDE3LjkgMTkuNiAyLjQtMTQuNSAxMy40IDMuOSAxOS40TDMyIDQ3LjQgMTQuNiA1Ny4xbDMuOS0xOS40TDQgMjQuM2wxOS42LTIuNHoiIGZpbGw9InVybCgjZykiIHN0cm9rZT0iI2UwOWIwMCIgc3Ryb2tlLXdpZHRoPSIyLjUiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4="; // 인기도 보상 기본 아이콘
  function rewardBox(r){
    var tierTag = r.tier ? '<b style="color:#db2777">['+r.tier+']</b> ' : '';
    if (typeof r.exp === 'number'){
      return '<div class="ibox">'+safeImg(r.img,'EXP','thumb')+'<div><div class="lbl">'+tierTag+'경험치</div><div class="val">'+fmt(r.exp)+' exp</div></div></div>';
    }
    if (typeof r.meso === 'number'){
      return '<div class="ibox">'+safeImg(r.img,'메소','thumb')+'<div><div class="lbl">'+tierTag+'메소</div><div class="val">'+fmt(r.meso)+' 메소</div></div></div>';
    }
    if (typeof r.fame === 'number'){
      return '<div class="ibox">'+safeImg(r.img||FAME_ICON,'인기도','thumb')+'<div><div class="lbl">'+tierTag+'인기도</div><div class="val">⭐ '+(r.fame>=0?'+':'')+r.fame+'</div></div></div>';
    }
    var title = (r.name||'')+((r.qty&&r.qty>0)?' ×'+r.qty:'')+(r.chance!=null?' · '+r.chance+'%':'');
    var inner = safeImg(r.img, r.name, 'thumb')+'<div><div class="lbl">'+tierTag+(r.random?'확률 보상 아이템':(r.choice?'선택 보상 아이템':'보상 아이템'))+(r.job?' · '+r.job:'')+'</div><div class="val">'+title+'</div></div>';
    return r.itemId ? '<a class="ibox" href="item-detail.html?id='+r.itemId+'">'+inner+'</a>' : '<div class="ibox">'+inner+'</div>';
  }
  function tipBox(t){
    if (t.kind==='npc'){ var nh=t.id?('npc-detail.html?id='+t.id):''; var ni=safeImg(t.img,t.name,'thumb')+'<div><div class="lbl">'+(t.subtitle||'NPC')+'</div><div class="val">'+(t.name||'')+'</div></div>'; return nh?('<a class="ibox" href="'+nh+'">'+ni+'</a>'):('<div class="ibox">'+ni+'</div>'); }
    if (t.kind==='map'){ var mh=t.code?('map-detail.html?code='+t.code):''; var mi=safeImg(t.img,t.name,'thumb')+'<div><div class="lbl">'+(t.subtitle||'이동할 맵')+'</div><div class="val">'+(t.name||'')+'</div></div>'; return mh?('<a class="ibox" href="'+mh+'">'+mi+'</a>'):('<div class="ibox">'+mi+'</div>'); }
    if (t.kind==='image'){
      return '<div class="ibox" style="grid-column:1/-1;display:block;"><div class="lbl">'+(t.subtitle||'TIP')+(t.name?' · '+t.name:'')+' <a href="'+t.img+'" target="_blank" rel="noopener" style="margin-left:6px;color:var(--pink-ink);">새 창에서 크게 보기</a></div><a href="'+t.img+'" target="_blank" rel="noopener"><img src="'+t.img+'" alt="'+(t.name||'TIP')+'" style="display:block;width:100%;height:auto;margin-top:8px;border-radius:10px;background:#fff;border:2px solid var(--line);" onerror="this.outerHTML=\'<div style=&quot;padding:14px;color:var(--ink-soft);font-size:12px;&quot;>이미지를 불러오지 못했어요. 위 링크를 눌러 새 창에서 열어보세요.</div>\'"></a></div>';
    }
    if (t.kind==='text' || (!t.img && !t.id)){
      return '<div class="ibox" style="grid-column:1/-1;"><div class="val">'+(t.name||'')+'</div></div>';
    }
    var subtitle = t.kind==='monster' ? '몬스터 사냥' : (t.subtitle||'TIP');
    var href = t.id ? (t.kind==='monster' ? ('monster-detail.html?id='+t.id) : ('item-detail.html?id='+t.id)) : '';
    var inner = safeImg(t.img, t.name, 'thumb')+'<div><div class="lbl">'+subtitle+'</div><div class="val">'+(t.name||'')+(t.level?' (Lv.'+t.level+')':'')+'</div></div>';
    return href ? '<a class="ibox" href="'+href+'">'+inner+'</a>' : '<div class="ibox">'+inner+'</div>';
  }
  function craftHtml(detail){
    var h = '';
    if (detail.craftReqs && detail.craftReqs.length){
      h += '<div class="section"><h2>제작 시 필요 아이템</h2><div class="ibox-grid">' + detail.craftReqs.map(function(r){
        var inner = safeImg(r.img, r.name, 'thumb')+'<div><div class="lbl">제작 재료</div><div class="val">'+(r.name||'')+(r.qty?' ×'+r.qty:'')+'</div></div>';
        return r.id ? '<a class="ibox" href="item-detail.html?id='+r.id+'">'+inner+'</a>' : '<div class="ibox">'+inner+'</div>';
      }).join('') + '</div></div>';
    }
    if (detail.craftNpcs && detail.craftNpcs.length){
      h += '<div class="section"><h2>제작 NPC</h2><div class="ibox-grid">' + detail.craftNpcs.map(function(n){
        var href = n.npcId ? 'npc-detail.html?id='+n.npcId : (n.mapId ? 'map-detail.html?id='+n.mapId : '');
        var inner = (n.img ? safeImg(n.img, n.name, 'thumb') : '')+'<div><div class="lbl">제작 NPC</div><div class="val">'+(n.name||'')+'</div>'+(n.place?'<div class="lbl">'+n.place+'</div>':'')+'</div>';
        return href ? '<a class="ibox" href="'+href+'">'+inner+'</a>' : '<div class="ibox">'+inner+'</div>';
      }).join('') + '</div></div>';
    }
    return h;

  // ---- 완료 대사 ----
  if (detail.completionDialogues && detail.completionDialogues.length){
    html += '<div class="section"><h2>완료 대사</h2>' + gameDialogHtml(detail.completionDialogues) + '</div>';
  }

  html += craftHtml(detail);

  // ---- 보상 ----
  if (detail.rewards && detail.rewards.length){
    html += '<div class="section"><h2>완료 보상</h2>' + rewardsHtml(detail.rewards) + '</div>';
  }

  // ---- 다음 퀘스트 ----
  if (detail.nexts && detail.nexts.length){
    html += '<div class="section"><h2>다음 퀘스트</h2><div class="ibox-grid">' + detail.nexts.map(function(n){ return chainBox(n, '다음 퀘스트'); }).join('') + '</div></div>';
  }

  $detail.innerHTML = html;
})();
</script>

<script>
// 게임 대화창: 이전/다음 버튼 (패널이 다시 그려져도 동작하도록 문서 전체에서 처리)
(function(){
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('.gdlg .gd-prev, .gdlg .gd-next');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var box = b.closest('.gdlg'), ls = box.querySelectorAll('.gd-line'), i = +box.getAttribute('data-i') || 0;
    i += b.classList.contains('gd-next') ? 1 : -1;
    if (i < 0 || i >= ls.length) return;
    box.setAttribute('data-i', i);
    for (var k = 0; k < ls.length; k++) ls[k].classList.toggle('on', k === i);
    box.querySelector('.gd-cnt').textContent = (i+1) + ' / ' + ls.length;
    box.querySelector('.gd-prev').disabled = (i === 0);
    box.querySelector('.gd-next').disabled = (i === ls.length - 1);
  }, true);
})();
</script>
<script>
// 플레이어 이미지: 이 브라우저에 저장해 두고 대사 창의 플레이어 얼굴로 사용
(function(){
  var KEY='lonaPlayerImg';
  function get(){ try{ return localStorage.getItem(KEY)||''; }catch(e){ return ''; } }
  function apply(){
    var src=get();
    document.querySelectorAll('.gdlg .gd-line.player .gd-face').forEach(function(f){
      f.innerHTML = src ? '<img src="'+src+'" alt="플레이어">' : '<div class="gd-ph">🧑</div>';
    });
    document.querySelectorAll('.gdlg .gd-pclr').forEach(function(b){ b.style.display = src ? '' : 'none'; });
  }
  window.__applyPlayerImg = apply;
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.style.display='none';
  document.addEventListener('DOMContentLoaded',function(){ document.body.appendChild(inp); });
  if (document.body) document.body.appendChild(inp);
  inp.addEventListener('change',function(){
    var file=inp.files&&inp.files[0]; inp.value=''; if(!file) return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var S=128, c=document.createElement('canvas'); c.width=S; c.height=S;
        var g=c.getContext('2d'), r=Math.min(im.width,im.height), sx=(im.width-r)/2, sy=(im.height-r)/2;
        g.drawImage(im,sx,sy,r,r,0,0,S,S);
        try{ localStorage.setItem(KEY,c.toDataURL('image/png')); }catch(e){ alert('이미지를 저장하지 못했어요.'); return; }
        apply();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.gdlg .gd-pset, .gdlg .gd-pclr'); if(!b) return;
    e.preventDefault(); e.stopPropagation();
    if(b.classList.contains('gd-pset')) inp.click();
    else { try{ localStorage.removeItem(KEY); }catch(err){} apply(); }
  },true);
})();
</script>
</body>
</html>
