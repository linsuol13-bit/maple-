<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>로나월드 · 메이플 퀘스트 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<style>
/* =========================================================
   로나월드 — 디자인 토큰 (메이플 나무액자 퀘스트창 스타일)
   ========================================================= */
:root{
  --bg: #F5F3EF;
  --paper: #FFFFFF;
  --paper-soft: #F8F6F2;
  --wood: #D9D2C4;
  --wood-dark: #E4DFD3;
  --wood-light: #EFEAE0;
  --ink: #332C22;
  --ink-soft: #8C8172;
  --line: #EAE4D8;

  --leaf: #4C9A2A;
  --leaf-soft: #E7F3DC;
  --leaf-ink: #2C6614;

  --berry: #E2405F;
  --berry-soft: #FCE7EB;
  --berry-ink: #A01D3C;

  --sun: #F0A93A;
  --sun-soft: #FBEFD6;
  --sun-ink: #8A5A06;

  --sky: #3E9BD6;
  --sky-soft: #E5F2FA;
  --sky-ink: #1E5C86;

  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 9px;
  --pop: 0 10px 24px rgba(51,44,34,.09);
  --pop-sm: 0 4px 12px rgba(51,44,34,.07);
  --pop-md: 0 14px 34px rgba(51,44,34,.14);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: "NanumSquare", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height:1.55;
}
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
button{ font:inherit; }

.font-display{
  font-family: "NanumSquare", sans-serif;
  letter-spacing: -.01em;
}

.wrap{ max-width:1180px; margin:0 auto; padding:20px 18px 64px; }

/* ---------- 헤더 ---------- */
.site-header{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:16px; margin-bottom:18px; flex-wrap:wrap;
}
.site-title{
  display:flex; align-items:center; gap:10px;
}
.site-title .mark{
  width:44px; height:44px; flex:none;
  filter: drop-shadow(0 3px 6px rgba(51,44,34,.18));
}
.site-title h1{
  font-size:28px; margin:0; font-weight:400;
  color:var(--ink);
}
.site-title p{
  margin:3px 0 0; font-size:13px; color:var(--ink-soft); font-weight:600;
}
.reset-btn{
  border:1.5px solid var(--line); background:var(--paper);
  color:var(--ink); padding:9px 14px; border-radius:999px;
  cursor:pointer; font-size:13px; font-weight:700;
  box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.reset-btn:hover{ background: var(--sun-soft); }
.reset-btn:active{ transform: scale(.97); }

/* ---------- 탭 ---------- */
.tabs{
  display:flex; flex-wrap:wrap; gap:8px; padding:4px 4px 10px; margin-bottom:14px;
}
.tab{
  position:relative;
  flex:none;
  display:flex; align-items:center; gap:6px;
  border:1.5px solid var(--line); background:var(--paper);
  color: var(--ink);
  padding:9px 16px; border-radius:999px; cursor:pointer;
  font-size:14px; font-weight:700; white-space:nowrap;
  box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.tab:hover{ background: var(--paper-soft); }
.tab .n{
  font-size:11px; font-weight:800; padding:1px 7px; border-radius:999px;
  background: var(--bg); color: var(--ink); border:1.5px solid var(--line);
}
.tab.on{
  background: var(--sun); border-color: var(--sun); color:var(--ink);
}
.tab.on .n{ background: var(--paper); }
.tab-dropdown{
  display:none; position:absolute; top:100%; left:0; z-index:30;
  padding-top:8px; cursor:default;
}
.tab-dropdown-panel{
  background:#fff; border:1.5px solid var(--line); border-radius: var(--radius-md);
  box-shadow: var(--pop-md); padding:8px; min-width:180px;
  display:flex; flex-direction:column; gap:2px;
}
.tab:hover .tab-dropdown, .tab:focus-within .tab-dropdown{ display:block; }
.tab-dropdown-item{
  padding:8px 10px; border-radius:8px; font-size:13px; font-weight:700;
  color:var(--ink); white-space:nowrap; text-align:left; cursor:pointer;
}
.tab-dropdown-item:hover{ background: var(--paper-soft); }
.tab-dropdown-item.on{ background: var(--sun-soft); color:var(--sun-ink); }

/* ---------- 필터 보드 ---------- */
.board{
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:16px;
  margin-bottom:20px;
  box-shadow: var(--pop);
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
  gap:14px;
  position:relative;
}
.field label{
  display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:700;
}
.field input[type="text"],
.field input[type="number"],
.field select{
  width:100%; border:2px solid var(--line); background:#fff;
  border-radius: var(--radius-sm); padding:9px 11px; font-size:14px; color:var(--ink);
  font-weight:600;
}
.field input:focus, .field select:focus{
  outline:none; border-color: var(--sun);
}
.field-toggle{ display:flex; align-items:center; gap:8px; }
.field-toggle label{ margin-bottom:0; cursor:pointer; }
.field-toggle input[type="checkbox"]{ width:20px; height:20px; accent-color: var(--sun); cursor:pointer; }
.level-range-row{ display:flex; align-items:center; gap:6px; }
.lv-input{ min-width:0; flex:1 1 0; text-align:center; }
.lv-sep{ color:var(--ink-soft); flex:none; font-size:13px; font-weight:700; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; grid-column: 1 / -1; }
.filter-block{ grid-column: 1 / -1; display:flex; flex-direction:column; gap:12px; }
.filter-row{ display:flex; flex-direction:column; gap:6px; }
.filter-row-label{ font-size:12px; font-weight:800; color:var(--ink-soft); }
.tabs-row{ border-bottom:2px solid var(--line); padding-bottom:8px; }
.chip{
  border:1.5px solid var(--line); background:#fff; color:var(--ink);
  padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.chip:hover{ background: var(--paper-soft); }
.chip.on{
  background: var(--leaf); border-color:var(--leaf); color:#fff;
}
.hint{ grid-column: 1/-1; font-size:12px; color:var(--ink-soft); font-weight:600; }

/* ---------- 목록 그리드 ---------- */
.grid{
  display:grid; gap:16px;
  grid-template-columns: repeat(1, minmax(0,1fr));
}
@media (min-width:640px){ .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (min-width:980px){ .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
.hidden{ display:none !important; }

/* ---------- 카드 ---------- */
.qcard{
  position:relative;
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:16px 15px 13px;
  box-shadow: var(--pop-sm);
  display:block;
  transition: transform .15s ease, box-shadow .15s ease;
}
.qcard:hover{ transform: translateY(-3px); box-shadow: var(--pop); }
.qcard.owned{ background: var(--sun-soft); border-color: var(--sun); }
.fav-star{
  position:absolute; top:8px; right:8px; z-index:5;
  width:26px; height:26px;
  background: #fff; border:1.5px solid var(--line); border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; line-height:1; cursor:pointer;
  color: var(--ink-soft);
  box-shadow: var(--pop-sm);
  transition: transform .12s ease;
}
.qcard.owned .fav-star{ background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
.fav-star:hover{ transform: scale(1.1); }
.own-star-inline{
  background:none; border:none; font-size:22px; line-height:1; cursor:pointer;
  color:var(--sun-ink); vertical-align:middle; padding:0 0 0 4px;
}
.own-star-inline:hover{ transform:scale(1.15); display:inline-block; }
.fav-star-inline{
  background:none; border:none; font-size:22px; line-height:1; cursor:pointer;
  color:var(--sun-ink); vertical-align:middle; padding:0 0 0 4px;
}
.fav-star-inline:hover{ transform:scale(1.15); display:inline-block; }
.qcard .ribbon{
  position:absolute; top:-12px; left:16px; right:16px;
  display:flex; flex-wrap:wrap; gap:6px;
}
.ribbon-pill{
  font-size:11px; font-weight:800; padding:4px 10px 3px;
  border:1.5px solid var(--line);
  border-radius:999px; display:flex; align-items:center; gap:4px;
  box-shadow: var(--pop-sm);
}
.qcard .top{ display:flex; gap:10px; margin-top:10px; }
.qcard .thumb{
  width:54px; height:54px; object-fit:contain; background:#fff;
  border:1.5px solid var(--line); border-radius:11px; padding:5px; flex:none;
}
.qcard .meta-title{ min-width:0; }
.qcard .code{ font-size:11.5px; color:var(--ink-soft); font-weight:800; }
.qcard .title{ font-size:15.5px; font-weight:800; margin-top:1px; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.qcard .meta{ font-size:12px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
.qcard .exp-row{ margin-top:10px; }
.qcard .bar{ height:8px; border-radius:999px; background:#fff; overflow:hidden; border:1.5px solid var(--line); }
.qcard .bar > div{ height:100%; background: linear-gradient(90deg, var(--leaf), var(--sun)); }
.qcard .exp-text{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; text-align:right; font-weight:700; }
.qcard .card-body{ display:block; color:inherit; text-decoration:none; }

.qcard .job-row{ font-size:11px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
.qcard .reward-names{ font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.4; font-weight:600; }
.qcard .fame-chip{
  display:inline-flex; align-items:center; gap:3px; margin-top:6px;
  font-size:11px; font-weight:800; color:var(--sun-ink); background:var(--sun-soft);
  border:1.5px solid var(--sun);
  padding:2px 8px; border-radius:999px;
}

.qcard .complete-zone{ margin-top:11px; padding-top:11px; border-top:2px dashed var(--line); }
.complete-btn{
  width:100%; border:1.5px solid var(--line); background:var(--leaf-soft); color:var(--leaf-ink);
  font-weight:800; font-size:12.5px; padding:9px 10px; border-radius:var(--radius-sm);
  cursor:pointer; box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.complete-btn:hover{ background: var(--leaf); color:#fff; }
.complete-btn:active{ transform: scale(.98); }
.next-quest-btn{
  display:inline-block; background: var(--sun); color:var(--ink); font-weight:800; font-size:14px;
  padding:12px 22px; border-radius:999px; box-shadow: var(--pop-sm);
  transition: transform .1s ease, box-shadow .1s ease;
}
.next-quest-btn:hover{ transform: translateY(-2px); box-shadow: var(--pop); }
.chain-nav-btn{
  display:inline-block; font-size:12px; font-weight:800; padding:6px 12px;
  border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  white-space:nowrap;
}
.chain-nav-btn:hover{ background: var(--paper-soft); }
.chain-nav-btn.disabled{ color: var(--ink-soft); opacity:.5; cursor:default; }
.done-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.done-badge{
  font-size:12px; font-weight:800; color:#fff; background:var(--leaf);
  border:1.5px solid var(--line);
  padding:6px 10px; border-radius:999px; flex:1; text-align:center;
}
.undo-btn{
  border:none; background:none; color:var(--ink-soft); font-size:11px; font-weight:700; cursor:pointer;
  text-decoration:underline; flex:none;
}
.choice-box{ display:flex; flex-direction:column; gap:6px; }
.choice-box .choice-label{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
.choice-item{
  display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; padding:6px 8px;
  border:2px solid var(--line); border-radius: var(--radius-sm); cursor:pointer; background:#fff;
}
.choice-item input{ accent-color: var(--leaf); }
.choice-confirm-btn{
  border:1.5px solid var(--line); background: var(--leaf); color:#fff; font-weight:800; font-size:12.5px;
  padding:8px 10px; border-radius: var(--radius-sm); cursor:pointer; margin-top:2px;
  box-shadow: var(--pop-sm);
}
.choice-confirm-btn:active{ transform: scale(.98); }

/* type color variants */
.t-talk.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-hunt.ribbon-pill{ background:var(--berry-soft); color:var(--berry-ink); }
.t-collect.ribbon-pill{ background:var(--sun-soft); color:var(--sun-ink); }
.t-deliver.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-use.ribbon-pill{ background:var(--sun-soft); color:var(--sun-ink); }
.t-move.ribbon-pill{ background:var(--sky-soft); color:var(--sky-ink); }
.t-investigate.ribbon-pill{ background:var(--leaf-soft); color:var(--leaf-ink); }
.t-etc.ribbon-pill{ background:#EEE4D2; color:var(--ink-soft); }

/* ---------- 빈 상태 ---------- */
.empty{
  grid-column: 1/-1;
  text-align:center; padding:56px 20px; color:var(--ink-soft);
  background: var(--paper-soft); border:3px dashed var(--wood-light);
  border-radius: var(--radius-lg);
}
.empty .big{ font-family:"NanumSquare",sans-serif; font-size:19px; color:var(--ink); margin-bottom:6px; }

/* ---------- 상세 페이지 공통 ---------- */
.back-link{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800;
  color: var(--ink); margin-bottom:16px;
}
.back-link:hover{ color: var(--berry-ink); }

.detail-header{
  background: var(--paper);
  border:1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding:20px 22px;
  margin-bottom:18px;
  box-shadow: var(--pop);
  position:relative;
}
.detail-header .type-tag{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800;
  border:1.5px solid var(--line);
  padding:4px 11px; border-radius:999px; margin-bottom:10px;
}
.detail-header h1{
  font-family:"NanumSquare",sans-serif; font-weight:400; font-size:25px; margin:0 0 6px;
  text-shadow: 2px 2px 0 rgba(78,45,16,.15);
}
.detail-header .sub{ font-size:13px; color:var(--ink-soft); font-weight:700; }
.npc-place-list{ display:flex; flex-wrap:wrap; gap:9px; }
.npc-place-card{
  display:inline-flex; align-items:center; gap:8px;
  padding:5px 14px 5px 5px; flex:none;
  border:2px solid var(--line); border-radius:999px; background:#fff;
  text-decoration:none; color:inherit;
  transition:background .15s, border-color .15s;
  position:relative;
}
.npc-place-card:hover{ background:var(--paper-soft); border-color:var(--wood-light); }
.npc-place-card .icon{
  width:34px; height:34px; object-fit:contain; flex:none;
  border-radius:8px; border:2px solid var(--line); background:#fff; padding:3px;
}
.npc-place-card .txt .lbl{ font-size:10px; color:var(--ink-soft); font-weight:700; line-height:1.25; }
.npc-place-card .txt .val{ font-size:13px; font-weight:800; line-height:1.25; white-space:nowrap; }
.map-preview{
  position:absolute; left:0; top:calc(100% + 8px);
  transform:translateY(-4px) scale(.97); transform-origin: top left;
  width:260px; max-width:min(70vw,320px); background:#fff; padding:5px;
  border-radius:12px; border:3px solid var(--wood-dark); box-shadow:0 12px 26px rgba(0,0,0,.28);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .15s ease, transform .15s ease; z-index:60;
}
.map-preview img{ width:100%; height:auto; display:block; border-radius:8px; }
.npc-place-card:hover .map-preview{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }

/* ---------- NPC 판매 상품 호버 정보 ---------- */
.item-tooltip{
  position:absolute; left:0; top:calc(100% + 8px);
  transform:translateY(-4px) scale(.97); transform-origin: top left;
  width:220px; background:#fff; padding:10px 12px; text-align:left; color:var(--ink);
  border-radius:12px; border:2.5px solid var(--wood-dark); box-shadow:0 12px 26px rgba(0,0,0,.28);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .15s ease, transform .15s ease; z-index:70;
}
.item-tooltip-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.item-tooltip-head img{ width:32px; height:32px; object-fit:contain; border-radius:8px; border:1.5px solid var(--line); background:#fff; flex:none; }
.item-tooltip-head .name{ font-size:13px; font-weight:800; line-height:1.3; }
.item-tooltip-row{ font-size:11.5px; color:var(--ink-soft); padding:1.5px 0; }
.item-tooltip-row b{ color:var(--ink); font-weight:800; white-space:nowrap; }
.item-tooltip-desc{ font-size:11px; color:var(--ink-soft); margin-top:6px; padding-top:6px; border-top:1px solid var(--line); line-height:1.4; }

.item-chip-list{ display:flex; flex-wrap:wrap; gap:9px; }
.item-chip{
  display:inline-flex; align-items:center; gap:9px;
  padding:6px 16px 6px 6px; flex:none; position:relative;
  border:2px solid var(--line); border-radius:999px; background:#fff;
  text-decoration:none; color:inherit;
  transition:background .15s, border-color .15s;
}
.item-chip:hover{ background:var(--paper-soft); border-color:var(--wood-light); }
.item-chip:hover .item-tooltip{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
.item-hover-box{ position:relative; }
.item-hover-box:hover .item-tooltip{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }

/* ---------- 아이템 타일(3열 컴팩트) ---------- */
.item-tile-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap:8px; }
.item-tile{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px;
  padding:9px 4px; border:2px solid var(--line); border-radius:12px; background:#fff;
  text-decoration:none; color:inherit; position:relative;
  transition:background .15s, border-color .15s;
}
.item-tile:hover{ background:var(--paper-soft); border-color:var(--wood-light); }
.item-tile .thumb{ width:40px; height:40px; object-fit:contain; border-radius:8px; border:2px solid var(--line); background:#fff; padding:3px; }
.item-tile .val{ font-size:11.5px; font-weight:800; line-height:1.25; word-break:keep-all; }
.item-tile .lbl{ font-size:9.5px; color:var(--ink-soft); font-weight:700; }
.item-tile .item-tooltip{ left:0; right:auto; transform:translateY(-4px) scale(.97); transform-origin:top left; }
.item-tile.tooltip-flip .item-tooltip{ left:auto; right:0; transform-origin:top right; }
.item-tile:hover .item-tooltip{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
.item-tile .map-preview{ left:0; right:auto; transform:translateY(-4px) scale(.97); transform-origin:top left; }
.item-tile.tooltip-flip .map-preview{ left:auto; right:0; transform-origin:top right; }
.item-tile:hover .map-preview{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
.item-chip .icon{
  width:46px; height:46px; object-fit:contain; flex:none;
  border-radius:10px; border:2px solid var(--line); background:#fff; padding:3px;
}
.item-chip .txt .lbl{ font-size:10.5px; color:var(--ink-soft); font-weight:700; line-height:1.25; }
.item-chip .txt .val{ font-size:13.5px; font-weight:800; line-height:1.3; white-space:nowrap; }

.craft-card{
  border:2px solid var(--line); border-radius:12px; background:#fff; padding:2px 12px; margin-bottom:8px;
}
.craft-card[open]{ padding-bottom:10px; }
.craft-card-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  padding:8px 0; cursor:pointer; list-style:none;
}
.craft-card-head::-webkit-details-marker{ display:none; }
.craft-card-head::after{ content:'▾'; font-size:11px; color:var(--ink-soft); margin-left:auto; transition:transform .15s; }
.craft-card[open] .craft-card-head::after{ transform:rotate(180deg); }
.craft-card-head .item-chip, .craft-mats .item-chip{
  padding:4px 8px 4px 0; gap:6px; border:none; background:transparent; border-radius:0;
}
.craft-card-head .item-chip:hover, .craft-mats .item-chip:hover{ background:transparent; }
.craft-card-head .item-chip .icon, .craft-mats .item-chip .icon{
  border:none; background:transparent; border-radius:0; padding:0; object-fit:contain;
}
.craft-card-head .item-chip .icon{ width:30px; height:30px; }
.craft-mats .item-chip .icon{ width:25px; height:25px; }
.craft-card-head .item-chip .txt .val{ font-size:13px; }
.craft-mats .item-chip .txt .val{ font-size:11.5px; }
.craft-price{ font-size:12.5px; font-weight:800; color:var(--berry); white-space:nowrap; margin-right:6px; }
.craft-mats{ display:flex; flex-wrap:wrap; gap:6px; padding-top:6px; border-top:1.5px dashed var(--line); }
.craft-note{ margin-top:6px; font-size:11px; color:var(--ink-soft); font-weight:600; }
.craft-or{ align-self:center; font-size:11px; font-weight:800; color:var(--ink-soft); }
.craft-group-title{ font-size:14px; font-weight:800; margin:14px 0 8px; color:var(--ink-soft); }
.craft-group-title:first-child{ margin-top:0; }
.craft-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.craft-tab{
  font-family:inherit; font-size:13px; font-weight:800; padding:7px 16px; border-radius:999px;
  border:2px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;
  transition:background .15s, border-color .15s, color .15s;
}
.craft-tab:hover{ border-color:var(--wood-light); }
.craft-tab.active{ background:var(--wood-dark); border-color:var(--wood-dark); color:#fff; }


.card{
  background: var(--paper); border:1.5px solid var(--line); border-radius: var(--radius-md);
  padding:16px;
}
.section{ margin-bottom:22px; }
.changelog-entry{ margin-bottom:18px; padding-bottom:16px; border-bottom:1.5px dashed var(--line); }
.changelog-entry:last-child{ border-bottom:none; }
.changelog-date{ font-size:13px; font-weight:800; color:var(--sun-ink); margin-bottom:6px; }
.changelog-list{ margin:0; padding-left:20px; }
.changelog-list li{ font-size:13.5px; color:var(--ink); margin-bottom:4px; line-height:1.5; }
.section > h2{
  font-size:13px; font-weight:800; color:var(--ink-soft); margin:0 0 10px;
  text-transform:none;
}
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:640px){ .two-col{ grid-template-columns:1fr; } }

.ibox{
  display:flex; align-items:center; gap:10px; padding:9px 10px;
  border:2px solid var(--line); border-radius: var(--radius-sm); background:#fff;
  transition: background .15s;
}
.ibox:hover{ background: var(--paper-soft); border-color: var(--wood-light); }
.ibox .thumb{ width:44px; height:44px; object-fit:contain; background:#fff; border:2px solid var(--line); border-radius:10px; padding:4px; flex:none; }
.ibox .lbl{ font-size:11px; color:var(--ink-soft); font-weight:700; }
.ibox .val{ font-size:13.5px; font-weight:800; }
.ibox-grid{ display:grid; gap:9px; grid-template-columns: 1fr 1fr; }
@media (max-width:520px){ .ibox-grid{ grid-template-columns:1fr; } }

/* ---------- 몬스터 기본 정보(스탯) 한눈에 보기 ---------- */
.mon-stat-grid{ display:grid; gap:8px; }
.mon-stat-grid + .mon-stat-grid{ margin-top:8px; }
.mon-stat-grid-3{ grid-template-columns: repeat(3, 1fr); }
.mon-stat-grid-4{ grid-template-columns: repeat(4, 1fr); }
@media (max-width:420px){ .mon-stat-grid-4{ grid-template-columns: repeat(3, 1fr); } }
.mon-stat-box{
  background:#fff; border:2px solid var(--line); border-radius:10px;
  padding:8px 4px; text-align:center;
}
.mon-stat-box .lbl{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }
.mon-stat-box .val{ font-size:14px; font-weight:800; margin-top:2px; }

.req-check{
  width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line);
  flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:transparent; font-size:13px; font-weight:900;
}
.req-check.done{ background: var(--leaf); border-color:var(--leaf); color:#fff; }

.bubble-list{ display:flex; flex-direction:column; gap:10px; }
.brow{ display:flex; align-items:flex-start; gap:8px; }
.brow.right{ justify-content:flex-end; }
.avatar{ width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); object-fit:cover; background:#fff; flex:none; }
.bubble{
  position:relative; max-width:78%; padding:10px 13px; border-radius:15px; line-height:1.5; font-size:13.5px;
  border:1.5px solid var(--line);
}
.bubble .name{ font-weight:800; font-size:12px; margin-bottom:2px; }
.bubble.left{ background:#fff; color:var(--ink); border-bottom-left-radius:4px; }
.bubble.right{ background: var(--berry); color:#fff; border-bottom-right-radius:4px; border-color: var(--berry); }
.bubble.right .name{ color: rgba(255,255,255,.9); }

.chain-link{ display:flex; align-items:center; gap:10px; }
.chain-link .arrow{ color: var(--ink-soft); font-size:18px; flex:none; }

.desc-box{ font-size:14px; line-height:1.7; color: var(--ink); font-weight:500; }
.desc-box p{ margin:0; }

.count-badge{
  display:inline-flex; align-items:center; font-size:13px; font-weight:800; color:#fff;
  background:var(--berry); border:1.5px solid var(--line);
  padding:2px 10px; border-radius:999px; margin-left:6px; vertical-align:2px;
}

.boss-badge{
  display:inline-flex; align-items:center; font-size:11.5px; font-weight:900; color:#FFE9B0;
  background:linear-gradient(135deg,#7A1414,#3A0D0D); border:2px solid var(--wood-dark);
  padding:2px 9px; border-radius:999px; margin-left:6px; vertical-align:2px; letter-spacing:.5px;
}

.transform-badge{
  display:inline-flex; align-items:center; font-size:11.5px; font-weight:900; color:#3A2A6E;
  background:linear-gradient(135deg,#E6D9FF,#C9B6F7); border:2px solid var(--wood-dark);
  padding:2px 9px; border-radius:999px; margin-left:6px; vertical-align:2px; letter-spacing:.5px;
}

.split-badge{
  display:inline-flex; align-items:center; font-size:11.5px; font-weight:900; color:#6E4A12;
  background:linear-gradient(135deg,#FFE3B3,#FFC56B); border:2px solid var(--wood-dark);
  padding:2px 9px; border-radius:999px; margin-left:6px; vertical-align:2px; letter-spacing:.5px;
}

/* ---------- 서브 패널 (퀘스트/아이템/몬스터 상세를 페이지 이동 없이 보여줌) ---------- */
.panel-overlay{
  position:fixed; inset:0; background:rgba(70,40,13,.45);
  display:flex; justify-content:flex-end; z-index:100;
}
.panel-overlay.hidden{ display:none; }
.panel-box{
  position:relative; width:min(640px, 100%); height:100%;
  background: var(--bg); box-shadow: -6px 0 24px rgba(0,0,0,.25);
  overflow-y:auto; padding:20px 20px 40px;
  animation: panelSlideIn .18s ease-out;
}
.panel-box.wide{ width:min(1100px, 100%); }
@keyframes panelSlideIn{ from{ transform:translateX(24px); opacity:0; } to{ transform:translateX(0); opacity:1; } }
@keyframes warpPulse{ 0%{ transform:translate(-50%,-50%) scale(.4); opacity:1; } 100%{ transform:translate(-50%,-50%) scale(1.6); opacity:0; } }
@media (max-width:640px){ .panel-box{ width:100%; } }
.panel-close{
  position:sticky; top:0; float:right; margin-left:12px;
  width:36px; height:36px; border-radius:50%; border:1.5px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:16px; font-weight:800; cursor:pointer;
  box-shadow: var(--pop-sm); z-index:2;
}
.panel-back{
  position:sticky; top:0; float:left;
  border-radius:999px; border:1.5px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:13px; font-weight:800; cursor:pointer;
  padding:8px 14px; box-shadow: var(--pop-sm); z-index:2;
}
.panel-back.hidden{ display:none; }
.panel-share{
  position:sticky; top:0; float:right; margin-right:8px;
  border-radius:999px; border:1.5px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:12.5px; font-weight:800; cursor:pointer;
  padding:8px 12px; box-shadow: var(--pop-sm); z-index:2; white-space:nowrap;
}
.panel-share.copied{ background:var(--sun-soft); color:var(--sun-ink); }
.panel-content{ clear:both; }
.panel-content .back-link{ display:none; }
.panel-content nav.tabs{ display:none; }
.panel-content .ibox-grid{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.chain-chip{
  flex:none; padding:6px 12px; border-radius:14px; border:1.5px solid var(--line);
  white-space:nowrap; background:#fff; color:var(--ink-soft);
  display:flex; flex-direction:column; align-items:center; gap:1px;
  max-width:120px;
}
.chain-chip .chain-code{ font-size:12px; font-weight:800; }
.chain-chip .chain-title{
  font-size:10px; font-weight:600; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.chain-chip.current{ background:var(--sun); color:var(--ink); }
.chip-sep{ align-self:center; color:var(--ink-soft); font-weight:800; margin:0 2px; }

/* ---------- 장비 정보 카드 ---------- */
.equip-card{
  background: linear-gradient(180deg, #2b3350, #1c2238);
  border:1.5px solid var(--line); border-radius: var(--radius-lg);
  overflow:hidden; box-shadow: var(--pop-sm); color:#fff;
  max-width:420px; margin:0 auto;
}
.equip-navy{ padding:18px 20px 16px; text-align:center; }
.equip-req{ display:grid; grid-template-columns:1fr 1fr; gap:5px 20px; font-size:13px; font-weight:700; color:#e8ebf5; text-align:center; margin-bottom:14px; }
.equip-req > div{ white-space:nowrap; }
.equip-jobs{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
.job-pill{
  font-size:12.5px; font-weight:800; padding:2px 2px; border-radius:0;
  border:none; background:none; color:#e08a8a;
}
.job-pill.on{ color:#fff; text-decoration:underline; text-underline-offset:3px; }
.equip-divider{ border-top:1px solid rgba(255,255,255,.25); margin:0 20px; }
.equip-stats{
  display:flex; flex-direction:column; gap:6px;
  font-size:13.5px; font-weight:700; color:#f0f1f6;
  padding:14px 20px; text-align:center;
}
.equip-price{
  display:flex; align-items:center; gap:6px; justify-content:center;
  padding:10px 12px; font-weight:800; color:var(--sun); font-size:12px;
  flex-wrap:nowrap; white-space:nowrap; overflow-x:auto;
}
.equip-price img.meso-icon{ width:14px; height:14px; object-fit:contain; vertical-align:-2px; margin-right:2px; flex:none; }
.equip-price .price-note{ font-size:10px; font-weight:600; color:#c7cadd; }

/* ---------- 통합 검색 ---------- */
.global-search-wrap{ position:relative; margin-bottom:14px; }
.global-search-input{
  width:100%; box-sizing:border-box; font-family:inherit; font-size:15px; font-weight:700;
  padding:14px 18px; border-radius:999px; border:1.5px solid var(--line);
  background:#fff; color:var(--ink); box-shadow: var(--pop-sm);
}
.global-search-input::placeholder{ color:var(--ink-soft); font-weight:600; }
.global-search-results{
  position:absolute; left:0; right:0; top:calc(100% + 8px); z-index:40;
  background:#fff; border:1.5px solid var(--line); border-radius: var(--radius-lg);
  box-shadow: var(--pop-md); max-height:420px; overflow-y:auto; padding:8px;
}
.global-search-results.hidden{ display:none; }
.gs-group-label{ font-size:11px; font-weight:800; color:var(--ink-soft); padding:8px 10px 4px; }
.gs-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer;
  text-decoration:none; color:var(--ink);
}
.gs-item:hover, .gs-item.sel{ background:var(--paper-soft); }
.gs-item img{ width:32px; height:32px; object-fit:contain; border-radius:8px; border:1.5px solid var(--wood-light); background:#fff; flex:none; }
.gs-item .gs-name{ font-weight:800; font-size:13.5px; }
.gs-item .gs-meta{ font-size:11px; color:var(--ink-soft); }
.gs-empty{ padding:16px; text-align:center; color:var(--ink-soft); font-size:13px; }

/* ---------- 필터 안의 검색형 콤보(몬스터로 찾기 등) ---------- */
.combo-wrap{ position:relative; }
.combo-suggest{
  position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:30;
  background:#fff; border:1.5px solid var(--line); border-radius: var(--radius-md);
  box-shadow: var(--pop-sm); max-height:240px; overflow-y:auto; padding:4px;
}
.combo-suggest.hidden{ display:none; }
.combo-item{
  display:flex; align-items:center; padding:7px 10px; border-radius:8px; cursor:pointer;
  font-size:13px; font-weight:700; color:var(--ink);
}
.combo-item:hover, .combo-item.sel{ background:var(--paper-soft); }
.combo-empty{ padding:10px; text-align:center; color:var(--ink-soft); font-size:12.5px; }


/* ---------- 최근 본 항목 ---------- */
.recent-strip{ margin-bottom:14px; }
.recent-strip.hidden{ display:none; }
.recent-strip-label{ font-size:11px; font-weight:800; color:var(--ink-soft); margin-bottom:6px; }
.recent-strip-list{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
.recent-chip{
  flex:none; display:flex; align-items:center; gap:6px; padding:6px 10px 6px 6px;
  border-radius:999px; border:1.5px solid var(--line); background:#fff; cursor:pointer;
  max-width:160px;
}
.recent-chip img{ width:24px; height:24px; object-fit:contain; border-radius:50%; flex:none; }
.recent-chip span{ font-size:12px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- 즐겨찾기 탭 ---------- */
.fav-group{ margin-bottom:26px; }
.fav-group-label{ font-size:15px; font-weight:900; font-family:'NanumSquare',sans-serif; color:var(--ink); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.fav-group-label .n{ font-size:12px; font-weight:800; color:var(--ink-soft); background:var(--paper-soft); border-radius:999px; padding:2px 9px; }

.notready{
  padding:40px 20px; text-align:center; color:var(--ink-soft);
  background: var(--paper-soft); border:2px dashed var(--line); border-radius: var(--radius-lg);
}
.pager{
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin:18px 0 6px;
}
.pager .page-btn{
  border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  border-radius:999px; padding:8px 16px; font-weight:800; font-size:13px; cursor:pointer;
  box-shadow: var(--pop-sm);
}
.pager .page-btn:disabled{ opacity:.4; cursor:default; box-shadow:none; }
.pager .page-info{ font-size:13px; font-weight:700; color:var(--ink-soft); }
.chip-sep{ align-self:center; color:var(--ink-soft); font-weight:800; margin:0 2px; }

/* ---------- 맵 뷰 전환 (일반맵/월드맵) ---------- */
.map-view-switch{ display:flex; gap:8px; grid-column:1/-1; margin-bottom:2px; }
.map-view-btn{
  border:1.5px solid var(--line); background:#fff; color:var(--ink);
  padding:8px 16px; border-radius:999px; font-size:13px; font-weight:800; cursor:pointer;
}
.map-view-btn.on{ background:var(--sky); border-color:var(--sky); color:#fff; }

/* ---------- 월드맵 ---------- */
.worldmap-region-tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.worldmap-region-tab{
  border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  padding:7px 14px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer;
}
.worldmap-region-tab.on{ background:var(--sun); border-color:var(--sun); }
.worldmap-region-tab.sub{ font-size:12px; padding:6px 12px; opacity:.9; }
.worldmap-stage{
  position:relative; display:inline-block; max-width:100%;
  border-radius: var(--radius-lg); border:2.5px solid var(--wood-dark);
  box-shadow: var(--pop); overflow:hidden; background:#cfe8f5;
}
.worldmap-stage img.bg{ display:block; width:100%; max-width:760px; }
.worldmap-mark{
  position:absolute; transform:translate(-50%,-50%);
  cursor:pointer; padding:0; border:0; background:none; line-height:0;
}
.worldmap-mark img{ display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,.45)); transition:filter .1s, transform .1s; }
.worldmap-mark:hover img{ filter:drop-shadow(0 2px 4px rgba(0,0,0,.45)) brightness(1.15); transform:scale(1.08); }
.worldmap-mark.field img{ width:12px; height:12px; }
.worldmap-mark.town img{ width:18px; height:18px; }
.worldmap-mark.house img{ width:13px; height:13px; }
.worldmap-mark.special img{ width:13px; height:13px; }
.worldmap-mark.native-special{ width:18px; height:18px; border-radius:50%; }
.worldmap-hover{
  position:absolute; z-index:40; width:250px;
  background:#fff; border:2px solid var(--wood-dark); border-radius:12px;
  box-shadow: var(--pop-md); padding:10px; pointer-events:none;
  display:none;
}
.worldmap-hover.show{ display:block; }
.worldmap-hover .wh-title{ font-size:13px; font-weight:800; color:var(--ink); margin-bottom:6px; }
.worldmap-hover img.wh-thumb{ width:100%; height:90px; object-fit:cover; border-radius:8px; border:1.5px solid var(--line); margin-bottom:8px; }
.worldmap-hover .wh-mons{ display:flex; flex-direction:column; gap:6px; }
.worldmap-hover .wh-mon-row{ display:flex; align-items:center; gap:8px; }
.worldmap-hover .wh-mon-row img{ width:38px; height:38px; object-fit:contain; border-radius:8px; border:1.5px solid var(--line); background:#fff; flex:none; }
.worldmap-hover .wh-mon-name{ font-size:12.5px; font-weight:800; color:var(--ink); }
.worldmap-hover .wh-mon-lv{ font-size:11px; font-weight:700; color:var(--ink-soft); }
.worldmap-hover .wh-empty{ font-size:11.5px; color:var(--ink-soft); }
/* 월드맵 그룹 선택창 (예: 에오스탑 층 선택) */
.wm-group-pop{
  position:absolute; z-index:60; min-width:190px; max-width:260px;
  background:#fff; border:2px solid var(--wood-dark); border-radius:12px;
  box-shadow: var(--pop-md); padding:8px;
}
.wm-group-pop .wgp-title{ font-size:13px; font-weight:800; color:var(--ink); margin:2px 4px 6px; }
.wm-group-pop .wgp-row{
  display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
  padding:7px 9px; margin:0 0 3px; font-family:inherit; font-size:12.5px; font-weight:800; color:var(--ink);
  background:#fff; border:1.5px solid var(--line); border-radius:8px; cursor:pointer; text-align:left;
}
.wm-group-pop .wgp-row:hover{ border-color:var(--sun); background:#fff8e8; }
.wm-group-pop .wgp-row.on{ border-color:var(--sun); background:#fff3d6; }
.wm-group-pop .wgp-row.soon{ color:var(--ink-soft); }
.wm-group-pop{ max-height:min(70vh,520px); overflow-y:auto; }
.wm-group-pop .wgp-back{ border:0; background:none; font-size:16px; font-weight:800; cursor:pointer; color:var(--ink); padding:0 4px; }
.wm-group-pop .wgp-soon{ font-size:10.5px; font-weight:700; color:var(--ink-soft); flex:none; }
.worldmap-mark.wm-pick{ z-index:45; filter:drop-shadow(0 0 6px rgba(242,169,59,.95)); }

/* ---------- 월드맵 검색 ---------- */
.worldmap-search{ position:relative; margin-bottom:12px; }
.wm-search-row{ display:flex; gap:8px; align-items:center; }
.wm-search-input{
  flex:1; min-width:0; padding:12px 14px; font-size:15px; font-family:inherit;
  border:1.5px solid var(--line); border-radius:14px; background:#fff; color:var(--ink);
}
.wm-search-input:focus{ outline:none; border-color:var(--sun); box-shadow:0 0 0 3px rgba(242,169,59,.25); }
.wm-clear-btn{
  flex:none; padding:10px 14px; font-size:13px; font-weight:800; font-family:inherit; cursor:pointer;
  border:1.5px solid var(--line); border-radius:999px; background:#fff; color:var(--ink);
}
.wm-clear-btn:hover{ background:var(--paper-soft); }
.wm-suggest{
  position:absolute; left:0; right:0; top:100%; z-index:120; margin-top:6px;
  background:#fff; border:1.5px solid var(--line); border-radius:14px; box-shadow:0 12px 28px rgba(51,44,34,.16);
  max-height:360px; overflow:auto; padding:6px;
}
.wm-sg-row{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
  padding:9px 10px; border:0; background:transparent; border-radius:10px; font-family:inherit; color:var(--ink);
}
.wm-sg-row:hover, .wm-sg-row.on{ background:var(--paper-soft); }
.wm-sg-row .wm-sg-ico{ flex:none; width:22px; text-align:center; }
.wm-sg-row .wm-sg-name{ font-size:14px; font-weight:800; }
.wm-sg-row .wm-sg-sub{ margin-left:auto; font-size:12px; font-weight:700; color:var(--ink-soft); white-space:nowrap; }
.wm-sg-row.wm-sg-all{ background:var(--sun-soft); }
.wm-sg-empty{ padding:12px; font-size:13px; color:var(--ink-soft); }
.wm-layout{ display:grid; grid-template-columns:minmax(0,1fr); gap:14px; align-items:start; }
.wm-layout.has-side{ grid-template-columns:minmax(0,1fr) 330px; }
.wm-main{ min-width:0; }

.wm-open{ flex:none; padding:8px 12px 8px 6px; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer; border:0; background:transparent; color:var(--ink-soft); }
.wm-open:hover{ color:var(--sun-ink); }
.wm-hidden-tag{ display:inline-block; margin-right:6px; padding:1px 7px; border-radius:999px; background:#5b4a3a; color:#fff; font-size:11px; font-weight:800; vertical-align:1px; }
.wm-unmatched{ margin-top:8px; font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
.worldmap-region-tab .wm-badge{
  display:inline-block; min-width:18px; margin-left:6px; padding:0 6px; border-radius:999px;

}
.worldmap-stage.has-hits .worldmap-mark:not(.search-hit){ opacity:.28; }
.worldmap-mark.search-hit{ z-index:40; filter:drop-shadow(0 0 6px rgba(226,64,95,.95)); }
.worldmap-mark.search-hit::after{
  content:''; position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px;

}

@keyframes wmHitPulse{ 0%{ transform:scale(.55); opacity:1; } 100%{ transform:scale(1.25); opacity:0; } }
.worldmap-hover .wh-hit{ margin:4px 0 2px; padding:4px 8px; border-radius:8px; background:#fdeaee; color:#b3203f; font-size:12px; font-weight:800; }

/* ---------- 길찾기 · 사냥터 추천 ---------- */
.rt-form{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:end; margin-bottom:6px; }
.hunt-form{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:6px; }

.rt-field input.wm-search-input{ width:100%; box-sizing:border-box; }

.rt-card{ margin-top:12px; padding:14px; background:#fff; border:1.5px solid var(--line); border-radius:14px; }

.rt-card-head .wm-clear-btn{ margin-left:auto; padding:7px 12px; }

.rt-step.warp .rt-no{ background:#8a63f2; color:#fff; }
.rt-hint{ margin:2px 4px 0; font-size:12px; font-weight:700; color:var(--ink-soft); line-height:1.5; }

.rt-sub{ margin-left:auto; text-align:right; font-size:12px; font-weight:700; color:var(--ink-soft); }
.rt-msg{ margin-top:14px; padding:16px; background:#fff; border:1.5px dashed var(--line); border-radius:14px; font-size:13.5px; color:var(--ink-soft); line-height:1.6; }
.hunt-summary{ margin:12px 0 4px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.hunt-summary .rt-card-title{ font-size:14.5px; }
.hunt-summary .wm-clear-btn{ margin-left:auto; padding:7px 12px; }
.hunt-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px; margin-top:10px; }
.hunt-card{ display:block; padding:13px 14px; background:#fff; border:1.5px solid var(--line); border-radius:14px; cursor:pointer; transition:border-color .15s, transform .15s; }
.hunt-card:hover{ border-color:var(--wood-light); transform:translateY(-1px); }
.hunt-card-title{ font-size:15px; font-weight:900; }
.hunt-card-meta{ margin-top:3px; font-size:12px; font-weight:700; color:var(--ink-soft); }
.hunt-card-stat{ margin-top:8px; font-size:12.5px; font-weight:800; }
.hunt-card-stat .n{ color:var(--sun-ink); }
.hunt-chips{ margin-top:8px; display:flex; flex-wrap:wrap; gap:5px; }
.hunt-chip{ padding:3px 9px; border-radius:999px; background:var(--paper-soft); border:1.5px solid var(--line); font-size:12px; font-weight:800; }
.hunt-tag{ display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:800; margin-left:6px; vertical-align:1px; }
.hunt-tag.world{ background:#e6f3ea; color:#2f7a4b; }
.hunt-tag.hidden-map{ background:#5b4a3a; color:#fff; }
.hunt-sec-title{ margin:22px 0 4px; font-size:13px; font-weight:800; color:var(--ink-soft); }
.hunt-mons{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; margin-top:8px; }
.hunt-mon{ display:flex; align-items:center; gap:10px; padding:8px 10px; background:#fff; border:1.5px solid var(--line); border-radius:12px; cursor:pointer; }
.hunt-mon:hover{ border-color:var(--wood-light); background:var(--paper-soft); }
.hunt-mon img{ width:36px; height:36px; object-fit:contain; flex:none; }
.hunt-mon .nm{ font-size:13px; font-weight:800; }
.hunt-mon .sb{ font-size:11.5px; font-weight:700; color:var(--ink-soft); }
.hunt-mon.nohab{ border-style:dashed; }

.wm-panel-btn{
  margin-left:8px; padding:4px 10px; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer;
  border:1.5px solid var(--line); border-radius:999px; background:#fff; color:var(--ink-soft); vertical-align:1px;
}
.wm-panel-btn:hover{ color:#e2405f; border-color:#e2405f; }
.wm-panel-btn-lg{ margin-left:0; padding:9px 14px; font-size:13.5px; color:var(--ink); }
.wm-srcs{ margin-top:2px; font-size:11.5px; font-weight:700; color:var(--ink-soft); white-space:normal; line-height:1.4; }

.rt-who{ display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; background:#fdeaee; color:#b3203f; font-size:11.5px; font-weight:800; vertical-align:1px; }
.rt-places{ display:flex; flex-wrap:wrap; gap:6px; }
.rt-place{ padding:7px 12px; font-size:13px; font-weight:800; font-family:inherit; cursor:pointer; color:var(--ink); border:1.5px solid var(--line); border-radius:999px; background:var(--paper-soft); }

.wm-route-title{ font-size:13.5px; font-weight:900; margin-bottom:6px; }

.wm-quick-row{ margin-top:8px; display:flex; flex-wrap:wrap; gap:5px; }
.wm-quick{ padding:5px 10px; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer; border:1.5px solid var(--line); border-radius:999px; background:#fff; color:var(--ink); }
.wm-quick:hover{ border-color:#5b8def; color:#2a5fc4; }
.wm-route-line{ margin-top:9px; font-size:13px; font-weight:800; line-height:1.5; }
.wm-route-line .n{ color:#2a5fc4; }
.wm-route-steps{ margin-top:6px; display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
.wm-rs{ padding:3px 9px; border-radius:999px; background:#fff; border:1.5px solid var(--line); font-size:12px; font-weight:800; }
.wm-rs.warp{ background:#efe9ff; border-color:#cfc0fb; }
.wm-rs.taxi{ background:#e6efff; border-color:#b7cdf5; }
.wm-rs.last{ background:#fdeaee; border-color:#f3b8c4; color:#b3203f; }
.wm-rs-arrow{ font-size:11px; color:var(--ink-soft); }
.wm-route-actions{ margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.wm-route-taxi{ margin-top:6px; font-size:12px; font-weight:700; color:var(--ink-soft); }
.wm-rt{ flex:none; margin:4px 0 4px 4px; padding:4px 8px; font-size:11.5px; font-weight:800; font-family:inherit; cursor:pointer; border:1.5px solid #cfe2f7; border-radius:999px; background:#f4f9ff; color:#2a5fc4; }
.wm-rt:hover{ background:#e6efff; }
.wm-row.hidden-map .wm-rt{ margin-right:6px; }
.wm-row .wm-rt:first-of-type{ margin-left:auto; }

.rt-tools{ margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.rt-town{ flex:1 1 150px; min-width:0; padding:7px 10px; font-size:12.5px; font-weight:800; font-family:inherit; border:1.5px solid var(--line); border-radius:999px; background:#fff; color:var(--ink); }

.myloc-now{ margin-top:6px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }

.lp{ margin-top:8px; padding:9px 10px; background:#fff; border:1.5px solid var(--line); border-radius:12px; }
.lp-row{ display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-bottom:8px; }
.lp-row:last-child{ margin-bottom:0; }
.lp-lbl{ flex:0 0 100%; font-size:11.5px; font-weight:800; color:var(--ink-soft); }
.lp-chip{ padding:5px 10px; font-size:12.5px; font-weight:800; font-family:inherit; cursor:pointer; color:var(--ink); border:1.5px solid var(--line); border-radius:999px; background:var(--paper-soft); word-break:keep-all; }
.lp-chip:hover{ border-color:#5b8def; background:#fff; }
.lp-chip.town{ background:#fff8e6; }
.lp-chip.on{ background:var(--sun); border-color:var(--sun); }
.lp-chip.in{ border-color:var(--sun); box-shadow:inset 0 0 0 1px var(--sun); }

.lp-maps-title{ width:100%; font-size:11.5px; font-weight:800; color:var(--ink-soft); }
.lp-chip.map{ font-size:12px; padding:4px 9px; }

</style>

<div class="wrap">

<script src="data-index.js"></script>
<script>
(function(){
  'use strict';
  document.getElementById('yy').textContent = new Date().getFullYear();

  var QUESTS = window.QUESTS || [];
  var QUEST_DETAILS = window.QUEST_DETAILS || {};
  var NPCS = window.NPCS || [];
  var MAPS = window.MAPS || [];
  var ITEMS = window.ITEMS || [];
  var MONSTERS = window.MONSTERS || [];

  var DONE_KEY = 'lonaworld.doneQuests';
  var RECENT_KEY = 'lonaworld.recentViews';
  var FAV_KEY = 'lonaworld.favorites';

  // ---- EXP 테이블 (레벨업 필요 경험치) ----
  var EXP_TABLE = {1:15,2:34,3:57,4:92,5:135,6:372,7:560,8:840,9:1242,10:1716,11:2360,12:3216,13:4200,14:5460,15:7050,16:8840,17:11040,18:13716,19:16680,20:20216,21:24402,22:28980,23:34320,24:40512,25:47216,26:54900,27:63666,28:73080,29:83720,30:95700,31:108480,32:122760,33:138666,34:155540,35:174216,36:194832,37:216600,38:240500,39:266682,40:294216,41:324240,42:356916,43:391160,44:428280,45:468450,46:510420,47:555680,48:604416,49:655200,50:709716,60:1209994,70:2062925,80:3517093,90:5996316,100:10223168,120:29715818,140:86375389,160:251068606,180:729784819,200:2121276324};
  function nearestExpBucket(lv){
    lv = Number(lv)||1;
    if (EXP_TABLE[lv]) return EXP_TABLE[lv];
    var best = null, bestKey = -1;
    for (var k in EXP_TABLE){ var kk = Number(k); if (kk<=lv && kk>bestKey){ bestKey=kk; best=EXP_TABLE[k]; } }
    return best || EXP_TABLE[100];
  }
  function questExp(q){
    var t = 0;
    (q.rewards||[]).forEach(function(r){ if (typeof r.exp === 'number') t += r.exp; });
    return t;
  }
  function expRatio(q, bucket){
    if (!bucket) return 0;
    return Math.round((questExp(q)/bucket)*1000)/10;
  }

  // ---- 타입 → 색상/아이콘 ----
  var ICONS = {
    talk:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    hunt:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 21l6-6M14 4l6 6-9 9-6-6 9-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    collect:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 8h16l-1.2 11.2A2 2 0 0 1 16.8 21H7.2a2 2 0 0 1-2-1.8L4 8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="2"/></svg>',
    deliver:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 7l9 6 9-6M4 6h16v12H4V6Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    use:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 3h6M10 3v5l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    move:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 2v6M12 22v-6M4.9 4.9l4.2 4.2M14.9 14.9l4.2 4.2M2 12h6M16 12h6M4.9 19.1l4.2-4.2M14.9 9.1l4.2-4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    investigate:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4.5-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    etc:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };
  var TYPE_MAP = {
    '대화':{cls:'t-talk', icon:'talk'},
    '몬스터 사냥':{cls:'t-hunt', icon:'hunt'},
    '아이템 수집':{cls:'t-collect', icon:'collect'},
    '아이템 전달':{cls:'t-deliver', icon:'deliver'},
    '아이템 사용':{cls:'t-use', icon:'use'},
    '이동':{cls:'t-move', icon:'move'},
    '조사':{cls:'t-investigate', icon:'investigate'},
    '퀘스트 완료':{cls:'t-etc', icon:'etc'}
  };
  function primaryType(typeStr){
    var first = String(typeStr||'').split(/[,·]/)[0].trim();
    return first || '기타';
  }
  function allTypes(typeStr){
    return String(typeStr||'').split(/[,·]/).map(function(s){ return s.trim(); }).filter(Boolean);
  }
  function typeInfo(typeStr){
    var p = primaryType(typeStr);
    return TYPE_MAP[p] || {cls:'t-etc', icon:'etc'};
  }
  function typeInfoFor(t){
    return TYPE_MAP[t] || {cls:'t-etc', icon:'etc'};
  }

  function safeImg(src, alt, cls){
    var d = 'https://placehold.co/120x120/FFF9F0/9A8574?text=%20';
    return '<img src="'+(src||d)+'" alt="'+(alt||'')+'" class="'+(cls||'thumb')+'" onerror="this.onerror=null;this.src=\''+d+'\';">';
  }

  function itemTooltipHtml(it){
    var rows = [];
    if (it.reqLevel!=null) rows.push(['REQ LEV', it.reqLevel]);
    if (it.reqStr) rows.push(['REQ STR', it.reqStr]);
    if (it.reqDex) rows.push(['REQ DEX', it.reqDex]);
    if (it.reqInt) rows.push(['REQ INT', it.reqInt]);
    if (it.reqLuk) rows.push(['REQ LUK', it.reqLuk]);
    if (it.pdd) rows.push(['물리방어력', '+'+it.pdd]);
    if (it.mdd) rows.push(['마법방어력', '+'+it.mdd]);
    if (it.attack) rows.push(['공격력', '+'+it.attack]);
    if (it.matt) rows.push(['마력', '+'+it.matt]);
    if (it.acc) rows.push(['명중률', '+'+it.acc]);
    if (it.eva) rows.push(['회피율', '+'+it.eva]);
    if (it.str) rows.push(['STR', '+'+it.str]);
    if (it.dex) rows.push(['DEX', '+'+it.dex]);
    if (it.int) rows.push(['INT', '+'+it.int]);
    if (it.luk) rows.push(['LUK', '+'+it.luk]);
    if (it.hp) rows.push(['HP', '+'+it.hp]);
    if (it.mp) rows.push(['MP', '+'+it.mp]);
    if (it.speed) rows.push(['공격속도', it.speed]);
    if (it.moveSpeed) rows.push(['이동속도', '+'+it.moveSpeed]);
    if (it.jump) rows.push(['점프력', '+'+it.jump]);
    if (it.buyPrice!=null) rows.push(['구매가', it.buyPrice.toLocaleString()+' 메소']);
    if (it.sellPrice!=null) rows.push(['판매가', it.sellPrice.toLocaleString()+' 메소']);

    var html = '<div class="item-tooltip">';
    html += '<div class="item-tooltip-head">'+safeImg(it.img, it.name, 'item-tooltip-icon')+'<div class="name">'+it.name+'</div></div>';
    if (rows.length){
      html += '<div class="item-tooltip-body">' + rows.map(function(r){
        return '<div class="item-tooltip-row">'+r[0]+' <b>'+r[1]+'</b></div>';
      }).join('') + '</div>';
    }
    if (it.desc){
      html += '<div class="item-tooltip-desc">' + it.desc.split('\n')[0] + '</div>';
    }
    html += '</div>';
    return html;
  }

  function itemChipHtml(it, label){
    if (!it) return '';
    var html = '<a class="item-chip" href="item-detail.html?id='+it.id+'">';
    html += safeImg(it.img, it.name, 'icon');
    html += '<div class="txt">' + (label ? '<div class="lbl">'+label+'</div>' : '') + '<div class="val">'+it.name+'</div></div>';
    html += itemTooltipHtml(it);
    html += '</a>';
    return html;
  }

  function craftPlainChip(name, label){
    return '<div class="item-chip" style="cursor:default;">'+safeImg(null, name, 'icon')+'<div class="txt">'+(label?'<div class="lbl">'+label+'</div>':'')+'<div class="val">'+name+'</div></div></div>';
  }
  function craftEntryHtml(c){
    var resultItem = c.itemId ? ITEMS.find(function(i){ return String(i.id)===String(c.itemId); }) : null;
    var head = resultItem ? itemChipHtml(resultItem, null) : craftPlainChip(c.name, null);
    var matsHtml = (c.materials||[]).map(function(mt){
      var mi = mt.itemId ? ITEMS.find(function(i){ return String(i.id)===String(mt.itemId); }) : null;
      return mi ? itemChipHtml(mi, mt.qty+'개') : craftPlainChip(mt.name, mt.qty+'개');
    }).join('');
    if (c.altMaterials && c.altMaterials.length){
      matsHtml += '<span class="craft-or">또는</span>' + c.altMaterials.map(function(mt){
        var mi = mt.itemId ? ITEMS.find(function(i){ return String(i.id)===String(mt.itemId); }) : null;
        return mi ? itemChipHtml(mi, mt.qty+'개') : craftPlainChip(mt.name, mt.qty+'개');
      }).join('');
    }
    var badgeTxt = (c.price!=null) ? c.price.toLocaleString()+'메소' : (c.yield!=null ? c.yield.toLocaleString()+'개 제작' : '');
    return '<details class="craft-card">'+
      '<summary class="craft-card-head">'+head+(badgeTxt?'<span class="craft-price">'+badgeTxt+'</span>':'')+'</summary>'+
      '<div class="craft-mats item-chip-list">'+matsHtml+'</div>'+
      (c.note?'<div class="craft-note">'+c.note+'</div>':'')+
    '</details>';
  }

  function itemBoxHtml(it, label){
    if (!it) return '';
    var html = '<a class="ibox item-hover-box" href="item-detail.html?id='+it.id+'">';
    html += safeImg(it.img, it.name, 'thumb');
    html += '<div>' + (label ? '<div class="lbl">'+label+'</div>' : '') + '<div class="val">'+it.name+'</div></div>';
    html += itemTooltipHtml(it);
    html += '</a>';
    return html;
  }

  function itemTileHtml(it, label){
    if (!it) return '';
    var html = '<a class="item-tile" href="item-detail.html?id='+it.id+'">';
    html += safeImg(it.img, it.name, 'thumb');
    html += '<div class="val">'+it.name+'</div>';
    if (label) html += '<div class="lbl">'+label+'</div>';
    html += itemTooltipHtml(it);
    html += '</a>';
    return html;
  }
  function fmt(n){ return Number(n||0).toLocaleString(); }
  // 검색어와 대상 문자열의 띄어쓰기를 무시하고 비교하기 위한 정규화
  function normQ(s){ return String(s||'').toLowerCase().replace(/\s+/g,''); }

  // ---- 완료 체크 (localStorage) ----
  // doneMap[id] = { reward: "받은 보상 이름" | null }
  function loadDone(){ try { return JSON.parse(localStorage.getItem(DONE_KEY)||'{}'); } catch(e){ return {}; } }
  function saveDone(map){ try { localStorage.setItem(DONE_KEY, JSON.stringify(map)); } catch(e){} }
  var doneMap = loadDone();

  // ---- 즐겨찾기 (localStorage, 전체 타입 통합) ----
  // favMap["type:id"] = true
  function loadFav(){ try { return JSON.parse(localStorage.getItem(FAV_KEY)||'{}'); } catch(e){ return {}; } }
  function saveFav(map){ try { localStorage.setItem(FAV_KEY, JSON.stringify(map)); } catch(e){} }
  var favMap = loadFav();
  function favKeyOf(type, id){ return type+':'+id; }
  function isFav(type, id){ return !!favMap[favKeyOf(type, id)]; }
  function toggleFav(type, id){
    var k = favKeyOf(type, id);
    if (favMap[k]) delete favMap[k]; else favMap[k] = true;
    saveFav(favMap);
    var cntEl = document.getElementById('cnt-favorites');
    if (cntEl) cntEl.textContent = Object.keys(favMap).length;
  }
  function favStarBtn(type, id){
    return '<button class="fav-star" data-type="'+type+'" data-id="'+id+'" aria-label="즐겨찾기" title="즐겨찾기">'+(isFav(type,id)?'★':'☆')+'</button>';
  }
  function favStarInline(type, id){
    return ' <button class="fav-star-inline" data-type="'+type+'" data-id="'+id+'" aria-label="즐겨찾기" title="즐겨찾기">'+(isFav(type,id)?'★':'☆')+'</button>';
  }

  // ---- 최근 본 항목 (localStorage) ----
  function loadRecent(){ try { return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]'); } catch(e){ return []; } }
  function saveRecent(list){ try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch(e){} }
  var recentList = loadRecent();
  var TYPE_LABEL = { quest:'📜', monster:'🐾', item:'🎒', npc:'💬', map:'🗺️' };
  function recordOf(type, id){
    if (type === 'quest') return questById(id);
    if (type === 'monster') return MONSTERS.find(function(m){ return String(m.id)===String(id); });
    if (type === 'item') return ITEMS.find(function(i){ return String(i.id)===String(id); });
    if (type === 'npc') return NPCS.find(function(n){ return String(n.id)===String(id); });
    if (type === 'map') return MAPS.find(function(m){ return String(m.code)===String(id); });
    return null;
  }
  function recordRecentView(type, id){
    var rec = recordOf(type, id);
    if (!rec) return;
    var name = rec.title || rec.name;

  // ---- 지역 매칭 (NPC의 위치 코드로 맵의 지역을 찾음) ----
  function regionOfPlaceCode(code){
    var m = MAPS.find(function(mm){ return String(mm.code)===String(code); });
    if (!m) return null;
    // 맵의 region이 마을명(헤네시스, 노틸러스 등)이어도 필터에서는 소속 월드로 취급
    return (mapWorldOfRegion && mapWorldOfRegion[m.region]) || m.region;
  }
  // NPC·맵·몬스터 필터에는 마을명이 아닌 최상위 지역만 표시
  var TOP_REGIONS = ['메이플 아일랜드', '빅토리아 아일랜드', '엘나스 산맥', '아쿠아로드'];

  function regionsOfRecord(record){
    var found = {};
    placesOf(record).forEach(function(place){

      if (region) found[region] = 1;
    });
    return Object.keys(found);
  }

  function npcTypeOf(n){
    var s = (n.role || '') + ' ' + (n.category === '상점' ? '' : (n.category || '')) + ' ' + (n.name || '');
    if (s.indexOf('택시') > -1) return '택시';
    if (s.indexOf('전직') > -1) return '전직관';
    if (s.indexOf('펫먹이') > -1 || s.indexOf('펫 먹이') > -1) return '펫먹이상인';
    if (s.indexOf('창고') > -1) return '창고지기';
    if (s.indexOf('제작') > -1) return '제작자';
    if (s.indexOf('주문서') > -1) return '주문서상인';
    if (s.indexOf('방어구') > -1) return '방어구상인';
    if (s.indexOf('무기') > -1) return '무기상인';
    if (s.indexOf('잡화') > -1) return '잡화상인';
    return null;

  function npcRelatedCount(npc){
    var n = 0;
    QUESTS.forEach(function(q){
      var d = QUEST_DETAILS[String(q.id)];
      if (!d) return;
      var isStart = d.start && d.start.npc && String(d.start.npc.id)===String(npc.id);
      var isFinish = d.finish && d.finish.npc && String(d.finish.npc.id)===String(npc.id);
      if (isStart || isFinish) n++;
    });
    return n;
  }
  var NPCS_PER_PAGE = 48;
  var npcsPage = 1;
  function renderNPCs(){ npcsPage = 1; doRenderNPCs(); }
  function doRenderNPCs(){
    if (!NPCS.length){
      sections.npc.innerHTML = '<div class="empty"><div class="big font-display">NPC 도감은 아직 준비 중이에요</div><div>퀘스트를 주는 NPC 정보를 모으는 중이에요.</div></div>';
      document.getElementById('npcsPager').innerHTML = '';
      document.getElementById('npcsPagerTop').innerHTML = '';
      return;
    }
    var q = npcSearchInput.value.trim();
    var qn = normQ(q);
    var region = npcRegionSelect.value;
    var role = npcRoleSelect.value;
    var filtered = NPCS.filter(function(n){
      var hit = !q || normQ(n.name).indexOf(qn)>-1;
      var inRegion = region==='all' || regionsOfRecord(n).indexOf(region)>-1;
      var inRole = role==='all' || npcTypeOf(n)===role;
      return hit && inRegion && inRole;
    });
    if (!filtered.length){
      sections.npc.innerHTML = '<div class="empty"><div class="big font-display">조건에 맞는 NPC가 없어요</div><div>검색어나 지역을 조금 넓혀보세요.</div></div>';
      document.getElementById('npcsPager').innerHTML = '';
      document.getElementById('npcsPagerTop').innerHTML = '';
      return;
    }
    var totalPages = Math.max(1, Math.ceil(filtered.length / NPCS_PER_PAGE));
    if (npcsPage > totalPages) npcsPage = totalPages;
    if (npcsPage < 1) npcsPage = 1;
    var start = (npcsPage-1) * NPCS_PER_PAGE;
    var pageNpcs = filtered.slice(start, start + NPCS_PER_PAGE);
    sections.npc.innerHTML = pageNpcs.map(function(n){
      var cnt = npcRelatedCount(n);
      var npcTitle = n.name + (n.role ? ' · '+n.role : '');
      return (
        '<a class="qcard'+(isFav('npc',n.id)?' owned':'')+'" href="npc-detail.html?id='+n.id+'" title="'+esc(npcTitle)+'">'+
          favStarBtn('npc', n.id)+
          '<div class="top">'+
            safeImg(n.img, n.name, 'thumb')+
            '<div class="meta-title">'+
              '<div class="title">'+n.name+'</div>'+
              (n.role?'<div class="fame-chip" style="margin-top:2px;display:inline-block;">'+n.role+'</div>':'')+
              (cnt ? '<div class="job-row">관련 퀘스트 '+cnt+'개</div>' : '')+
            '</div>'+
          '</div>'+
        '</a>'
      );
    }).join('');
    var npcsPagerEl = document.getElementById('npcsPager');
    var npcsPagerTopEl = document.getElementById('npcsPagerTop');
    if (totalPages <= 1){
      npcsPagerEl.innerHTML = '';
      npcsPagerTopEl.innerHTML = '';
    } else {
      var npcsPagerHtml = '<button class="page-btn" data-page="prev"'+(npcsPage<=1?' disabled':'')+'>← 이전</button>';
      npcsPagerHtml += '<span class="page-info">'+npcsPage+' / '+totalPages+' 페이지 · 총 '+filtered.length+'개</span>';
      npcsPagerHtml += '<button class="page-btn" data-page="next"'+(npcsPage>=totalPages?' disabled':'')+'>다음 →</button>';
      npcsPagerEl.innerHTML = npcsPagerHtml;

      : '<div class="combo-empty">일치하는 몬스터가 없어요</div>';
    mapMonsterSuggest.classList.remove('hidden');
  }

  mapMonsterInput.addEventListener('input', function(){
    if (!mapMonsterInput.value.trim() && selectedMonster !== 'all'){
      selectedMonster = 'all';
      renderMaps();
    }
    renderMonsterSuggest(mapMonsterInput.value);
  });
  mapMonsterInput.addEventListener('focus', function(){
    if (mapMonsterInput.value.trim()) renderMonsterSuggest(mapMonsterInput.value);
  });
  mapMonsterSuggest.addEventListener('click', function(e){
    var item = e.target.closest('.combo-item');
    if (!item || !item.dataset.name) return;
    selectedMonster = item.dataset.name;
    mapMonsterInput.value = selectedMonster;
    mapMonsterSuggest.classList.add('hidden');
    renderMaps();
  });
  mapMonsterInput.addEventListener('keydown', function(e){
    var items = Array.prototype.slice.call(mapMonsterSuggest.querySelectorAll('.combo-item'));
    if (!items.length || mapMonsterSuggest.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown'){ e.preventDefault(); mmSelectedIdx = Math.min(mmSelectedIdx+1, items.length-1); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); mmSelectedIdx = Math.max(mmSelectedIdx-1, 0); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (items[mmSelectedIdx]) items[mmSelectedIdx].click(); return; }
    else if (e.key === 'Escape'){ mapMonsterSuggest.classList.add('hidden'); return; }
    else return;
    items.forEach(function(it,i){ it.classList.toggle('sel', i===mmSelectedIdx); });
    items[mmSelectedIdx].scrollIntoView({block:'nearest'});

      mapMonsterSuggest.classList.add('hidden');

  function monsterPlaceAt(mo, mapCode){
    if (mo.place && String(mo.place.code)===String(mapCode)) return mo.place;
    if (Array.isArray(mo.places)){
      var found = mo.places.find(function(pl){ return String(pl.code)===String(mapCode); });
      if (found) return found;
    }
    return null;
  }
  var MAPS_PER_PAGE = 48;
  var mapsPage = 1;
  function renderMaps(){ mapsPage = 1; doRenderMaps(); }
  function doRenderMaps(){
    if (!MAPS.length){
      sections.maps.innerHTML = '<div class="empty"><div class="big font-display">맵 정보는 아직 준비 중이에요</div><div>지역별 맵과 몬스터 서식지를 정리할 예정이에요.</div></div>';
      document.getElementById('mapsPager').innerHTML = '';
      document.getElementById('mapsPagerTop').innerHTML = '';
      return;
    }
    var q = mapSearchInput.value.trim();
    var qn = normQ(q);
    var world = mapWorldSelect.value;
    var town = mapTownSelect.value;
    var monsterName = selectedMonster;
    var filtered = MAPS.filter(function(m){
      var hit = !q || normQ(m.name).indexOf(qn)>-1;
      var inWorld = world==='all' || mapWorldOf(m)===world;
      var inTown = town==='all' || mapTownOf(m)===town;
      var inMonster = monsterName==='all' || MONSTERS.some(function(mo){ return mo.name===monsterName && monsterPlaceAt(mo, m.code); });
      return hit && inWorld && inTown && inMonster;
    });
    // 맵 목록은 ID(코드) 순으로 정렬. 몬스터로 찾을 때만 많이 나오는 순(같으면 ID 순)
    filtered.sort(function(a,b){ return Number(a.code) - Number(b.code); });
    if (monsterName !== 'all'){
      filtered.sort(function(a,b){
        function countOf(map){
          var mo = MONSTERS.find(function(x){ return x.name===monsterName && monsterPlaceAt(x, map.code); });
          var pl = mo && monsterPlaceAt(mo, map.code);
          return (pl && pl.count) || 0;
        }
        return (countOf(b) - countOf(a)) || (Number(a.code) - Number(b.code));
      });
    }
    if (!filtered.length){
      var townHasNone = town !== 'all' && !q && monsterName === 'all';
      sections.maps.innerHTML = townHasNone
        ? '<div class="empty"><div class="big font-display">'+esc(town)+'의 맵은 아직 준비 중이에요</div><div>다른 마을을 선택하거나 전체 마을로 바꿔보세요.</div></div>'
        : '<div class="empty"><div class="big font-display">조건에 맞는 맵이 없어요</div><div>검색어나 월드·마을을 조금 넓혀보세요.</div></div>';
      document.getElementById('mapsPager').innerHTML = '';
      document.getElementById('mapsPagerTop').innerHTML = '';
      return;
    }
    var totalPages = Math.max(1, Math.ceil(filtered.length / MAPS_PER_PAGE));
    if (mapsPage > totalPages) mapsPage = totalPages;
    if (mapsPage < 1) mapsPage = 1;
    var start = (mapsPage-1) * MAPS_PER_PAGE;
    var pageMaps = filtered.slice(start, start + MAPS_PER_PAGE);
    sections.maps.innerHTML = pageMaps.map(function(m){
      var monBadge = '';
      if (monsterName !== 'all'){
        var mo = MONSTERS.find(function(x){ return x.name===monsterName && monsterPlaceAt(x, m.code); });
        var pl = mo && monsterPlaceAt(mo, m.code);
        if (pl && pl.count) monBadge = ' <span class="count-badge">'+pl.count+'마리</span>';
      }
      return (
        '<a class="qcard'+(isFav('map',m.code)?' owned':'')+'" href="map-detail.html?code='+m.code+'" title="'+esc(m.name+(m.region?' · '+m.region:'')+' · 코드 '+m.code)+'">'+
          favStarBtn('map', m.code)+
          (m.img ? '<img src="'+m.img+'" alt="'+m.name+'" style="width:100%;height:100px;object-fit:contain;background:#fff;border-radius:10px;border:2px solid var(--wood-dark);margin-bottom:10px;" onerror="this.style.display=\'none\';">' : '')+
          '<div class="meta-title">'+
            '<div class="title">'+m.name+monBadge+'</div>'+
            '<div class="meta">'+(m.region||'-')+'</div>'+
          '</div>'+
        '</a>'
      );
    }).join('');
    var mapsPagerEl = document.getElementById('mapsPager');
    var mapsPagerTopEl = document.getElementById('mapsPagerTop');
    if (totalPages <= 1){
      mapsPagerEl.innerHTML = '';
      mapsPagerTopEl.innerHTML = '';
    } else {
      var mapsPagerHtml = '<button class="page-btn" data-page="prev"'+(mapsPage<=1?' disabled':'')+'>← 이전</button>';
      mapsPagerHtml += '<span class="page-info">'+mapsPage+' / '+totalPages+' 페이지 · 총 '+filtered.length+'개</span>';
      mapsPagerHtml += '<button class="page-btn" data-page="next"'+(mapsPage>=totalPages?' disabled':'')+'>다음 →</button>';
      mapsPagerEl.innerHTML = mapsPagerHtml;
      mapsPagerTopEl.innerHTML = mapsPagerHtml;
    }
  }
  function onMapsPagerClick(e){
    var btn = e.target.closest('.page-btn');
    if (!btn || btn.disabled) return;
    if (btn.getAttribute('data-page')==='prev') mapsPage--;
    else mapsPage++;
    doRenderMaps();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  document.getElementById('mapsPager').addEventListener('click', onMapsPagerClick);
  document.getElementById('mapsPagerTop').addEventListener('click', onMapsPagerClick);
  renderMaps();

  // ---- 월드맵 ----
  var mapViewNormalBtn = document.getElementById('mapViewNormalBtn');
  var mapViewWorldBtn = document.getElementById('mapViewWorldBtn');
  var mapNormalFields = document.getElementById('mapNormalFields');
  var worldMapView = document.getElementById('worldMapView');
  var worldMapRegionTabs = document.getElementById('worldMapRegionTabs');
  var worldMapStageWrap = document.getElementById('worldMapStageWrap');
  var worldMapRegion = (function(){
    var keys = Object.keys(window.WORLD_MAPS || {});
    for (var i=0;i<keys.length;i++){ if (window.WORLD_MAPS[keys[i]].topLevel) return keys[i]; }

  var worldMapSub = null; // 선택된 하위 지역(예: 노틸러스) 키. null이면 상위 지역 전체 지도.

  // 지도 탭 안의 보기(일반맵 · 월드맵 · 길찾기 · 사냥터 추천) 표시 상태를 한 곳에서 맞춰요.
  function syncMapViews(){

    [['normal', mapViewNormalBtn], ['world', mapViewWorldBtn], ['route', mapViewRouteBtn], ['hunt', mapViewHuntBtn]].forEach(function(p){
      p[1].classList.toggle('on', p[0] === mapViewMode);
    });
    mapNormalFields.style.display = normal ? 'contents' : 'none';
    sections.maps.classList.toggle('hidden', !(onMaps && normal));
    worldMapView.classList.toggle('hidden', !(onMaps && mapViewMode === 'world'));
    routeView.classList.toggle('hidden', !(onMaps && mapViewMode === 'route'));
    huntView.classList.toggle('hidden', !(onMaps && mapViewMode === 'hunt'));
    document.getElementById('mapsPager').classList.toggle('hidden', !(onMaps && normal));
    document.getElementById('mapsPagerTop').classList.toggle('hidden', !(onMaps && normal));

  function setMapView(mode){
    mapViewMode = mode;
    syncMapViews();

  mapViewNormalBtn.addEventListener('click', function(){ setMapView('normal'); });
  mapViewWorldBtn.addEventListener('click', function(){ setMapView('world'); });
  mapViewRouteBtn.addEventListener('click', function(){ setMapView('route'); });
  mapViewHuntBtn.addEventListener('click', function(){ setMapView('hunt'); });

  function renderWorldMapRegionTabs(){
    var regions = Object.keys(window.WORLD_MAPS || {}).filter(function(r){
      return window.WORLD_MAPS[r].topLevel;
    });
    worldMapRegionTabs.innerHTML = regions.map(function(r){
      var hitN = wmHitCountOf(r);
      return '<div class="worldmap-region-tab'+(r===worldMapRegion?' on':'')+'" data-region="'+esc(r)+'">'+esc(r)+(hitN?'<span class="wm-badge">'+hitN+'</span>':'')+'</div>';
    }).join('');
    Array.prototype.forEach.call(worldMapRegionTabs.querySelectorAll('.worldmap-region-tab'), function(el){
      el.addEventListener('click', function(){
        worldMapRegion = el.getAttribute('data-region');
        worldMapSub = null;
        renderWorldMapRegionTabs();
      });
    });
    renderWorldMapSubTabs();

  function renderWorldMapSubTabs(){
    var existing = document.getElementById('worldMapSubTabs');
    if (existing) existing.remove();
    var region = window.WORLD_MAPS[worldMapRegion];
    var children = (region && region.children) || [];
    if (children.length){
      var wrap = document.createElement('div');
      wrap.id = 'worldMapSubTabs';
      wrap.className = 'worldmap-region-tabs';
      wrap.style.marginTop = '-6px';
      var items = [{ key:null, label:'전체' }].concat(children.map(function(c){ return { key:c, label:c }; }));
      wrap.innerHTML = items.map(function(it){
        return '<div class="worldmap-region-tab sub'+(worldMapSub===it.key?' on':'')+'" data-sub="'+esc(it.key||'')+'">'+esc(it.label)+'</div>';
      }).join('');
      worldMapRegionTabs.insertAdjacentElement('afterend', wrap);
      Array.prototype.forEach.call(wrap.querySelectorAll('.worldmap-region-tab'), function(el){
        el.addEventListener('click', function(){
          worldMapSub = el.getAttribute('data-sub') || null;
          renderWorldMapSubTabs();
          renderWorldMap();
        });
      });
    }
    renderWorldMap();
  }

  function findWorldMapLocation(code){
    var regions = window.WORLD_MAPS || {};
    for (var rname in regions){
      var pts = regions[rname].points || [];
      for (var i=0;i<pts.length;i++){
        if (pts[i].code && String(pts[i].code)===String(code)) return { region: rname, point: pts[i] };
      }
    }
    return null;
  }
  function worldMapMonstersOf(code){
    if (!code) return [];
    return MONSTERS.filter(function(mo){
      if (mo.place && String(mo.place.code)===String(code)) return true;
      if (Array.isArray(mo.places) && mo.places.some(function(pl){ return String(pl.code)===String(code); })) return true;
      return false;
    });
  }

  // 같은 group 값을 가진 포인트들(예: 에오스탑 입구·층)을 눌렀을 때 고르는 선택창
  function wmGroupClose(){
    var old = document.querySelector('.wm-group-pop');
    if (old) old.remove();
    Array.prototype.forEach.call(document.querySelectorAll('.worldmap-mark.wm-pick'), function(b){ b.classList.remove('wm-pick'); });
  }
  function wmGroupChoose(stage, data, p, btn){
    var had = document.querySelector('.wm-group-pop');
    wmGroupClose();
    if (had && had.getAttribute('data-group') === p.group && had.getAttribute('data-from') === btn.getAttribute('data-idx')) return;
    var members = [];
    data.points.forEach(function(q, i){ if (q.group === p.group) members.push({ q:q, i:i }); });
    var pop = document.createElement('div');
    pop.className = 'wm-group-pop';
    pop.setAttribute('data-group', p.group);
    pop.setAttribute('data-from', btn.getAttribute('data-idx'));
    function rangeOf(q){
      var m = /(\d+)\s*층\s*~\s*(\d+)\s*층/.exec(q.name || '');
      return m ? { a:Number(m[1]), b:Number(m[2]) } : null;
    }
    function mapCodeByName(nm){
      var key = String(nm).replace(/\s/g, '');
      var hit = (window.MAPS || []).find(function(x){ return String(x.name || '').replace(/\s/g, '') === key; });
      return hit ? hit.code : null;
    }
    function showList(){
      pop.innerHTML = '<div class="wgp-title">'+esc(p.group)+' 선택</div>' + members.map(function(mm){
        var ready = !!mm.q.code, rg = rangeOf(mm.q);
        return '<button type="button" class="wgp-row'+((ready||rg)?'':' soon')+(mm.q===p?' on':'')+'" data-i="'+mm.i+'"><span>'+esc(mm.q.name)+'</span>'+(ready?'':(rg?'<span class="wgp-soon">›</span>':'<span class="wgp-soon">준비 중</span>'))+'</button>';
      }).join('');
    }
    function showFloors(mm){
      var rg = rangeOf(mm.q);
      var prefix = String(mm.q.name).replace(/\s*\d+\s*층\s*~\s*\d+\s*층.*/, '').trim() || p.group;
      var h = '<div class="wgp-title"><button type="button" class="wgp-back" data-back="1">‹</button> '+esc(mm.q.name)+'</div>';
      for (var f = rg.a; f <= rg.b; f++){
        var nm = prefix + ' ' + f + '층';
        var code = mapCodeByName(nm);
        h += '<button type="button" class="wgp-row'+(code?'':' soon')+'" data-floor="'+f+'" data-code="'+(code||'')+'"><span>'+f+'층</span>'+(code?'':'<span class="wgp-soon">준비 중</span>')+'</button>';
      }
      pop.innerHTML = h;
      pop.scrollTop = 0;
    }
    showList();
    var bw = data.baseWidth || 1280, bh = data.baseHeight || 940;
    var lx = p.x / bw * 100, ly = p.y / bh * 100;
    pop.style.left = (lx > 55 ? 'auto' : (lx + 2) + '%');
    if (lx > 55) pop.style.right = (100 - lx + 2) + '%';
    pop.style.top = Math.max(0, Math.min(ly - 2, 60)) + '%';
    pop.addEventListener('click', function(ev){
      ev.stopPropagation();
      if (ev.target.closest('[data-back]')){ showList(); return; }
      var row = ev.target.closest('.wgp-row');
      if (!row) return;
      if (row.hasAttribute('data-floor')){
        var c = row.getAttribute('data-code');
        if (c){ wmGroupClose(); openPanel('map', c); }
        return;
      }
      var mm = data.points[Number(row.getAttribute('data-i'))];
      if (mm.code){ wmGroupClose(); openPanel('map', mm.code); return; }
      if (rangeOf(mm)){ showFloors({ q:mm, i:Number(row.getAttribute('data-i')) }); return; }
      Array.prototype.forEach.call(pop.querySelectorAll('.wgp-row'), function(r){ r.classList.toggle('on', r === row); });
      Array.prototype.forEach.call(stage.querySelectorAll('.worldmap-mark.wm-pick'), function(b){ b.classList.remove('wm-pick'); });
      var mk = stage.querySelector('.worldmap-mark[data-idx="'+row.getAttribute('data-i')+'"]');
      if (mk) mk.classList.add('wm-pick');
    });
    stage.appendChild(pop);
  }
  document.addEventListener('click', function(ev){
    if (!ev.target.closest('.wm-group-pop')) wmGroupClose();
  });
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') wmGroupClose(); });

  function renderWorldMap(){
    var activeKey = worldMapSub || worldMapRegion;
    var data = (window.WORLD_MAPS || {})[activeKey];
    if (!data){
      worldMapStageWrap.innerHTML = '<div class="empty"><div class="big font-display">이 지역 월드맵은 아직 준비 중이에요</div></div>';
      return;
    }
    var icons = window.WORLD_MAP_MARKER_ICON || {};

    function pctY(p){ return (p.y / bh * 100); }
    var marksHtml = data.points.map(function(p, idx){

      return '<button type="button" class="worldmap-mark '+p.type+(nativeSpecial?' native-special':'')+'" data-idx="'+idx+'" style="left:'+pctX(p)+'%;top:'+pctY(p)+'%;'+anchorStyle+'" title="'+esc(p.name||'')+(p.code?'':' (준비 중)')+'" aria-label="'+esc(p.name||'')+'">'+

    worldMapStageWrap.innerHTML =

    var stage = worldMapStageWrap.querySelector('.worldmap-stage');
