          html += '<div class="wh-mons">'+mons.slice(0,5).map(function(mo){
            return '<div class="wh-mon-row">'+
              '<img src="'+(mo.img||'')+'" alt="'+esc(mo.name)+'" onerror="this.style.display=\'none\';">'+
              '<div><div class="wh-mon-name">'+esc(mo.name)+'</div>'+(mo.minLevel?'<div class="wh-mon-lv">Lv.'+mo.minLevel+'</div>':'')+'</div>'+
            '</div>';
          }).join('')+'</div>';
        } else {
          html += '<div class="wh-empty">'+(p.code ? '등록된 몬스터 정보가 아직 없어요' : '아직 준비 중인 맵이에요')+'</div>';
        }
        hover.innerHTML = html;
        var leftPct = pctX(p), topPct = pctY(p);
        var flipX = leftPct > 65;
        var flipY = topPct > 55;
        hover.style.left = (flipX ? (leftPct-2) : (leftPct+2)) + '%';
        hover.style.top = (flipY ? (topPct-2) : Math.max(0, topPct-2)) + '%';
        hover.style.transform = 'translate(' + (flipX ? '-100%' : '0') + ',' + (flipY ? '-100%' : '-10%') + ')';
        hover.classList.add('show');
      });
      btn.addEventListener('mouseleave', function(){ hover.classList.remove('show'); });
      btn.addEventListener('click', function(e){
        if (p.group){ e.stopPropagation(); wmGroupChoose(stage, data, p, btn); return; }
        if (!p.code) return;
        openPanel('map', p.code);
      });

    wmApplyMarkers(stage, data);

  // ---- 위치 고르기 (검색 없이 마을 → 맵을 눌러서 고르는 선택기) ----
  var lpOpen = { from:null, to:null, my:null, wm:null };     // 맵 목록을 펼쳐 둔 마을
  var lpShow = { from:true, to:false, wm:false };            // 선택기 표시 여부
  var RECENT_LOC_KEY = 'rona_recent_locs';
  var recentLocs = [];
  try { recentLocs = JSON.parse(localStorage.getItem(RECENT_LOC_KEY) || '[]'); } catch(e){ recentLocs = []; }
  function recentLocPush(pick){
    if (!pick || (pick.type !== 'map' && pick.type !== 'town' && pick.type !== 'npc' && pick.type !== 'monster')) return;
    var spec = pick.type + ':' + pick.id;
    recentLocs = recentLocs.filter(function(x){ return x !== spec; });
    recentLocs.unshift(spec);
    if (recentLocs.length > 8) recentLocs = recentLocs.slice(0, 8);
    try { localStorage.setItem(RECENT_LOC_KEY, JSON.stringify(recentLocs)); } catch(e){}
  }
  function lpCurrent(ctx){ return (ctx === 'from' || ctx === 'to') ? routePick[ctx] : myLoc; }
  function pickerHtml(ctx){
    var cur = lpCurrent(ctx), towns = townList();
    var curTown = null;
    if (cur){
      if (cur.type === 'town') curTown = cur.name;
      else if (cur.type === 'map'){ var cm = mapByCode(cur.id); curTown = cm ? mapTownOf(cm) : null; }
    }
    var open = lpOpen[ctx] || curTown;
    var html = '<div class="lp">';
    var rec = recentLocs.map(function(sp){ var i = sp.indexOf(':'); return routeMakePick(sp.slice(0, i), sp.slice(i+1)); }).filter(Boolean).slice(0, 6);
    if (rec.length){
      html += '<div class="lp-row"><span class="lp-lbl">⏱ 최근</span>'+rec.map(function(p){
        var on = cur && cur.type === p.type && String(cur.id) === String(p.id);
        return '<button type="button" class="lp-chip'+(on?' on':'')+'" data-lp-ctx="'+ctx+'" data-lp-spec="'+esc(p.type+':'+p.id)+'">'+esc(p.icon+' '+p.name)+'</button>';
      }).join('')+'</div>';

  function wmPlacesOf(rec){

  function wmLocsOfRecord(type, rec){
    if (type === 'map') return [{ code: rec.code, name: rec.name, src: '🗺️ '+rec.name }];
    var icon = type === 'monster' ? '🐾' : '💬';
    return wmPlacesOf(rec).map(function(pl){
      var name = pl.name || ((MAPS.find(function(m){ return String(m.code)===String(pl.code); })||{}).name) || String(pl.code);
      return { code: pl.code, name: name, count: pl.count, src: icon+' '+rec.name };
    });
  }
  function wmBuildSuggestions(q){
    var qn = normQ(q);
    if (!qn) return [];
    var hit = function(name){ return normQ(name).indexOf(qn) > -1; };
    var maps = MAPS.filter(function(m){ return hit(m.name); }).sort(function(a,b){ return Number(a.code)-Number(b.code); });
    var mons = MONSTERS.filter(function(m){ return hit(m.name); });
    var npcs = NPCS.filter(function(n){ return hit(n.name); });
    var items = [];
    var total = maps.length + mons.length + npcs.length;
    var LIM = 6;
    var allRecs = [];
    maps.forEach(function(m){ allRecs.push(['map', m]); });
    mons.forEach(function(m){ allRecs.push(['monster', m]); });
    npcs.forEach(function(n){ allRecs.push(['npc', n]); });
    if (total > 1){
      items.push({ kind:'all', ico:'🔎', name:"'"+q.trim()+"' 관련 전체 표시", sub: total+'건', recs: allRecs });
    }
    maps.slice(0, LIM).forEach(function(m){ items.push({ kind:'map', ico:'🗺️', name:m.name, sub:(m.region||''), recs:[['map', m]] }); });
    mons.slice(0, LIM).forEach(function(m){ var n = wmPlacesOf(m).length; items.push({ kind:'monster', ico:'🐾', name:m.name, sub:(m.minLevel?'Lv.'+m.minLevel+' · ':'')+n+'곳', recs:[['monster', m]] }); });
    npcs.slice(0, LIM).forEach(function(n){ var c = wmPlacesOf(n).length; items.push({ kind:'npc', ico:'💬', name:n.name, sub:(n.role?n.role+' · ':'')+c+'곳', recs:[['npc', n]] }); });

  function wmResolve(item){

    locs.forEach(function(l){
      var key = l.code+'|'+l.src;

      var r = wmPointForMap(l.code);
      if (r) entries.push({ code:l.code, name:l.name, count:l.count, src:l.src, region:r.region, point:r.point });

  function wmRenderInfo(){

    var h = worldMapHits, byRegion = {}, order = [];
    h.entries.forEach(function(e){ if (!byRegion[e.region]){ byRegion[e.region] = []; order.push(e.region); } byRegion[e.region].push(e); });
    function rowLabel(e){
      var label = h.single ? e.name : ((e.src === '🗺️ '+e.name) ? e.src : e.src+' · '+e.name);
      if (e.count) label += ' · '+e.count+'마리';

    var html = '<div class="wm-info-head">'+esc(h.label)+'</div>';
    function distinctMaps(list){ var seen = {}, n = 0; list.forEach(function(e){ var k = String(e.code); if (!seen[k]){ seen[k] = 1; n++; } }); return n; }
    var entryN = h.single ? h.entries.length : distinctMaps(h.entries);
    var hiddenN = h.single ? h.unmatched.length : distinctMaps(h.unmatched);
    html += '<div class="wm-info-sub">월드맵 <span class="wm-n">'+entryN+'곳</span>'+(hiddenN ? ' · 🔒 히든맵 <span class="wm-n">'+hiddenN+'곳</span>' : '')+'</div>';
    // 여러 대상(예: 아이템을 주는 몬스터·NPC 전체)을 한꺼번에 볼 때는 맵 하나에 한 줄로 묶어서 보여줘요.
    function aggregate(list){
      var map = {}, ord = [];
      list.forEach(function(e){

        if (!map[k]){ map[k] = { e:e, name:e.name, srcs:[] }; ord.push(k); }

      }).join('');
      html += '</div></div>';
    });
    if (h.unmatched.length){
      var ulist = h.single ? h.unmatched.map(function(u){ return { e:u, name:u.name, srcs:[] , single:true }; }) : (function(){
        var map = {}, ord = [];
        h.unmatched.forEach(function(u){
          var k = String(u.code);
          if (!map[k]){ map[k] = { e:u, name:u.name, srcs:[] }; ord.push(k); }
          if (!/^🗺️ /.test(u.src)) map[k].srcs.push(u.src + (u.count ? ' '+u.count+'마리' : ''));
        });

  var routePick = { from:null, to:null };     // { type:'map'|'npc'|'monster', id, name, icon, codes:[맵 코드...], counts:{코드:마릿수} }

  function mapByCode(code){ return MAPS.find(function(m){ return String(m.code)===String(code); }); }

  function startCodesOf(pick){ return (pick && pick.type === 'town' && pick.main) ? [pick.main] : (pick ? pick.codes : []); }
  // 마을 목록 (등록된 맵이 있는 마을만): [{ world, name, codes:[...] }]
  function townList(){
    var out = [];

      W.towns.forEach(function(T){

  function routeMakePick(kind, id){
    if (kind === 'town'){
      var t = townList().filter(function(x){ return x.name === id; })[0];
      if (!t) return null;
      // 마을이 출발지일 때는 그 마을의 대표 맵(마을과 이름이 같은 맵)에서 출발해요. 없으면 마을의 모든 맵 중 가장 가까운 곳.

  function routeSetPick(key, kind, id){

  function routeSuggestions(q){
    var qn = normQ(q);

    var rank = function(a, b){
      var ea = normQ(a.name) === qn ? 0 : 1, eb = normQ(b.name) === qn ? 0 : 1;
      return (ea - eb) || (Number(a.code||a.id) - Number(b.code||b.id));
    };
    var maps = MAPS.filter(function(m){ return hit(m.name); }).sort(rank);
    var npcs = NPCS.filter(function(n){ return hit(n.name); }).sort(rank);
    var mons = MONSTERS.filter(function(o){ return hit(o.name); }).sort(rank);
    var rows = [];
    townList().filter(function(t){ return hit(t.name); }).slice(0, 3).forEach(function(t){
      rows.push({ kind:'town', id:t.name, ico:'🏘️', name:t.name, sub:'마을 · 맵 '+t.codes.length+'곳', exact:false });

  }
  function routeRenderSuggest(key){

  function parseFare(str){ var m = String(str||'').replace(/,/g,'').match(/\d+/); return m ? Number(m[0]) : null; }
  // 로나월드의 무료 "맵 이동"으로 갈 수 있는 곳. 새 맵을 등록하면 이름이 같은 맵이 자동으로 포함돼요. (띄어쓰기 무시)
  var MAP_WARP_DESTS = ['자유시장입구','더 어려워진 인내의 숲','버섯동산','암허스트','사우스페리','헤네시스','엘리니아','페리온','커닝시티','커닝 스퀘어 로비','리스항구','노틸러스 선착장','슬리피우드','플로리나비치','에레브','시작의 숲 1','리엔','오르비스','행복한 마을','엘나스','루디브리엄','지구방위본부','아랫마을','아쿠아리움','리프레','무릉','백초마을','아리안트','마가티아','세 개의 문','파괴된 헤네시스','황혼의 페리온','무릉도장 입구','플로팅 마켓','상해와이탄','서문정','버섯신사'];
  var MAP_WARP_PICK = { '버섯동산': '10000' };   // 이름이 같은 맵이 여러 개일 때 어느 맵인지 지정
  function warpDestMaps(){
    var out = [];
    MAP_WARP_DESTS.forEach(function(name){
      var key = normQ(name), m = null;
      if (MAP_WARP_PICK[key]) m = mapByCode(MAP_WARP_PICK[key]);
      if (!m) m = MAPS.find(function(x){ return normQ(x.name) === key; });
      if (m && !out.some(function(o){ return String(o.code) === String(m.code); })) out.push(m);
    });
    return out;
  }
  function routeGraph(opts){
    opts = opts || {};
    var g = {};
    MAPS.forEach(function(m){ g[String(m.code)] = []; });
    MAPS.forEach(function(m){
      var from = String(m.code);
      (m.portals || []).forEach(function(p){
        if (!p.toCode) return;
        var to = String(p.toCode);
        if (to === from || !g[to]) return;
        if (g[from].some(function(e){ return e.to === to && e.kind === 'portal'; })) return;
        g[from].push({ to:to, kind:'portal', portal:p });
      });
    });
    if (opts.warp){
      var dests = warpDestMaps();
      MAPS.forEach(function(m){
        var from = String(m.code);
        dests.forEach(function(d){
          var to = String(d.code);
          if (to === from || g[from].some(function(e){ return e.to === to; })) return;
          g[from].push({ to:to, kind:'warp' });
        });
      });
    }
    if (opts.taxi){
      NPCS.forEach(function(n){
        if (!/모범택시/.test(n.name) || !n.fees || !n.fees.length) return;   // 택시는 모범택시만 포함
        wmPlacesOf(n).forEach(function(pl){
          var from = String(pl.code);
          if (!g[from]) return;
          n.fees.forEach(function(f){
            var dest = MAPS.find(function(m){ return normQ(m.name) === normQ(f.label); });
            if (!dest) return;
            var to = String(dest.code);
            if (to === from) return;
            var fare = parseFare(f.price);
            var ex = g[from].filter(function(e){ return e.to === to && e.kind === 'taxi'; })[0];
            if (ex){ if (fare != null && (ex.fare == null || fare < ex.fare)){ ex.fare = fare; ex.npc = n.name; } return; }
            g[from].push({ to:to, kind:'taxi', fare:fare, npc:n.name });
          });
        });
      });
    }
    return g;
  }
  function routeBfs(from, to, g){
    if (!g[from] || !g[to]) return null;
    var prev = {}; prev[from] = null;
    var q = [from];
    while (q.length){
      var c = q.shift();
      if (c === to) break;
      (g[c] || []).forEach(function(e){
        if (Object.prototype.hasOwnProperty.call(prev, e.to)) return;
        prev[e.to] = { from:c, edge:e };
        q.push(e.to);
      });
    }
    if (!Object.prototype.hasOwnProperty.call(prev, to)) return null;
    var steps = [], cur = to;
    while (prev[cur]){ steps.unshift({ to:cur, edge:prev[cur].edge, from:prev[cur].from }); cur = prev[cur].from; }
    return steps;
  }
  function hiddenWarpCount(code){
    var m = mapByCode(code);
    return m ? (m.portals || []).filter(function(p){ return p.destX != null; }).length : 0;
  }
  // 시작 위치들 중에서 목표 위치들 중 하나까지 가장 적게 이동하는 경로
  function routeBest(fromCodes, toCodes, g){
    var best = null;
    fromCodes.forEach(function(f){
      toCodes.forEach(function(t){
        if (f === t) return;
        var st = routeBfs(f, t, g);
        if (st && (!best || st.length < best.steps.length)) best = { from:f, to:t, steps:st };
      });
    });
    return best;
  }
  function routeWho(pick, code){
    if (!pick || pick.type === 'map' || pick.type === 'multi') return '';
    if (pick.type === 'town') return pick.icon + ' ' + pick.name;
    var cnt = pick.counts && pick.counts[code];
    return pick.icon + ' ' + pick.name + (cnt ? ' '+cnt+'마리' : '');
  }
  function routeCardHtml(title, best, idx){
    var A = routePick.from, B = routePick.to;
    var steps = best.steps, fromCode = best.from;
    var totalFare = steps.reduce(function(a, st){ return a + (st.edge.kind==='taxi' && st.edge.fare ? st.edge.fare : 0); }, 0);
    var sub = steps.length+'번 이동' + (totalFare ? ' · 택시비 '+totalFare.toLocaleString()+'메소' : '');
    var html = '<div class="rt-card"><div class="rt-card-head"><span class="rt-card-title">'+title+'</span><span class="rt-card-sub">'+esc(sub)+'</span>'+
      '<button type="button" class="wm-clear-btn rt-world" data-route="'+idx+'">🌍 월드맵에서 보기</button></div><ol class="rt-steps">';
    function stepRow(no, code, subText, cls, who){
      var m = mapByCode(code);
      var hw = hiddenWarpCount(code);
      return '<li class="rt-step'+(cls?' '+cls:'')+'" data-open="'+esc(code)+'" role="button" tabindex="0"><span class="rt-no">'+no+'</span><span class="rt-name">'+esc(m?m.name:code)+(who?' <span class="rt-who">'+esc(who)+'</span>':'')+'</span><span class="rt-sub">'+subText+(hw?' <span title="이 맵에는 히든 이동포탈이 있어요">🔮 히든포탈 '+hw+'</span>':'')+'</span></li>';
    }
    html += stepRow('출', fromCode, '출발', '', routeWho(A, fromCode));
    steps.forEach(function(st, i){

      var itemJobs = String(i.job||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      var inJob = itemJobSelect.value==='all' || !isEquip || itemJobs.indexOf(itemJobSelect.value)>-1 || itemJobs.indexOf('공용')>-1;
      var inLevel = !itemLevelInput.value || (isEquip && (i.reqLevel||0) >= Number(itemLevelInput.value));
      return hit && inCat && inJob && inLevel;
    });
    filtered.sort(function(a,b){
      if (itemSortSelect.value === 'id'){
        var na = Number(a.id), nb = Number(b.id);
        if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
        return String(a.id||'').localeCompare(String(b.id||''), 'ko');
      }
      if (itemSortSelect.value === 'level'){
        var la = (itemPathOf(a)[0]==='장비' && a.reqLevel!=null) ? a.reqLevel : Infinity;
        var lb = (itemPathOf(b)[0]==='장비' && b.reqLevel!=null) ? b.reqLevel : Infinity;
        if (la !== lb) return la - lb;
        return String(a.name||'').localeCompare(String(b.name||''), 'ko');
      }
      if (itemSortSelect.value === 'name-desc'){
        return String(b.name||'').localeCompare(String(a.name||''), 'ko');
      }
      if (itemSortSelect.value === 'category'){
        var pa = itemPathOf(a), pb = itemPathOf(b);
        var maxLen = Math.max(pa.length, pb.length);
        for (var lvl=0; lvl<maxLen; lvl++){
          var va = pa[lvl] || '', vb = pb[lvl] || '';
          if (va === vb) continue;
          if (lvl === 0){
            var ia = ITEM_CATEGORIES.indexOf(va); if (ia===-1) ia = ITEM_CATEGORIES.length;
            var ib = ITEM_CATEGORIES.indexOf(vb); if (ib===-1) ib = ITEM_CATEGORIES.length;
            if (ia !== ib) return ia - ib;
          }
          return va.localeCompare(vb, 'ko');
        }
      }
      return String(a.name||'').localeCompare(String(b.name||''), 'ko');
    });
    if (!filtered.length){
      sections.items.innerHTML = '<div class="empty"><div class="big font-display">조건에 맞는 아이템이 없어요</div><div>검색어를 조금 넓혀보세요.</div></div>';
      return;
    }
    var totalPages = Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE));
    if (itemsPage > totalPages) itemsPage = totalPages;
    if (itemsPage < 1) itemsPage = 1;
    var start = (itemsPage-1) * ITEMS_PER_PAGE;
    var pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);
    var cardsHtml = pageItems.map(function(i){

        '<a class="qcard'+(isOwned?' owned':'')+'" href="item-detail.html?id='+i.id+'" title="'+esc(fullPathTitle)+'">'+
          favStarBtn('item', i.id)+

            '</div>'+

        '</a>'
      );
    }).join('');
    sections.items.innerHTML = cardsHtml;

    var pagerEl = document.getElementById('itemsPager');
    var pagerTopEl = document.getElementById('itemsPagerTop');

      pagerEl.innerHTML = '';

      pagerHtml += '<span class="page-info">'+itemsPage+' / '+totalPages+' 페이지 · 총 '+filtered.length+'개</span>';

    Object.keys(QUEST_DETAILS).forEach(function(qid){
      var d = QUEST_DETAILS[qid];
      (d.reqs||[]).forEach(function(r){ if (r.kind==='monster' && r.id && String(r.id)===String(mon.id)) n++; });
    });
    return n;
  }

  function doRenderMonsters(){
    if (!MONSTERS.length){
      sections.monsters.innerHTML = '<div class="empty"><div class="big font-display">몬스터 도감은 아직 준비 중이에요</div><div>조만간 지역별 몬스터 정보로 채워질 예정이에요.</div></div>';
      return;
    }
    var q = monsterSearchInput.value.trim();
    var qn = normQ(q);
    var region = monsterRegionSelect.value;
    var filtered = MONSTERS.filter(function(m){
      var hit = !q || normQ(m.name).indexOf(qn)>-1;
      var inRegion = region==='all' || regionsOfRecord(m).indexOf(region)>-1;
      var rangeVal = monsterLevelRangeSelect.value;
      var inLevelRange = true;
      if (rangeVal !== 'all'){
        var parts = rangeVal.split('-');
        var lo = Number(parts[0]);
        var hi = parts[1] ? Number(parts[1]) : Infinity;
        var lvl = m.minLevel || 0;
        inLevelRange = lvl >= lo && lvl <= hi;
      }
      return hit && inRegion && inLevelRange;
    });
    var monSort = monsterSortSelect.value;
    if (monSort === 'level-asc'){
      filtered.sort(function(a,b){ return (a.minLevel||0) - (b.minLevel||0); });

      filtered.sort(function(a,b){ return (b.minLevel||0) - (a.minLevel||0); });

  function render(){
    var counts = { quests: QUESTS.length, monsters:MONSTERS.length, items:ITEMS.length, npc:NPCS.length, maps:MAPS.length };
    Object.keys(counts).forEach(function(k){ document.getElementById('cnt-'+k).textContent = counts[k]; });

    if (activeTab !== 'quests') return;

    var q = searchInput.value.trim();
    var qn = normQ(q);
    var region = regionSelect.value;
    var lv = syncLevelRange();
    var playerLevel = Number(playerLevelInput.value)||1;
    var bucket = nearestExpBucket(playerLevel);

    var filtered = QUESTS.filter(function(qq){
      var hit = !q || (qq.code&&qq.code.indexOf(q)>-1) || normQ(qq.title).indexOf(qn)>-1 || String(qq.region||'').indexOf(q)>-1;
      var inRegion = region==='all' || qq.region===region;
      var inLevel = !qq.minLevel || (qq.minLevel>=lv[0] && qq.minLevel<=lv[1]);
      var inType = activeType==='all' || primaryType(qq.type)===activeType;
      var jobs = qq.jobs && qq.jobs.length ? qq.jobs : ['전체'];
      var inJob = jobSelect.value==='all' || jobs.indexOf('전체')>-1 || jobs.indexOf(jobSelect.value)>-1 ||
        (jobs.indexOf('초보자')>-1 && EXPLORER_JOBS.indexOf(jobSelect.value)>-1);
      var inFame = !fameOnly || !!fameRewardOf(qq);
      var inHideDone = !hideDone || !doneMap[qq.id];
      var rq = rewardItemSelect.value;
      var inRewardItem = !rq || rq==='all' || (qq.rewards||[]).some(function(r){ return r.name===rq; });
      return hit && inRegion && inLevel && inType && inJob && inFame && inHideDone && inRewardItem;
    });

    var sortMode = sortSelect.value;
    if (sortMode === 'ratio-desc'){
      filtered.sort(function(a,b){ return expRatio(b,bucket) - expRatio(a,bucket); });
    } else if (sortMode === 'ratio-asc'){
      filtered.sort(function(a,b){ return expRatio(a,bucket) - expRatio(b,bucket); });
    } else if (sortMode === 'level-asc'){
      filtered.sort(function(a,b){ return (a.minLevel||0) - (b.minLevel||0); });
    } else if (sortMode === 'level-desc'){
      filtered.sort(function(a,b){ return (b.minLevel||0) - (a.minLevel||0); });
    } else if (sortMode === 'region'){
      filtered.sort(function(a,b){ return String(a.region||'').localeCompare(String(b.region||''), 'ko'); });
    }

    document.getElementById('cnt-quests').textContent = filtered.length + (filtered.length!==QUESTS.length ? ' / '+QUESTS.length : '');

    if (!filtered.length){
      sections.quests.innerHTML = '<div class="empty"><div class="big font-display">조건에 맞는 퀘스트가 없어요</div><div>검색어나 필터를 조금 넓혀보세요.</div></div>';
      return;
    }

    sections.quests.innerHTML = filtered.map(function(qq){
      var info = typeInfo(qq.type);
      var exp = questExp(qq);
      var ratio = expRatio(qq, bucket);
      var link = 'quest-detail.html?id=' + qq.id;
      var jobs = qq.jobs && qq.jobs.length ? qq.jobs : ['전체'];
      var fameReward = fameRewardOf(qq);
      var types = allTypes(qq.type);
      var ribbonHtml = types.map(function(t){
        var ti = typeInfoFor(t);
        return '<span class="ribbon-pill '+ti.cls+'">'+ICONS[ti.icon]+' '+t+'</span>';
      }).join('');
      var questTitleAttr = (qq.code?qq.code+' · ':'') + qq.title + ' · ' + types.join(', ') + ' · ' + (qq.region||'-') + ' · Lv.'+(qq.minLevel||'-') + ' · 가능 직업: '+jobs.join(', ');
      return (
        '<div class="qcard '+info.cls+'" data-quest-id="'+qq.id+'">'+
          favStarBtn('quest', qq.id)+
          '<div class="ribbon">'+ribbonHtml+'</div>'+
          '<a class="card-body" href="'+link+'" title="'+esc(questTitleAttr)+'">'+
            '<div class="top">'+
              safeImg(qq.npcImg, qq.title, 'thumb')+
              '<div class="meta-title">'+
                '<div class="code">'+(qq.code||'')+'</div>'+
                '<div class="title">'+qq.title+'</div>'+
                '<div class="meta">'+(qq.region||'-')+' · Lv.'+(qq.minLevel||'-')+'</div>'+
                '<div class="job-row">가능 직업: '+jobs.join(', ')+'</div>'+
                (fameReward ? '<div class="fame-chip">⭐ 인기도 +'+fameReward.fame+'</div>' : '')+
              '</div>'+
            '</div>'+
            '<div class="exp-row">'+
              '<div class="bar"><div style="width:'+Math.max(0,Math.min(100,ratio))+'%"></div></div>'+
              '<div class="exp-text">EXP '+fmt(exp)+' · 비율 '+ratio+'%</div>'+
            '</div>'+
            (itemRewardsOf(qq).length ? '<div class="reward-names">보상: '+itemRewardsOf(qq).map(function(r){return r.name+(r.qty?' ×'+r.qty:'');}).join(', ')+'</div>' : '')+
          '</a>'+
          '<div class="complete-zone">'+completeZoneHTML(qq)+'</div>'+
        '</div>'
      );
    }).join('');
  }

  function handleCompleteZoneClick(e){
    var completeBtn = e.target.closest('.complete-btn');

      var qq1 = questById(id1);
      var items1 = itemRewardsOf(qq1);
      if (qq1.rewardChoice && items1.length > 1){
        refreshCompleteZone(id1, 'choose');
      } else {
        var rewardText1 = items1.length ? items1.map(function(it){ return it.name+(it.qty?' ×'+it.qty:''); }).join(', ') : null;
        doneMap[id1] = { reward: rewardText1 };
        saveDone(doneMap);
        refreshCompleteZone(id1);
      }
      return;
    }
    var confirmBtn = e.target.closest('.choice-confirm-btn');
    if (confirmBtn){
      var id2 = confirmBtn.getAttribute('data-confirm-id');
      var zone2 = confirmBtn.closest('.complete-zone');
      var checked = zone2.querySelector('input[type="radio"]:checked');
      doneMap[id2] = { reward: checked ? checked.value : null };
      saveDone(doneMap);
      refreshCompleteZone(id2);
      return;
    }
    var undoBtn = e.target.closest('.undo-btn');
    if (undoBtn){
      var id3 = undoBtn.getAttribute('data-undo-id');
      delete doneMap[id3];
      saveDone(doneMap);
      refreshCompleteZone(id3);
      return;

    function buildQuestChainHtml(qid){

  function openPanel(type, id, opts){
    opts = opts || {};
    if (!opts.isBack){
      if (opts.fromInternal && currentPanel) panelHistory.push(currentPanel);
      else if (!opts.fromInternal) panelHistory = [];
    }
    currentPanel = { type: type, id: id };
    panelContent.innerHTML = renderPanelContent(type, id);
    Array.prototype.forEach.call(panelContent.querySelectorAll('.item-tile'), function(el){
      el.addEventListener('mouseenter', function(){
        var tip = el.querySelector('.item-tooltip, .map-preview');
        if (!tip) return;
        el.classList.remove('tooltip-flip');
        var boundRight = panelBox.getBoundingClientRect().right;
        var elRect = el.getBoundingClientRect();
        var tipWidth = tip.offsetWidth || 220;
        if (elRect.left + tipWidth > boundRight - 8){
          el.classList.add('tooltip-flip');
        }
      });
    });
    panelOverlay.classList.remove('hidden');
    panelBox.classList.toggle('wide', type === 'npc' || type === 'map' || type === 'recentAdds');
    panelBackBtn.classList.toggle('hidden', panelHistory.length === 0);
    panelShareBtn.classList.toggle('hidden', type === 'changelog' || type === 'recentAdds' || type === 'myloc');
    panelBox.scrollTop = 0;
    if (type === 'map'){
      Array.prototype.forEach.call(panelContent.querySelectorAll('[data-native-width]'), function(zEl){
        var nativeW = parseFloat(zEl.getAttribute('data-native-width'));
        if (!nativeW) return;
        var wrap = zEl.parentElement;
        var avail = wrap ? wrap.clientWidth : 0;
        if (!avail) return;
        var fit = Math.min(1, avail / nativeW);
        fit = Math.max(0.1, fit);
        zEl.setAttribute('data-scale', fit);
        zEl.setAttribute('data-fit-scale', fit);
        zEl.style.zoom = fit;
        var lbl = document.getElementById(zEl.id + '-label');
        if (lbl) lbl.textContent = Math.round(fit * 100) + '%';
      });
    }
    recordRecentView(type, id);
    var currentChip = panelContent.querySelector('.chain-chip.current');
    if (currentChip){
      currentChip.scrollIntoView({ block: 'nearest', inline: 'center' });
    }
  }

    switchTab('maps');
    if (initLoc){
      worldMapRegion = initLoc.region;
      worldMapSub = null;
      setMapView('world');
      setTimeout(function(){
        var stage = worldMapStageWrap.querySelector('.worldmap-stage');
        var data = (window.WORLD_MAPS||{})[initLoc.region];
        if (stage && data){
          var bw = data.baseWidth||1280, bh = data.baseHeight||940;
          var xPct = initLoc.point.x/bw*100, yPct = initLoc.point.y/bh*100;
          var mark = document.createElement('div');
          mark.style.cssText = 'position:absolute;left:'+xPct+'%;top:'+yPct+'%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;border:5px solid #ff2d2d;box-shadow:0 0 0 8px rgba(255,45,45,.4);pointer-events:none;animation:warpPulse 1s ease-out 3;z-index:60;';
          stage.appendChild(mark);
          setTimeout(function(){ mark.remove(); }, 3200);
        }
      }, 60);
    } else {
      setMapView('world');
    }
  }

  // 상세 페이지의 "월드맵에서 보기" 링크 (index.html?wm=monster:100000 / npc:1031000 / item:2000002)
  var initialWm = new URLSearchParams(location.search).get('wm');
  if (initialWm){ wmOpenFor(initialWm); }

  // 상세 페이지의 "여기 가는 법" 링크 (index.html?routeTo=map:200010000 / npc:1031000 / monster:100000)
  var initialRouteTo = new URLSearchParams(location.search).get('routeTo');
  if (initialRouteTo){
    var rtIdx = initialRouteTo.indexOf(':');
    if (rtIdx > -1){
      var rtKind = initialRouteTo.slice(0, rtIdx), rtId = initialRouteTo.slice(rtIdx + 1);
      switchTab('maps');
      routeSetPick('to', rtKind, rtId);
      setMapView('route');
      setTimeout(function(){
        var box = document.getElementById('routeView');
        if (box) box.scrollIntoView({ behavior:'smooth', block:'start' });
      }, 60);
    }
  }
})();
</script>
</body>
</html>
